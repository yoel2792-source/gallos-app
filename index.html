      .htree { display: inline-flex; align-items: center; padding: 8px 4px; }
      .htree-node { display: flex; align-items: center; }
      .htree-sub {
        margin-left: 26px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      /* línea horizontal desde la tarjeta padre hasta el eje vertical */
      .htree-sub::before {
        content: '';
        position: absolute;
        left: -26px;
        top: 50%;
        width: 26px;
        border-top: 2px solid #cbd5e1;
      }
      .htree-child {
        position: relative;
        padding-left: 26px;
        margin: 7px 0;
        display: flex;
        align-items: center;
      }
      /* eje vertical que une a los hijos (cada hijo dibuja su tramo) */
      .htree-child::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        border-left: 2px solid #cbd5e1;
      }
      .htree-child:first-child::before { top: 50%; height: 50%; }
      .htree-child:last-child::before  { top: 0;   height: 50%; }
      .htree-child:only-child::before  { display: none; }
      /* tramo horizontal que entra a cada hijo */
      .htree-child::after {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        width: 26px;
        border-top: 2px solid #cbd5e1;
      }
      /* ===== PEDIGRÍ (conectores compactos) ===== */
      .ped { display: inline-flex; align-items: center; padding: 10px; }
      .ped-node { display: flex; align-items: center; }
      .ped-sub { margin-left: 14px; position: relative; display: flex; flex-direction: column; justify-content: center; }
      .ped-sub::before { content: ''; position: absolute; left: -14px; top: 50%; width: 14px; border-top: 2px solid #cbd5e1; }
      .ped-child { position: relative; padding-left: 14px; margin: 5px 0; display: flex; align-items: center; }
      .ped-child::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; border-left: 2px solid #cbd5e1; }
      .ped-child:first-child::before { top: 50%; height: 50%; }
      .ped-child:last-child::before { top: 0; height: 50%; }
      .ped-child::after { content: ''; position: absolute; left: 0; top: 50%; width: 14px; border-top: 2px solid #cbd5e1; }
      .htree-scroll { overflow: auto; -webkit-overflow-scrolling: touch; }
      .htree-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
      .htree-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

// ============================================
// ERROR BOUNDARY — muestra el error en pantalla en vez de página en blanco
// ============================================
class ErrorBoundary extends Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: '20px', fontFamily: 'monospace', background: '#fff' }}>
          <h2 style={{ color: 'red' }}>⚠️ Error en la app</h2>
          <pre style={{ background: '#fee', padding: '12px', borderRadius: '8px', fontSize: '12px', whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>
            {this.state.error.toString()}{'\n\n'}{this.state.error.stack}
          </pre>
        </div>
      );
    }
    return this.props.children;
  }
}

// ============================================
const Toast = ({ message, type, onClose }) => {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  const bg = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-green-500' : 'bg-blue-500';
  return (
    <div className={`fixed top-4 right-4 left-4 md:left-auto md:w-80 ${bg} text-white px-4 py-3 rounded-lg shadow-lg z-50 fade-in`}>

};

// ============================================
// COMPONENTE: Modal genérico
// ============================================
const Modal = ({ title, onClose, children, wide }) => (
  <div className="fixed inset-0 modal-overlay z-40 flex items-end md:items-center justify-center p-0 md:p-4" onClick={onClose}>

);

// ============================================
// COMPONENTE: Campo de formulario
// ============================================
const Field = ({ label, children, required }) => (
  <div>
    <label className="block text-sm font-medium text-gray-700 mb-1">
      {label} {required && <span className="text-red-500">*</span>}
    </label>
    {children}

);

const Input = (props) => <input {...props} className={`w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none ${props.className || ''}`} />;
const Select = ({ options, ...props }) => (
  <select {...props} className="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none">
    {options.map(o => <option key={typeof o === 'string' ? o : o.value} value={typeof o === 'string' ? o : o.value}>{typeof o === 'string' ? o : o.label}</option>)}
  </select>
);
const Textarea = (props) => <textarea {...props} className="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none h-20" />;

// Componente visor de foto (lightbox)
const PhotoViewer = ({ src, onClose }) => {
  if (!src) return null;
  return (
    <div className="fixed inset-0 z-[9999] bg-black/90 flex items-center justify-center p-4" onClick={onClose}>
      <button onClick={onClose} className="absolute top-4 right-4 w-10 h-10 bg-white/20 text-white rounded-full text-2xl flex items-center justify-center hover:bg-white/40">✕</button>

    </div>
  );
};

// Componente para subir una foto (perfil del gallo)
const PhotoUpload = ({ value, onChange, label }) => {
  const fileRef = useRef();
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { alert('La imagen debe ser menor a 2MB'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => onChange(ev.target.result);
    reader.readAsDataURL(file);
  };
  return (
    <div>
      <p className="text-sm font-medium text-gray-700 mb-1">{label || 'Foto'}</p>
      {value ? (
        <div className="relative inline-block">
          <img src={value} className="w-24 h-24 object-cover rounded-lg border-2 border-gray-200" />
          <button onClick={() => onChange(null)} className="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center">✕</button>
        </div>
      ) : (
        <button onClick={() => fileRef.current.click()} className="w-24 h-24 border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center text-gray-400 hover:border-red-400 hover:text-red-400 transition">
          <span className="text-2xl">📷</span>
          <span className="text-[10px] mt-1">Agregar</span>
        </button>
      )}
      <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/webp,image/heic" className="hidden" onChange={handleFile} />
    </div>
  );
};

// Componente para subir múltiples fotos (entrenamientos)
const MultiPhotoUpload = ({ values, onChange, label }) => {
  const fileRef = useRef();
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { alert('La imagen debe ser menor a 2MB'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => onChange([...(values || []), ev.target.result]);
    reader.readAsDataURL(file);
  };
  const removeAt = (i) => onChange(values.filter((_, idx) => idx !== i));
  return (
    <div>
      <p className="text-sm font-medium text-gray-700 mb-1">{label || 'Fotos'}</p>
      <div className="flex gap-2 flex-wrap">
        {(values || []).map((src, i) => (
          <div key={i} className="relative">
            <img src={src} className="w-20 h-20 object-cover rounded-lg border-2 border-gray-200" />
            <button onClick={() => removeAt(i)} className="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white rounded-full text-[10px] flex items-center justify-center">✕</button>
          </div>
        ))}
        <button onClick={() => fileRef.current.click()} className="w-20 h-20 border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center text-gray-400 hover:border-green-400 hover:text-green-400 transition">
          <span className="text-xl">📷</span>
          <span className="text-[9px]">+ Foto</span>
        </button>
      </div>
      <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/webp,image/heic" className="hidden" onChange={handleFile} />
    </div>
  );
};

// ============================================
// COMPONENTE: Búsqueda de Gallo (reutilizable)
// ============================================
const GalloSearch = ({ gallos, onSelect, selected, onClear, placeholder, filter }) => {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const ref = useRef();

  const filtered = useMemo(() => {
    if (!q) return [];
    const query = q.toLowerCase();
    let list = gallos;
    if (filter) list = list.filter(filter);
    return list.filter(g =>
      (g.nombre && g.nombre.toLowerCase().includes(query)) ||
      (g.numero_pinches && g.numero_pinches.toString().includes(query))
    ).slice(0, 10);
  }, [q, gallos, filter]);

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  if (selected) {
    return (
      <div className="flex items-center gap-2 p-2.5 bg-red-50 border border-red-200 rounded-lg">
        <span className="flex-1 text-sm font-medium text-red-800">
          {selected.nombre || ''} {selected.numero_pinches ? `(#${selected.numero_pinches})` : ''}
        </span>
        <button onClick={onClear} className="text-xs text-red-600 hover:text-red-800 font-medium">Cambiar</button>
      </div>
    );
  }

  return (
    <div className="relative" ref={ref}>
      <Input
        type="text" placeholder={placeholder || 'Buscar gallo...'}
        value={q} onChange={e => { setQ(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
      />
      {open && q && (
        <div className="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-30 max-h-48 overflow-y-auto">
          {filtered.length > 0 ? filtered.map(g => (
            <button key={g.id} onClick={() => { onSelect(g); setQ(''); setOpen(false); }}
              className="w-full text-left px-3 py-2.5 hover:bg-red-50 border-b border-gray-100 last:border-0">
              <p className="font-medium text-gray-800 text-sm">{g.nombre || 'Sin nombre'} {g.numero_pinches ? `(#${g.numero_pinches})` : ''}</p>
              <p className="text-xs text-gray-500">{g.linea_genetica || 'Sin línea'} • {g.sexo} {g.amarrado ? '• Amarrado' : ''}</p>
            </button>
          )) : <p className="px-3 py-2.5 text-sm text-gray-400">No encontrado</p>}
        </div>
      )}
    </div>
  );
};

                  <div className="flex flex-wrap gap-1.5">

// ============================================
// HELPERS COMPARTIDOS
// ============================================
const nombreGallo = (g) => {
  if (!g) return 'Desconocido';
  return g.nombre || (g.numero_pinches ? '#' + g.numero_pinches : 'Sin nombre');
};
const sexoIcon = (g) => (g && g.sexo === 'Gallina' ? '♀' : g && g.sexo === 'Pollo' ? '🐣' : '♂');

// ============================================
// MOTOR HEURÍSTICO DE PREDICCIÓN DE CRÍA
// Combina las características de padre, madre, abuelos y bisabuelos
// con ponderación por generación (0.5^gen) y refuerzos de "Produce X".
// ============================================
const PRODUCE_BOOST = {
  'Produce velocidad':    ['Rápido', 'Explosivo'],
  'Produce inteligencia': ['Preciso', 'Lento pero certero', 'Constante', 'Calmado'],
  'Produce resistencia':  ['Buen pulmón', 'Resistente', 'Se recupera rápido'],
  'Produce fuerza':       ['Poderoso', 'Empuja', 'Pesado'],
};

// Recolecta el linaje de ambos padres con su peso genético por generación.
const lineageSources = (padre, madre, gallos, maxGen = 3) => {
  const out = [];
  const seen = new Set();
  const rec = (g, gen) => {
    if (!g || gen > maxGen) return;
    const w = Math.pow(0.5, gen - 1); // gen1 (padre/madre)=1, gen2=0.5, gen3=0.25
    out.push({ g, w, gen });
    // Evitar loops si hay datos circulares
    const key = g.id + ':' + gen;
    if (seen.has(key)) return;
    seen.add(key);
    rec(gallos.find(x => x.id === g.padre_id), gen + 1);
    rec(gallos.find(x => x.id === g.madre_id), gen + 1);
  };
  rec(padre, 1);
  rec(madre, 1);
  return out;
};
const GEN_LABEL = { 1: 'Padres', 2: 'Abuelos', 3: 'Bisabuelos' };

const predecirCruce = (padre, madre, gallos) => {
  const sources = lineageSources(padre, madre, gallos, 3);

  // Refuerzos activos de "Produce X" presentes en el linaje
  const boosts = {};
  sources.forEach(({ g, w }) => (g.caracteristicas || []).forEach(c => {
    if (PRODUCE_BOOST[c]) PRODUCE_BOOST[c].forEach(t => { boosts[t] = (boosts[t] || 0) + w * 0.35; });
  }));

  // Distribución por categoría/subgrupo (excluye la categoría de reproducción)
  const categorias = CATS_CARACTERISTICAS.filter(c => c.id !== 'genetica').map(cat => {
    const subs = cat.subs.map(sub => {
      const weights = {};
      const contrib = {};
      sub.opts.forEach(o => { weights[o] = 0; contrib[o] = []; });
      sources.forEach(({ g, w, gen }) => (g.caracteristicas || []).forEach(c => {
        if (c in weights) {
          weights[c] += w;
          contrib[c].push({ nombre: nombreGallo(g), gen });
        }
      }));
      // Aplicar refuerzos
      Object.keys(weights).forEach(o => { if (boosts[o]) weights[o] += boosts[o]; });
      const total = Object.values(weights).reduce((a, b) => a + b, 0);
      const dist = sub.opts
        .map(o => ({
          trait: o,
          pct: total > 0 ? Math.round((weights[o] / total) * 100) : 0,
          contribuyentes: contrib[o],
          desc: LEYENDA[o] || '',
        }))
        .filter(x => x.pct > 0)
        .sort((a, b) => b.pct - a.pct);
      return { label: sub.label, dist, hasData: total > 0 };
    }).filter(s => s.hasData);
    return { cat: cat.label, id: cat.id, color: cat.color, subs };
  }).filter(c => c.subs.length > 0);

  // Tendencias reproductivas (categoría genética): qué "produce" cada padre
  const reproTraits = (CATS_CARACTERISTICAS.find(c => c.id === 'genetica')?.subs || [])
    .flatMap(s => s.opts);
  const repro = [];
  reproTraits.forEach(t => {
    const fuentes = sources.filter(s => (s.g.caracteristicas || []).includes(t));
    if (fuentes.length > 0) {
      repro.push({ trait: t, desc: LEYENDA[t] || '', fuentes: fuentes.map(f => ({ nombre: nombreGallo(f.g), gen: f.gen })) });
    }
  });

  // Confianza: más linaje con datos = más confianza
  let c = 8;
  sources.forEach(s => { if (s.g && (s.g.caracteristicas || []).length) c += s.w * 17; });
  const confianza = Math.min(95, Math.round(c));

  const linajeInfo = {
    padres: sources.filter(s => s.gen === 1).length,
    abuelos: sources.filter(s => s.gen === 2).length,
    bisabuelos: sources.filter(s => s.gen === 3).length,
    conDatos: sources.filter(s => (s.g.caracteristicas || []).length).length,
    total: sources.length,
  };

  return { categorias, repro, confianza, linajeInfo };
};

// ============================================
// ÁRBOL GENEALÓGICO HORIZONTAL (expandible)
// ============================================
const rolAncestro = (gen, esHembra) => {

  if (gen === 3) return esHembra ? 'Bisabuela' : 'Bisabuelo';
  if (gen === 4) return esHembra ? 'Tatarabuela' : 'Tatarabuelo';
  return 'Ancestro';
};

// Nodo hacia adelante (descendientes)

};

// ============================================
// PEDIGRÍ — árbol único: ancestros en horizontal + hermanos + hijos
// Azul = por parte de padre · Rosa = por parte de madre · Ámbar = ancestro repetido
// ============================================
const PED_CARD_W = 122;
const pedRol = (gen, hembra) =>
  gen === 1 ? (hembra ? 'Madre' : 'Padre')
  : gen === 2 ? (hembra ? 'Abuela' : 'Abuelo')
  : gen === 3 ? (hembra ? 'Bisabuela' : 'Bisabuelo')
  : (hembra ? 'Tatarabuela' : 'Tatarabuelo');
const pedPct = (frac) => { const p = frac * 100; return (Number.isInteger(p) ? p : +p.toFixed(p < 10 ? 2 : 1)) + '%'; };

// Sangre por ancestro: de qué gallos y gallinas viene. Se reparte 50/50 hacia atrás hasta
// llegar a los que no tienen padres registrados (los "fundadores").
const sangreAncestros = (id, byId, maxGen) => {
  maxGen = maxGen || 8;
  const out = new Map();
  const add = (key, nombre, g, w) => { const o = out.get(key) || { key, nombre, g, frac: 0 }; o.frac += w; out.set(key, o); };
  const rec = (gid, w, gen, path) => {
    const g = gid ? byId.get(gid) : null;
    if (!g) { add('?', 'Desconocido', null, w); return; }
    const p = byId.has(g.padre_id) ? g.padre_id : null;
    const m = byId.has(g.madre_id) ? g.madre_id : null;
    if ((!p && !m) || gen >= maxGen || path.has(gid)) { add(g.id, nombreGallo(g), g, w); return; }
    const np = new Set(path); np.add(gid);
    [p, m].forEach(x => { if (x) rec(x, w / 2, gen + 1, np); else add('?', 'Desconocido', null, w / 2); });
  };
  rec(id, 1, 0, new Set());
  return out;
};
const sangreLista = (map) => [...map.values()].sort((a, b) => (a.key === '?') - (b.key === '?') || b.frac - a.frac);
const sangreCria = (padreId, madreId, byId) => {
  const out = new Map();
  [padreId, madreId].forEach(pid => sangreAncestros(pid, byId).forEach(o => {
    const x = out.get(o.key) || { key: o.key, nombre: o.nombre, g: o.g, frac: 0 };
    x.frac += o.frac / 2; out.set(o.key, x);
  }));
  return sangreLista(out);
};

// Cuánta sangre de cada ancestro lleva un animal (él mismo = 100%)
const aporteAncestros = (id, byId, maxGen) => {
  maxGen = maxGen || 8;
  const m = new Map();
  const rec = (x, e, path) => {
    if (!x || !byId.has(x) || e > maxGen || path.has(x)) return;
    m.set(x, (m.get(x) || 0) + Math.pow(0.5, e));
    const g = byId.get(x); const np = new Set(path); np.add(x);
    rec(g.padre_id, e + 1, np); rec(g.madre_id, e + 1, np);
  };
  rec(id, 0, new Set());
  return m;
};

// Ancestros que salen por los dos lados (padre y madre) con el % de sangre que dejan en la cría.
// Se omiten los que solo se repiten "a través" de otro repetido más cercano.
const repetidosAmbosLados = (padre, madre, gallos, byId) => {
  const A = aporteAncestros(padre.id, byId), B = aporteAncestros(madre.id, byId);
  const comunes = [...A.keys()].filter(id => B.has(id));
  const set = new Set(comunes);
  return comunes.filter(id => {
    const hijos = gallos.filter(g => set.has(g.id) && (g.padre_id === id || g.madre_id === id));
    if (hijos.length === 0) return true;
    const viaA = hijos.reduce((s, h) => s + A.get(h.id) / 2, 0), viaB = hijos.reduce((s, h) => s + B.get(h.id) / 2, 0);
    return Math.abs(A.get(id) - viaA) > 1e-9 || Math.abs(B.get(id) - viaB) > 1e-9;
  }).map(id => ({ g: byId.get(id), porPadre: A.get(id), porMadre: B.get(id), total: (A.get(id) + B.get(id)) / 2 }))
    .sort((a, b) => b.total - a.total);
};

// Igual que aporteAncestros pero contando por cuántos caminos sale cada uno
const aporteDetalle = (id, byId, maxGen) => {
  maxGen = maxGen || 8;
  const m = new Map();
  const rec = (x, e, path, via) => {
    if (!x || !byId.has(x) || e > maxGen || path.has(x)) return;
    const o = m.get(x) || { g: byId.get(x), frac: 0, veces: 0, via: new Set() };
    o.frac += Math.pow(0.5, e); o.veces += 1; if (via) o.via.add(via); m.set(x, o);
    const g = byId.get(x); const np = new Set(path); np.add(x);
    rec(g.padre_id, e + 1, np, x); rec(g.madre_id, e + 1, np, x);
  };
  rec(id, 0, new Set(), null);
  return m;
};
// Marca como "repetido" solo al que se repite por cuenta propia, no al que sale dos veces
// únicamente porque es padre o abuelo de otro que ya se repite.
const marcarRepetidos = (det) => {
  det.forEach(o => {
    const maxHijo = Math.max(0, ...[...o.via].map(c => det.has(c) ? det.get(c).veces : 0));
    o.rep = o.veces > 1 && o.veces > maxHijo;
  });
  return det;
};
// Ordena la sangre más fuerte: primero los que se repiten, luego por porciento.
// "directos" (padre y madre) solo se listan si se repiten, porque siempre son 50%.
const rankingSangre = (det, omitir, directos, max) => {
  marcarRepetidos(det);
  const todos = [...det.values()].filter(o => !omitir.has(o.g.id) && (o.rep || !directos.has(o.g.id)));
  todos.sort((a, b) => (b.rep ? 1 : 0) - (a.rep ? 1 : 0) || b.frac - a.frac || a.veces - b.veces);
  const repetidos = todos.filter(o => o.rep);
  return todos.slice(0, Math.max(max || 5, Math.min(repetidos.length, 8)));
};

const SangreFuerte = ({ items, sujeto }) => {
  if (items.length === 0) return <p className="text-xs text-gray-400">No hay abuelos registrados todavía.</p>;
  const tope = Math.max.apply(null, items.map(o => o.frac));
  const hayRep = !!items[0].rep;
  return (
    <div className="space-y-2">
      {items.map((o, i) => (
        <div key={o.g.id}>
          <div className="flex items-center justify-between gap-2 text-xs">
            <span className="min-w-0 truncate">
              <span className={`font-semibold ${o.rep ? 'text-amber-900' : 'text-gray-700'}`}>{sexoIcon(o.g)} {nombreGallo(o.g)}</span>
              {o.rep && <span className="ml-1.5 text-[10px] font-bold bg-amber-400 text-amber-900 px-1.5 py-0.5 rounded-full">sale {o.veces} veces</span>}
              {i === 0 && hayRep && <span className="ml-1 text-[10px] font-bold text-amber-700">💪 el más fuerte</span>}
            </span>
            <b className={`flex-shrink-0 ${o.rep ? 'text-amber-900 text-sm' : 'text-gray-800'}`}>{pedPct(o.frac)}</b>
          </div>
          <div className="h-2 rounded-full bg-gray-100 mt-1 overflow-hidden">
            <div className="h-2 rounded-full" style={{ width: (o.frac / tope * 100) + '%', background: o.rep ? '#f59e0b' : '#94a3b8' }} />
          </div>
        </div>
      ))}
      <p className="text-[11px] text-gray-400">% de la sangre de {sujeto} que viene de cada uno. Los que salen más de una vez suman cada vez que aparecen.</p>
    </div>
  );
};

const BarraSangre = ({ comp, max }) => {
  max = max || 7;
  let items = comp;
  if (comp.length > max) {
    const top = comp.filter(c => c.key !== '?').slice(0, max - 1);
    const resto = comp.filter(c => top.indexOf(c) === -1);
    items = top.concat([{ key: 'otros', nombre: `Otros (${resto.length})`, frac: resto.reduce((s, c) => s + c.frac, 0) }]);
  }
  const color = (c, i) => (c.key === '?' || c.key === 'otros') ? '#9ca3af' : LINEA_PALETTE[i % LINEA_PALETTE.length];
  return (
    <div>
      <div className="flex h-4 rounded-full overflow-hidden bg-gray-100">
        {items.map((c, i) => <div key={c.key} style={{ width: (c.frac * 100) + '%', background: color(c, i) }} />)}
      </div>
      <div className="mt-2 space-y-1">
        {items.map((c, i) => (
          <div key={c.key} className="flex items-center justify-between text-xs text-gray-700">
            <span className="flex items-center gap-1.5 min-w-0">
              <span className="inline-block w-2.5 h-2.5 rounded-sm flex-shrink-0" style={{ background: color(c, i) }} />
              <span className="truncate">{c.g ? sexoIcon(c.g) + ' ' : ''}{c.nombre}</span>
            </span>
            <b className="text-gray-900 ml-2 flex-shrink-0">{pedPct(c.frac)}</b>
          </div>
        ))}
      </div>

};

const PedCard = ({ g, gen, lado, hembra, veces, onSelect }) => {
  const raiz = gen === 0;
  const tono = !g ? 'border-dashed border-gray-300 bg-gray-50'
    : raiz ? 'border-red-500 bg-red-50'
    : lado === 'p' ? 'border-blue-300 bg-blue-50' : 'border-pink-300 bg-pink-50';
  const esHembra = g ? g.sexo === 'Gallina' : hembra;
  return (
    <div onClick={g && !raiz ? () => onSelect(g.id) : undefined}
      className={`relative rounded-lg border-2 px-2 py-1.5 ${tono} ${veces > 1 ? 'ring-2 ring-amber-400' : ''} ${g && !raiz ? 'cursor-pointer active:opacity-70' : ''}`}
      style={{ width: PED_CARD_W }}>

// ============================================
// ÁRBOL FAMILIAR (estilo genealógico con parejas ♥ y color por línea)
// ============================================
const FT_SLOT = 104, FT_GENV = 150, FT_R = 30;
const LINEA_PALETTE = ['#2563eb', '#dc2626', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#db2777', '#ca8a04', '#4f46e5', '#0d9488', '#65a30d', '#e11d48', '#7c3aed', '#059669'];

const ftBuildModel = (gallos, cruces) => {
  cruces = cruces || [];
  const byId = new Map(gallos.map(g => [g.id, g]));
  const has = id => !!(id && byId.has(id));
  const unions = new Map();
  const keyOf = (p, m) => (p || 'NA') + '|' + (m || 'NA');
  const ensureUnion = (p, m) => {
    const k = keyOf(p, m);
    if (!unions.has(k)) unions.set(k, { padreId: has(p) ? p : null, madreId: has(m) ? m : null, childIds: [] });
    return unions.get(k);
  };
  gallos.forEach(g => { if (has(g.padre_id) || has(g.madre_id)) ensureUnion(g.padre_id, g.madre_id).childIds.push(g.id); });
  cruces.forEach(c => { if (has(c.padre_id) || has(c.madre_id)) ensureUnion(c.padre_id, c.madre_id); });
  const unionsByPerson = new Map();
  const addUP = (pid, u, spouseId) => { if (!pid) return; if (!unionsByPerson.has(pid)) unionsByPerson.set(pid, []); unionsByPerson.get(pid).push({ union: u, spouseId }); };
  for (const u of unions.values()) { addUP(u.padreId, u, u.madreId); addUP(u.madreId, u, u.padreId); }
  const depthCache = new Map();
  const depth = (id, guard) => {
    guard = guard || new Set();
    if (!has(id)) return 0;
    if (depthCache.has(id)) return depthCache.get(id);
    if (guard.has(id)) return 0;
    guard.add(id);
    const g = byId.get(id);
    const dp = has(g.padre_id) ? depth(g.padre_id, guard) + 1 : 0;
    const dm = has(g.madre_id) ? depth(g.madre_id, guard) + 1 : 0;
    const d = Math.max(dp, dm); depthCache.set(id, d); return d;
  };
  return { byId, has, unions, unionsByPerson, depth };
};

const ftLayoutDescendants = (rootIds, model, startDepth, opts) => {
  startDepth = startDepth || 0; opts = opts || {};
  const useFallback = opts.fallback !== false;
  const placed = new Set(), placedX = new Map(), ownedUnions = new Set();
  const nodes = [], coupleLinks = [], childLinks = [];
  let cursor = 0;
  const unionsOf = pid => (model.unionsByPerson.get(pid) || []).filter((up, i, arr) => arr.findIndex(x => x.union === up.union) === i);
  const placePerson = (id, x, y) => { nodes.push({ id, x, y }); placedX.set(id, x); };
  const expand = (pid, depth) => {
    if (placed.has(pid)) return placedX.has(pid) ? placedX.get(pid) : null;
    placed.add(pid);
    const y = depth * FT_GENV;
    const ups = unionsOf(pid).filter(up => !ownedUnions.has(up.union));
    ups.forEach(up => ownedUnions.add(up.union));
    const childCenters = [];
    ups.forEach(up => (up.union.childIds || []).forEach(cid => {
      if (placed.has(cid)) { if (placedX.has(cid)) childCenters.push(placedX.get(cid)); return; }
      const cx = expand(cid, depth + 1);
      if (cx != null) childCenters.push(cx);
    }));
    const headerMembers = [pid];
    ups.forEach(up => { if (up.spouseId && !placed.has(up.spouseId) && headerMembers.indexOf(up.spouseId) === -1) headerMembers.push(up.spouseId); });
    const headerWidth = headerMembers.length * FT_SLOT;
    let headerCenter;
    if (childCenters.length > 0) {
      headerCenter = (Math.min.apply(null, childCenters) + Math.max.apply(null, childCenters)) / 2;
      const left = headerCenter - headerWidth / 2;
      if (left < cursor) headerCenter += (cursor - left);
    } else { headerCenter = cursor + headerWidth / 2; }
    cursor = Math.max(cursor, headerCenter + headerWidth / 2 + FT_SLOT * 0.15);
    const startX = headerCenter - headerWidth / 2 + FT_SLOT / 2;
    const memberX = {};
    headerMembers.forEach((mid, i) => { const x = startX + i * FT_SLOT; memberX[mid] = x; placed.add(mid); placePerson(mid, x, y); });
    for (let i = 0; i < headerMembers.length - 1; i++) coupleLinks.push({ ax: memberX[headerMembers[i]], bx: memberX[headerMembers[i + 1]], y });
    if (childCenters.length > 0) {
      const busY = y + FT_GENV * 0.5, famBottomY = y + FT_R, childTopY = (depth + 1) * FT_GENV - FT_R;
      childCenters.forEach(cx => childLinks.push({ famCx: headerCenter, famBottomY, busY, childX: cx, childTopY }));
    }
    return headerCenter;
  };
  rootIds.forEach(rid => { if (!placed.has(rid)) expand(rid, startDepth); });
  if (useFallback) {
    [...model.byId.keys()].filter(id => !placed.has(id)).sort((a, b) => model.depth(a) - model.depth(b))
      .forEach(id => { if (!placed.has(id)) expand(id, startDepth); });
  }
  return { nodes, coupleLinks, childLinks };
};

const ftFullRoots = model => {
  const isFounder = g => !model.has(g.padre_id) && !model.has(g.madre_id);
  return [...model.byId.values()].filter(g => g.sexo !== 'Gallina' && isFounder(g)).map(g => g.id);
};

const ftLayoutFocus = (focusId, model) => {
  const desc = ftLayoutDescendants([focusId], model, 0, { fallback: false });
  const ancNodes = [], ancLinks = [];
  const focusNode = desc.nodes.find(n => n.id === focusId);
  const fx = focusNode ? focusNode.x : 0;
  const up = (id, gen, x, spanW) => {
    const g = model.byId.get(id);
    if (!g) return;
    const padre = model.has(g.padre_id) ? g.padre_id : null;
    const madre = model.has(g.madre_id) ? g.madre_id : null;
    if (!padre && !madre) return;
    const y = -gen * FT_GENV, childY = -(gen - 1) * FT_GENV, half = spanW / 2;
    const px = x - half / 2, mx = x + half / 2;
    if (padre) { ancNodes.push({ id: padre, x: px, y }); ancLinks.push({ x1: x, y1: childY - FT_R, x2: px, y2: y + FT_R }); up(padre, gen + 1, px, spanW / 2); }
    if (madre) { ancNodes.push({ id: madre, x: mx, y }); ancLinks.push({ x1: x, y1: childY - FT_R, x2: mx, y2: y + FT_R }); up(madre, gen + 1, mx, spanW / 2); }
  };
  up(focusId, 1, fx, FT_SLOT * 4);
  return { desc, ancNodes, ancLinks };
};

const ftInitials = (name) => (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const ftTrunc = (s, n) => { s = s || ''; return s.length > n ? s.slice(0, n - 1) + '…' : s; };
// Parte un texto en varias líneas (máx `max` chars por línea, hasta `maxLines`)
const ftWrap = (s, max, maxLines) => {
  s = (s || '').trim();
  if (!s) return [];
  maxLines = maxLines || 3;
  const words = s.split(/\s+/);
  const lines = [];
  let cur = '';
  words.forEach(w => {
    if (w.length > max) { // palabra muy larga: partir duro
      if (cur) { lines.push(cur); cur = ''; }
      for (let i = 0; i < w.length; i += max) lines.push(w.slice(i, i + max));
      return;
    }
    if (!cur) cur = w;
    else if ((cur + ' ' + w).length <= max) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { const kept = lines.slice(0, maxLines); kept[maxLines - 1] = ftTrunc(kept[maxLines - 1] + ' ' + lines.slice(maxLines).join(' '), max); return kept; }
  return lines;
};
// Devuelve las líneas de nombre + subtítulo (# pinche · año) para un nodo del árbol
const ftNodeLabel = (g) => {
  const nm = g.nombre;
  const year = (g.fecha_nacimiento || '').slice(0, 4);
  const nameLines = nm ? ftWrap(nm, 14, 2) : [g.numero_pinches ? '#' + g.numero_pinches : 'Sin nombre'];
  const sub = [];
  if (nm && g.numero_pinches) sub.push('#' + g.numero_pinches);
  if (year) sub.push(year);
  return { nameLines, sub: sub.join(' · ') };
};

const ArbolFamiliarModal = ({ gallos, cruces, initialFocusId, onClose }) => {
  const [mode, setMode] = useState(initialFocusId ? 'focus' : 'full');
  const [focoId, setFocoId] = useState(initialFocusId || (gallos[0] && gallos[0].id) || null);
  const [zoom, setZoom] = useState(0.85);

  const byId = useMemo(() => new Map(gallos.map(g => [g.id, g])), [gallos]);
  const lineaColor = useMemo(() => {
    const map = {}; let i = 0;
    gallos.forEach(g => {
      const l = g.linea_genetica || 'Sin línea';
      if (!(l in map)) { map[l] = (l === 'Sin línea') ? '#9ca3af' : LINEA_PALETTE[i % LINEA_PALETTE.length]; i++; }
    });
    return map;
  }, [gallos]);
  const colorFor = g => lineaColor[g.linea_genetica || 'Sin línea'] || '#9ca3af';

  const model = useMemo(() => ftBuildModel(gallos, cruces), [gallos, cruces]);
  const L = useMemo(() => {
    if (mode === 'focus' && focoId && byId.has(focoId)) {
      const f = ftLayoutFocus(focoId, model);
      return { nodes: f.desc.nodes.concat(f.ancNodes), coupleLinks: f.desc.coupleLinks, childLinks: f.desc.childLinks, ancLinks: f.ancLinks };
    }
    const d = ftLayoutDescendants(ftFullRoots(model), model);
    return { nodes: d.nodes, coupleLinks: d.coupleLinks, childLinks: d.childLinks, ancLinks: [] };
  }, [mode, focoId, model, byId]);

  const pad = 90;
  const box = useMemo(() => {
    if (!L.nodes.length) return { minX: 0, minY: 0, W: 400, H: 300 };

  const lineasPresentes = useMemo(() => {
    const set = new Set(); L.nodes.forEach(n => { const g = byId.get(n.id); if (g) set.add(g.linea_genetica || 'Sin línea'); });
    return [...set];
  }, [L, byId]);

  const renderNode = (n, i) => {

        <text textAnchor="middle" y={FT_R + 16} fontSize="12" fontWeight="700" fill="#1f2937">
          {lbl.nameLines.map((ln, li) => <tspan key={li} x="0" dy={li === 0 ? 0 : 13}>{ln}</tspan>)}
        </text>
        {lbl.sub && <text textAnchor="middle" y={FT_R + 16 + lbl.nameLines.length * 13} fontSize="10" fill="#9ca3af">{lbl.sub}</text>}

  return (
    <Modal title="🌳 Árbol familiar" onClose={onClose} wide>

          </button>
          <button onClick={() => setMode('focus')}
            className={`px-3 py-1.5 rounded-md text-xs font-semibold ${mode === 'focus' ? 'bg-white shadow text-red-700' : 'text-gray-500'}`}>
            Enfocar gallo
          </button>
        </div>
        {mode === 'focus' && (
          <select value={focoId || ''} onChange={e => setFocoId(e.target.value)}
            className="border border-gray-300 rounded-lg px-2 py-1.5 text-xs max-w-[160px]">
            {gallos.map(g => <option key={g.id} value={g.id}>{nombreGallo(g)}</option>)}
          </select>
        )}
        <div className="flex items-center gap-1.5 ml-auto">
          <button onClick={() => setZoom(z => Math.max(0.35, +(z - 0.1).toFixed(2)))} className="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600">−</button>
          <span className="text-xs text-gray-500 w-9 text-center">{Math.round(zoom * 100)}%</span>
          <button onClick={() => setZoom(z => Math.min(1.6, +(z + 0.1).toFixed(2)))} className="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600">+</button>
        </div>
      </div>

      {/* Leyenda de líneas */}
      {lineasPresentes.length > 0 && (
        <div className="flex flex-wrap gap-2 mb-2">
          {lineasPresentes.map(l => (
            <span key={l} className="inline-flex items-center gap-1 text-[11px] text-gray-600">

      <p className="text-[11px] text-gray-400 mb-2">
        {mode === 'focus' ? 'Ancestros arriba, descendientes abajo. Toca cualquier gallo para enfocarlo.' : 'Todo el criadero por generaciones. Toca un gallo para ver solo su rama.'}

      </p>

      <div className="htree-scroll border border-gray-100 rounded-xl bg-gradient-to-br from-gray-50 to-white" style={{ maxHeight: '62vh' }}>

        ) : (
          <svg width={box.W * zoom} height={box.H * zoom} viewBox={`${box.minX} ${box.minY} ${box.W} ${box.H}`}
            style={{ display: 'block', minWidth: '100%' }}>
            {/* conectores hijos (escuadra) */}
            {L.childLinks.map((l, i) => (
              <path key={'cl' + i} d={`M ${l.famCx} ${l.famBottomY} L ${l.famCx} ${l.busY} L ${l.childX} ${l.busY} L ${l.childX} ${l.childTopY}`}
                fill="none" stroke="#cbd5e1" strokeWidth="2" />

            {L.ancLinks.map((l, i) => (
              <line key={'al' + i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke="#e5b4c0" strokeWidth="2" strokeDasharray="4 3" />
            ))}

            {L.coupleLinks.map((c, i) => (
              <g key={'cp' + i}>
                <line x1={c.ax + FT_R} y1={c.y} x2={c.bx - FT_R} y2={c.y} stroke="#f9a8d4" strokeWidth="2.5" />

// ============================================
// ANÁLISIS DE CONSANGUINIDAD (line breeding, notación N×M)
// ============================================
const COMMON_PALETTE = ['#dc2626', '#2563eb', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#db2777', '#ca8a04', '#4f46e5', '#0d9488'];

const ftCollectAnc = (startId, model, maxGen) => {
  const map = new Map();
  const rec = (id, gen) => {
    if (!id || gen > maxGen || !model.has(id)) return;
    if (!map.has(id)) map.set(id, []);
    map.get(id).push(gen);
    const g = model.byId.get(id);
    rec(g.padre_id, gen + 1);
    rec(g.madre_id, gen + 1);
  };
  rec(startId, 1);
  return map;
};

// Devuelve ancestros en común con notación N×M y coeficiente de Wright (F)
const analizarConsanguinidad = (padre, madre, gallos, cruces, maxGen) => {
  maxGen = maxGen || 6;
  if (!padre || !madre) return { commons: [], F: 0 };
  const model = ftBuildModel(gallos, cruces || []);
  const A = ftCollectAnc(padre.id, model, maxGen);
  const B = ftCollectAnc(madre.id, model, maxGen);
  const commons = [];
  let F = 0;
  for (const [id, gensA] of A) {
    if (!B.has(id)) continue;
    const gensB = B.get(id);
    const combos = {};
    gensA.forEach(ga => gensB.forEach(gb => {
      F += Math.pow(0.5, ga + gb - 1);
      const k = ga + '×' + gb;
      combos[k] = (combos[k] || 0) + 1;
    }));
    commons.push({
      id, gallo: model.byId.get(id),
      combos: Object.keys(combos).sort((a, b) => {
        const pa = a.split('×').map(Number), pb = b.split('×').map(Number);
        return (pa[0] + pa[1]) - (pb[0] + pb[1]);
      }).map(k => ({ nota: k, veces: combos[k] })),
      closest: Math.min.apply(null, gensA) + Math.min.apply(null, gensB),
    });
  }
  commons.sort((a, b) => a.closest - b.closest);
  return { commons, F };
};

const interpretarF = (F) => {
  const p = F * 100;
  if (p <= 0.001) return { txt: 'Sin parentesco detectado', cls: 'text-green-700 bg-green-50', hint: 'Cruce abierto (outcross).' };
  if (p < 6.25) return { txt: 'Consanguinidad leve', cls: 'text-green-700 bg-green-50', hint: 'Parentesco lejano.' };
  if (p < 12.5) return { txt: 'Line breeding moderado', cls: 'text-yellow-700 bg-yellow-50', hint: 'Refuerza tipo; riesgo bajo-medio.' };
  if (p < 25) return { txt: 'Line breeding cerrado', cls: 'text-orange-700 bg-orange-50', hint: 'Fija características; vigila vigor.' };
  return { txt: 'Consanguinidad muy alta', cls: 'text-red-700 bg-red-50', hint: 'Riesgo de merma (inbreeding depression).' };
};

// Layout pedigree hacia arriba (para el comparador)
const ftAncestorLayout = (rootId, model, maxGen) => {
  const nodes = [{ id: rootId, x: 0, y: 0, gen: 1 }];
  const links = [];
  const up = (id, gen, x, span) => {
    if (gen > maxGen) return;
    const g = model.byId.get(id); if (!g) return;
    const p = model.has(g.padre_id) ? g.padre_id : null;
    const m = model.has(g.madre_id) ? g.madre_id : null;
    const y = -gen * FT_GENV, childY = -(gen - 1) * FT_GENV, half = span / 2;
    if (p) { const px = x - half / 2; nodes.push({ id: p, x: px, y, gen: gen + 1 }); links.push({ x1: x, y1: childY - FT_R, x2: px, y2: y + FT_R }); up(p, gen + 1, px, half); }
    if (m) { const mx = x + half / 2; nodes.push({ id: m, x: mx, y, gen: gen + 1 }); links.push({ x1: x, y1: childY - FT_R, x2: mx, y2: y + FT_R }); up(m, gen + 1, mx, half); }
  };
  up(rootId, 1, 0, FT_SLOT * Math.pow(2, Math.min(maxGen - 1, 3)));
  return { nodes, links };
};

const AnalisisCastaModal = ({ padre, madre, gallos, cruces, onClose }) => {

  const analisis = useMemo(() => analizarConsanguinidad(padre, madre, gallos, cruces, 6), [padre, madre, gallos, cruces]);
  const info = interpretarF(analisis.F);
  const commonColor = useMemo(() => {
    const map = {}; analisis.commons.forEach((c, i) => { map[c.id] = COMMON_PALETTE[i % COMMON_PALETTE.length]; }); return map;
  }, [analisis]);

  const MAXG = 4;
  const lay = useMemo(() => {
    const p = ftAncestorLayout(padre.id, model, MAXG);
    const m = ftAncestorLayout(madre.id, model, MAXG);
    const pxs = p.nodes.map(n => n.x), mxs = m.nodes.map(n => n.x);
    const pMin = Math.min.apply(null, pxs), pMax = Math.max.apply(null, pxs);
    const mMin = Math.min.apply(null, mxs);
    const GAP = FT_SLOT * 1.4;
    const pOff = -pMin;
    const mOff = (pMax - pMin) + GAP - mMin;
    const shift = (arr, off) => arr.map(n => ({ ...n, x: n.x + off }));
    const shiftL = (arr, off) => arr.map(l => ({ ...l, x1: l.x1 + off, x2: l.x2 + off }));
    return {
      nodes: shift(p.nodes, pOff).concat(shift(m.nodes, mOff)),
      links: shiftL(p.links, pOff).concat(shiftL(m.links, mOff)),
      padreX: 0 + pOff, madreX: mOff, pRightMid: (pOff + pMax + pOff) / 2,
    };
  }, [padre, madre, model]);

  const pad = 80;

    const xs = lay.nodes.map(n => n.x), ys = lay.nodes.map(n => n.y);

        <circle r={FT_R} fill={isCommon ? ring + '22' : '#f8fafc'} stroke={ring} strokeWidth={isCommon ? 4 : 2} />
        <text textAnchor="middle" dy="5" fontSize="14" fontWeight="700" fill={isCommon ? ring : '#64748b'}>{ftInitials(nm)}</text>
        <circle cx={FT_R * 0.72} cy={FT_R * 0.72} r="8" fill={g.sexo === 'Gallina' ? '#ec4899' : '#3b82f6'} stroke="#fff" strokeWidth="1.5" />
        <text x={FT_R * 0.72} y={FT_R * 0.72} textAnchor="middle" dy="3" fontSize="9" fill="#fff">{g.sexo === 'Gallina' ? '♀' : '♂'}</text>
        {isCommon && <text x={-FT_R * 0.72} y={-FT_R * 0.72} textAnchor="middle" dy="4" fontSize="13" fill={ring}>★</text>}
        <text textAnchor="middle" y={FT_R + 15} fontSize="11" fontWeight="600" fill="#1f2937">
          {lbl.nameLines.map((ln, li) => <tspan key={li} x="0" dy={li === 0 ? 0 : 12}>{ln}</tspan>)}
        </text>
        {lbl.sub && <text textAnchor="middle" y={FT_R + 15 + lbl.nameLines.length * 12} fontSize="9" fill="#9ca3af">{lbl.sub}</text>}
      </g>
    );
  };

  return (
    <Modal title="🔬 Análisis del cruce" onClose={onClose} wide>
      <div className={`rounded-xl p-3 mb-3 ${info.cls}`}>
        <div className="flex items-center justify-between">
          <div>
            <p className="text-xs font-bold uppercase tracking-wide">Consanguinidad estimada (Wright)</p>
            <p className="text-[11px] opacity-80">{info.txt} · {info.hint}</p>
          </div>
          <span className="text-2xl font-extrabold">{(analisis.F * 100).toFixed(1)}%</span>
        </div>
      </div>

      {analisis.commons.length === 0 ? (
        <p className="text-sm text-gray-500 bg-gray-50 rounded-xl p-3 mb-3">
          No se detectaron ancestros en común en {6} generaciones. Es un cruce abierto (outcross): más variabilidad, menos "fijación" de tipo.
        </p>
      ) : (
        <div className="mb-3">
          <p className="text-xs font-bold text-gray-500 uppercase mb-1.5">Ancestros en común ({analisis.commons.length})</p>
          <div className="space-y-1.5">
            {analisis.commons.map(c => (
              <div key={c.id} className="flex items-center gap-2 bg-white border border-gray-200 rounded-lg px-2.5 py-1.5">
                <span className="inline-block w-3 h-3 rounded-full flex-shrink-0" style={{ background: commonColor[c.id] }} />
                <div className="min-w-0 flex-1">
                  <p className="text-sm font-semibold text-gray-800 truncate">{nombreGallo(c.gallo)}
                    {c.gallo.linea_genetica && <span className="text-[11px] text-gray-400 font-normal"> · {c.gallo.linea_genetica}</span>}
                  </p>
                </div>
                <div className="flex flex-wrap gap-1 justify-end">
                  {c.combos.map((cm, i) => (
                    <span key={i} className="text-[11px] font-bold rounded px-1.5 py-0.5" style={{ background: commonColor[c.id] + '22', color: commonColor[c.id] }}>

          </p>

      <div className="flex items-center justify-between mb-1.5">

        <div className="flex items-center gap-1.5">
          <button onClick={() => setZoom(z => Math.max(0.3, +(z - 0.1).toFixed(2)))} className="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600">−</button>
          <span className="text-xs text-gray-500 w-9 text-center">{Math.round(zoom * 100)}%</span>
          <button onClick={() => setZoom(z => Math.min(1.4, +(z + 0.1).toFixed(2)))} className="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600">+</button>
        </div>

      <div className="htree-scroll border border-gray-100 rounded-xl bg-gradient-to-br from-gray-50 to-white" style={{ maxHeight: '55vh' }}>
        <svg width={box.W * zoom} height={box.H * zoom} viewBox={`${box.minX} ${box.minY} ${box.W} ${box.H}`} style={{ display: 'block', minWidth: '100%' }}>
          <text x={lay.padreX} y={box.minY + 22} textAnchor="middle" fontSize="14" fontWeight="700" fill="#2563eb">♂ {ftTrunc(nombreGallo(padre), 16)}</text>
          <text x={lay.madreX} y={box.minY + 22} textAnchor="middle" fontSize="14" fontWeight="700" fill="#ec4899">♀ {ftTrunc(nombreGallo(madre), 16)}</text>
          {lay.links.map((l, i) => <line key={'l' + i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke="#cbd5e1" strokeWidth="2" />)}
          {lay.nodes.map(nodeEl)}
        </svg>
      </div>
    </Modal>
  );
};

// ============================================
// ASESOR DE CRUCES (recomendador heurístico)
// ============================================
const ftAncMap = (id, model, maxGen) => {
  maxGen = maxGen || 6; const m = new Map();
  const rec = (x, g) => { if (!x || g > maxGen || !model.has(x)) return; if (!m.has(x) || m.get(x) > g) m.set(x, g); const G = model.byId.get(x); rec(G.padre_id, g + 1); rec(G.madre_id, g + 1); };
  rec(id, 0); return m;
};
const ftBloodOf = (ancId, ofId, model, maxGen) => {
  maxGen = maxGen || 8; let s = 0;
  const rec = (x, e) => { if (!x || e > maxGen || !model.has(x)) return; if (x === ancId) { s += Math.pow(0.5, e); return; } const g = model.byId.get(x); rec(g.padre_id, e + 1); rec(g.madre_id, e + 1); };
  rec(ofId, 0); return s;
};
const ftLineaFrac = (x, L, model, maxGen) => {
  maxGen = maxGen || 4; if (!L) return 0; let match = 0, tot = 0;
  const rec = (id, gen) => { if (!id || gen > maxGen || !model.has(id)) return; const w = Math.pow(0.5, gen); tot += w; const g = model.byId.get(id); if ((g.linea_genetica || '') === L) match += w; rec(g.padre_id, gen + 1); rec(g.madre_id, gen + 1); };
  rec(x, 0); return tot > 0 ? match / tot : 0;
};
const ftSharedParents = (aId, bId, model) => {
  const a = model.byId.get(aId), b = model.byId.get(bId); if (!a || !b) return 0;
  const ap = [a.padre_id, a.madre_id].filter(x => model.has(x));
  const bp = new Set([b.padre_id, b.madre_id].filter(x => model.has(x)));
  return ap.filter(x => bp.has(x)).length;
};
// Relación entre gallo(a=♂) y gallina(b=♀), con etiqueta y notación
const ftRelacion = (aId, bId, model) => {
  const A = ftAncMap(aId, model), B = ftAncMap(bId, model);
  if (B.has(aId)) { const g = B.get(aId); return { tipo: 'directo', label: g === 1 ? 'Padre × hija' : g === 2 ? 'Abuelo × nieta' : g === 3 ? 'Bisabuelo × bisnieta' : 'Ascendiente directo', nota: g + '×0' }; }
  if (A.has(bId)) { const g = A.get(bId); return { tipo: 'directo', label: g === 1 ? 'Madre × hijo' : g === 2 ? 'Abuela × nieto' : g === 3 ? 'Bisabuela × bisnieto' : 'Ascendiente directo', nota: '0×' + g }; }
  let best = null;
  for (const [id, gA] of A) { if (id === aId || id === bId) continue; if (B.has(id)) { const gB = B.get(id); if (!best || gA + gB < best.s) best = { id, gA, gB, s: gA + gB }; } }
  if (!best) return { tipo: 'ninguno', label: 'Sin parentesco (outcross)', nota: '—' };
  const { gA, gB } = best, lo = Math.min(gA, gB), hi = Math.max(gA, gB), nota = gA + '×' + gB;
  if (gA === 1 && gB === 1) { const sp = ftSharedParents(aId, bId, model); return { tipo: sp >= 2 ? 'hermanos' : 'medios', label: sp >= 2 ? 'Hermanos completos' : 'Medios hermanos', nota }; }
  if (lo === 1 && hi === 2) return { tipo: 'tio', label: gA === 1 ? 'Tío × sobrina' : 'Tía × sobrino', nota };
  if (gA === 2 && gB === 2) return { tipo: 'primos', label: 'Primos', nota };
  return { tipo: 'lejano', label: 'Parientes lejanos', nota };
};

const PARENTESCO_META = {
  ninguno: { txt: 'Sin parentesco', cls: 'bg-green-100 text-green-700' },
  primos: { txt: 'Primos', cls: 'bg-blue-100 text-blue-700' },
  medios: { txt: 'Medios hermanos', cls: 'bg-yellow-100 text-yellow-700' },
  hermanos: { txt: 'Hermanos', cls: 'bg-orange-100 text-orange-700' },
  tio: { txt: 'Tío/Tía × sobrino/a', cls: 'bg-yellow-100 text-yellow-700' },
  directo: { txt: 'Ascendiente directo', cls: 'bg-red-100 text-red-700' },
  lejano: { txt: 'Parientes lejanos', cls: 'bg-gray-100 text-gray-600' },
};

const FT_TRAIT_OPTS = (() => {
  const s = new Set();
  CATS_CARACTERISTICAS.filter(c => c.id !== 'genetica').forEach(c => c.subs.forEach(sub => sub.opts.forEach(o => s.add(o))));
  return s;
})();

const AsesorCrucesModal = ({ gallos, cruces, onUsar, onClose }) => {
  const machos = useMemo(() => gallos.filter(g => g.sexo === 'Gallo'), [gallos]);
  const hembras = useMemo(() => gallos.filter(g => g.sexo === 'Gallina'), [gallos]);
  const [objetivoId, setObjetivoId] = useState((machos[0] && machos[0].id) || (gallos[0] && gallos[0].id) || null);
  const [baseId, setBaseId] = useState('');
  const [lineaPareja, setLineaPareja] = useState('cualquiera'); // cualquiera | distinta | misma
  const [consangMax, setConsangMax] = useState(0.25);
  const [parentSel, setParentSel] = useState({ ninguno: true, primos: true, medios: true, hermanos: true, tio: true, directo: true, lejano: true });

  const model = useMemo(() => ftBuildModel(gallos, cruces || []), [gallos, cruces]);
  const byId = useMemo(() => new Map(gallos.map(g => [g.id, g])), [gallos]);
  const objetivo = objetivoId ? byId.get(objetivoId) : null;

  const resultados = useMemo(() => {
    if (!objetivo) return [];
    const L = objetivo.linea_genetica || '';
    const base = baseId ? byId.get(baseId) : null;
    // Generar pares macho×hembra
    let pares = [];
    if (base) {
      if (base.sexo === 'Gallina') machos.forEach(g => pares.push([g, base]));
      else hembras.forEach(h => pares.push([base, h]));
    } else {
      machos.forEach(g => hembras.forEach(h => pares.push([g, h])));
    }
    // Fase 1: filtros baratos + componente de sangre
    const fase1 = [];
    pares.forEach(([g, h]) => {
      if (g.id === h.id) return;
      if (lineaPareja === 'distinta' && (g.linea_genetica || '') === (h.linea_genetica || '')) return;
      if (lineaPareja === 'misma' && (g.linea_genetica || '') !== (h.linea_genetica || '')) return;
      const rel = ftRelacion(g.id, h.id, model);
      if (!parentSel[rel.tipo]) return;
      const bloodT = 0.5 * ftBloodOf(objetivo.id, g.id, model) + 0.5 * ftBloodOf(objetivo.id, h.id, model);
      const lineaCria = 0.5 * ftLineaFrac(g.id, L, model) + 0.5 * ftLineaFrac(h.id, L, model);
      const bloodComp = 0.6 * bloodT + 0.4 * lineaCria;
      fase1.push({ g, h, rel, bloodT, lineaCria, bloodComp });
    });
    fase1.sort((a, b) => b.bloodComp - a.bloodComp);
    // Fase 2: sobre el top, calcular rasgos + consanguinidad
    const top = fase1.slice(0, 30);
    const objTraits = (objetivo.caracteristicas || []).filter(t => FT_TRAIT_OPTS.has(t));
    const out = top.map(r => {
      const pred = predecirCruce(r.g, r.h, gallos);
      const tmap = {};
      pred.categorias.forEach(cat => cat.subs.forEach(s => s.dist.forEach(d => { tmap[d.trait] = Math.max(tmap[d.trait] || 0, d.pct); })));
      let traitComp = null;
      if (objTraits.length) traitComp = objTraits.reduce((a, t) => a + (tmap[t] || 0), 0) / (objTraits.length * 100);
      const F = analizarConsanguinidad(r.g, r.h, gallos, cruces, 6).F;
      const score = Math.round(100 * (traitComp != null ? 0.5 * r.bloodComp + 0.5 * traitComp : r.bloodComp));
      return { ...r, traitComp, F, score };
    }).filter(r => r.F <= consangMax + 1e-9);
    out.sort((a, b) => b.score - a.score);
    return out.slice(0, 12);
  }, [objetivo, baseId, lineaPareja, consangMax, parentSel, model, gallos, cruces, machos, hembras, byId]);

  const toggleParent = k => setParentSel(p => ({ ...p, [k]: !p[k] }));

  return (
    <Modal title="🎯 Asesor de cruces" onClose={onClose} wide>
      <div className="space-y-3">
        <div className="grid grid-cols-1 gap-3">
          <Field label="Gallo objetivo (a qué quieres que tire la cría)">
            <Select value={objetivoId || ''} onChange={e => setObjetivoId(e.target.value)}
              options={gallos.map(g => ({ value: g.id, label: nombreGallo(g) + (g.linea_genetica ? ' · ' + g.linea_genetica : '') }))} />
          </Field>
          <Field label="Fijar un ejemplar (opcional)">
            <Select value={baseId} onChange={e => setBaseId(e.target.value)}
              options={[{ value: '', label: 'Explorar todas las parejas' }].concat(gallos.map(g => ({ value: g.id, label: (g.sexo === 'Gallina' ? '♀ ' : '♂ ') + nombreGallo(g) })))} />
          </Field>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <Field label="Línea de la pareja">
            <Select value={lineaPareja} onChange={e => setLineaPareja(e.target.value)}
              options={[{ value: 'cualquiera', label: 'Cualquiera' }, { value: 'distinta', label: 'Distinta línea' }, { value: 'misma', label: 'Misma línea' }]} />
          </Field>
          <Field label="Consanguinidad máx.">
            <Select value={String(consangMax)} onChange={e => setConsangMax(parseFloat(e.target.value))}
              options={[{ value: '0.0625', label: '≤ 6.25% (suave)' }, { value: '0.125', label: '≤ 12.5%' }, { value: '0.25', label: '≤ 25%' }, { value: '1', label: 'Sin límite' }]} />
          </Field>
        </div>

        <div>
          <p className="text-xs font-semibold text-gray-500 mb-1.5">Parentesco permitido</p>
          <div className="flex flex-wrap gap-1.5">
            {Object.keys(PARENTESCO_META).map(k => (
              <button key={k} onClick={() => toggleParent(k)}
                className={`text-[11px] font-semibold px-2 py-1 rounded-full ${parentSel[k] ? PARENTESCO_META[k].cls : 'bg-gray-100 text-gray-400 line-through'}`}>
                {PARENTESCO_META[k].txt}
              </button>
            ))}
          </div>
        </div>

        <div className="border-t border-gray-100 pt-3">
          <p className="text-xs font-bold text-gray-500 uppercase mb-2">Mejores cruces ({resultados.length})</p>
          {resultados.length === 0 ? (
            <p className="text-center text-gray-400 py-6 text-sm">No hay cruces que cumplan los filtros. Prueba a relajar el parentesco o la consanguinidad.</p>
          ) : (
            <div className="space-y-2">
              {resultados.map((r, i) => (
                <div key={r.g.id + r.h.id} className="bg-white border border-gray-200 rounded-xl p-3">
                  <div className="flex items-center justify-between gap-2">
                    <div className="min-w-0">
                      <p className="text-sm font-bold text-gray-800 truncate">
                        <span className="text-blue-600">♂ {nombreGallo(r.g)}</span>
                        <span className="text-gray-300"> × </span>
                        <span className="text-pink-600">♀ {nombreGallo(r.h)}</span>
                      </p>
                      <div className="flex flex-wrap items-center gap-1.5 mt-1">
                        <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded-full ${PARENTESCO_META[r.rel.tipo].cls}`}>{r.rel.label}{r.rel.nota !== '—' && r.rel.tipo !== 'directo' ? ` (${r.rel.nota})` : ''}</span>
                        <span className="text-[10px] text-gray-500">Consang. {(r.F * 100).toFixed(1)}%</span>
                        {(r.g.linea_genetica || r.h.linea_genetica) && <span className="text-[10px] text-gray-400">{[r.g.linea_genetica, r.h.linea_genetica].filter(Boolean).join(' / ')}</span>}
                      </div>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <div className="text-lg font-extrabold text-red-600 leading-none">{r.score}</div>
                      <div className="text-[9px] text-gray-400 uppercase">Afinidad</div>
                    </div>
                  </div>
                  <div className="flex items-center gap-3 mt-2 text-[10px] text-gray-500">
                    <span>Sangre objetivo: <b className="text-gray-700">{Math.round(r.bloodT * 100)}%</b></span>
                    {r.traitComp != null && <span>Rasgos: <b className="text-gray-700">{Math.round(r.traitComp * 100)}%</b></span>}
                    <button onClick={() => { onUsar(r.g, r.h); onClose(); }} className="ml-auto text-red-600 font-semibold">Usar este cruce ▸</button>
                  </div>
                </div>
              ))}
            </div>
          )}
          <p className="text-[10px] text-gray-400 mt-2 italic">
            "Afinidad" combina cuánta sangre y cuántas características de <b>{objetivo ? nombreGallo(objetivo) : '—'}</b> tiende a heredar la cría. Es una guía sobre tus datos, no una garantía.
          </p>
        </div>
      </div>
    </Modal>
  );
};

const CATS_COLOR_HEX = { blue: '#2563eb', green: '#16a34a', red: '#dc2626', purple: '#9333ea' };

};

// ---------- Fechas locales (sin desfase de zona horaria) ----------
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hoyStr = () => ymd(new Date());
const parseF = (s) => { const a = String(s).slice(0, 10).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const fmtF = (s) => s ? parseF(s).toLocaleDateString('es-PR', { day: 'numeric', month: 'short' }) : '';
const sumarDias = (s, n) => { const d = parseF(s); d.setDate(d.getDate() + n); return ymd(d); };
const diasEntre = (a, b) => Math.round((parseF(b) - parseF(a)) / 86400000);
const DIAS_INCUBACION = 21;

const EV_META = {
  echada:     { icon: '❤️', label: 'Le echó el gallo', color: '#dc2626' },
  huevo:      { icon: '🥚', label: 'Puso huevo', color: '#f59e0b' },
  empollar:   { icon: '🪺', label: 'Se echó a empollar', color: '#3b82f6' },
  nacimiento: { icon: '🐣', label: 'Nacieron pollos', color: '#16a34a' },
  pinchado:   { icon: '🏷️', label: 'Pinchados', color: '#9333ea' },
  nota:       { icon: '📝', label: 'Nota', color: '#6b7280' },
  fallido:    { icon: '✖️', label: 'Se perdió', color: '#991b1b' },
  esperada:   { icon: '⏳', label: 'Nacimiento esperado', color: '#16a34a' },
};

// Resume en qué va una casta a partir de sus eventos
const resumenCasta = (cruce, evs, pollos) => {
  const de = (t) => evs.filter(e => e.tipo === t);
  const suma = (t) => de(t).reduce((s, e) => s + (e.cantidad || 0), 0);
  const huevos = suma('huevo');
  const fHuevos = de('huevo').map(e => e.fecha).sort();
  const empolle = (de('empollar').map(e => e.fecha).sort()[0]) || null;
  const nacidos = suma('nacimiento');
  const fNac = (de('nacimiento').map(e => e.fecha).sort()[0]) || null;
  const fallido = de('fallido').length > 0;
  const esperada = empolle && !fNac && !fallido ? sumarDias(empolle, DIAS_INCUBACION) : null;
  const pinchados = pollos.filter(g => g.numero_pinches).length;
  const hoy = hoyStr();
  let fase, cls;
  if (cruce.estado === 'Cerrado') { fase = 'Cerrada'; cls = 'bg-gray-100 text-gray-600'; }
  else if (fallido) { fase = 'Se perdió'; cls = 'bg-red-100 text-red-700'; }
  else if (fNac) { fase = `${nacidos || pollos.length} pollos`; cls = 'bg-green-100 text-green-700'; }
  else if (empolle) {
    const d = diasEntre(empolle, hoy) + 1;
    fase = d > DIAS_INCUBACION ? `Empollando · pasada ${d - DIAS_INCUBACION} d` : `Empollando · día ${Math.max(1, d)}`;
    cls = 'bg-blue-100 text-blue-700';
  }
  else if (huevos > 0) { fase = `Poniendo · ${huevos} huevos`; cls = 'bg-yellow-100 text-yellow-700'; }
  else { fase = 'Echada'; cls = 'bg-pink-100 text-pink-700'; }
  const estado = fallido ? 'Fallido' : fNac ? 'Eclosionado' : empolle ? 'Empollando' : 'Activo';
  return { huevos, fHuevos, empolle, nacidos, fNac, fallido, esperada, pinchados, fase, cls, estado, faltan: esperada ? diasEntre(hoy, esperada) : null };
};

// Sangre de la cría + ancestros que salen por los dos lados
const SangreCriaCard = ({ padre, madre, gallos }) => {
  const byId = useMemo(() => new Map(gallos.map(g => [g.id, g])), [gallos]);
