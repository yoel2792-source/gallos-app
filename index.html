  const rep = useMemo(() => repetidosAmbosLados(padre, madre, gallos, byId), [padre, madre, gallos, byId]);
  const fuertes = useMemo(() => {
    const det = new Map();
    [padre.id, madre.id].forEach(pid => aporteDetalle(pid, byId).forEach((o, id) => {
      const x = det.get(id) || { g: o.g, frac: 0, veces: 0, via: new Set() };
      x.frac += o.frac / 2; x.veces += o.veces; o.via.forEach(v => x.via.add(v)); det.set(id, x);
    }));
    return rankingSangre(det, new Set(), new Set([padre.id, madre.id]), 5);
  }, [padre, madre, byId]);
  return (
    <div className="bg-white rounded-xl border border-gray-200 p-3 mb-3">
      <p className="text-sm font-bold text-gray-700 mb-2">🩸 Sangre más fuerte de la cría</p>
      <SangreFuerte items={fuertes} sujeto="la cría" />
      {rep.length > 0 ? (
        <div className="mt-3 bg-amber-50 border border-amber-200 rounded-lg p-2.5">
          <p className="text-xs font-bold text-amber-800 mb-1">🔁 Se repiten por los dos lados</p>
          <div className="space-y-1.5">
            {rep.map(r => (
              <div key={r.g.id} className="text-xs text-amber-900">
                <div className="flex items-center justify-between">
                  <span className="font-semibold truncate">{sexoIcon(r.g)} {nombreGallo(r.g)}</span>
                  <b className="ml-2 flex-shrink-0">{pedPct(r.total)} de la cría</b>
                </div>
                <p className="text-[11px] text-amber-700">
                  {r.g.id === padre.id ? 'Es el mismo padre' : pedPct(r.porPadre) + ' del padre'} · {r.g.id === madre.id ? 'es la misma madre' : pedPct(r.porMadre) + ' de la madre'}
                </p>
              </div>
            ))}
          </div>
        </div>
      ) : (
        <p className="mt-3 text-[11px] text-green-700 bg-green-50 rounded-lg px-2.5 py-1.5">Ningún gallo ni gallina se repite por los dos lados.</p>
      )}
      <details className="mt-3 border-t border-gray-100 pt-2">
        <summary className="text-xs font-semibold text-gray-500 cursor-pointer">Ver de dónde viene al fondo (los más antiguos)</summary>
        <div className="mt-2"><BarraSangre comp={comp} /></div>
      </details>
    </div>
  );
};

// Calendario del castadero
const CalendarioCastas = ({ cruces, eventos, gallos, onOpen }) => {
  const hoy = hoyStr();
  const [mes, setMes] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [dia, setDia] = useState(hoy);
  const titulo = (c) => { const p = gallos.find(g => g.id === c.padre_id), m = gallos.find(g => g.id === c.madre_id); return nombreGallo(p) + ' × ' + nombreGallo(m); };

  const marcas = useMemo(() => {
    const map = {};
    const add = (fecha, tipo, cruce, ev) => { if (!fecha) return; const k = String(fecha).slice(0, 10); (map[k] = map[k] || []).push({ tipo, cruce, ev }); };
    cruces.forEach(c => {
      add(c.fecha_cruce, 'echada', c, null);
      const evs = eventos.filter(e => e.cruce_id === c.id);
      evs.forEach(e => add(e.fecha, e.tipo, c, e));
      const r = resumenCasta(c, evs, []);
      if (r.esperada && c.estado !== 'Cerrado') add(r.esperada, 'esperada', c, null);
    });
    return map;
  }, [cruces, eventos]);

  const primero = new Date(mes.y, mes.m, 1);
  const nDias = new Date(mes.y, mes.m + 1, 0).getDate();
  const celdas = [];
  for (let i = 0; i < primero.getDay(); i++) celdas.push(null);
  for (let d = 1; d <= nDias; d++) celdas.push(ymd(new Date(mes.y, mes.m, d)));
  const mover = (n) => setMes(x => { const d = new Date(x.y, x.m + n, 1); return { y: d.getFullYear(), m: d.getMonth() }; });
  const proximos = Object.keys(marcas).filter(k => k >= hoy).sort()
    .flatMap(k => marcas[k].filter(x => x.tipo === 'esperada').map(x => ({ fecha: k, cruce: x.cruce }))).slice(0, 5);
  const delDia = marcas[dia] || [];

  return (
    <div>
      {proximos.length > 0 && (
        <div className="bg-green-50 border border-green-200 rounded-xl p-3 mb-3">
          <p className="text-xs font-bold text-green-800 mb-1">⏳ Lo que viene</p>
          {proximos.map((x, i) => {
            const f = diasEntre(hoy, x.fecha);
            return (
              <button key={i} onClick={() => onOpen(x.cruce.id)} className="w-full flex items-center justify-between text-xs text-green-900 py-0.5 text-left">
                <span className="truncate">🐣 {titulo(x.cruce)}</span>
                <b className="ml-2 flex-shrink-0">{fmtF(x.fecha)} · {f === 0 ? 'hoy' : f === 1 ? 'mañana' : `faltan ${f} días`}</b>
              </button>
            );
          })}
        </div>
      )}

      <div className="bg-white rounded-xl border border-gray-200 p-3">
        <div className="flex items-center justify-between mb-2">
          <button onClick={() => mover(-1)} className="w-8 h-8 rounded-full bg-gray-100 text-gray-600">‹</button>
          <p className="text-sm font-bold text-gray-800 first-letter:uppercase">{primero.toLocaleDateString('es-PR', { month: 'long', year: 'numeric' })}</p>
          <button onClick={() => mover(1)} className="w-8 h-8 rounded-full bg-gray-100 text-gray-600">›</button>
        </div>
        <div className="grid grid-cols-7 gap-1 text-center">
          {['D', 'L', 'M', 'M', 'J', 'V', 'S'].map((d, i) => <div key={i} className="text-[10px] font-bold text-gray-400 py-1">{d}</div>)}
          {celdas.map((k, i) => {
            if (!k) return <div key={i} />;
            const ms = marcas[k] || [];
            const tipos = [...new Set(ms.map(x => x.tipo))].slice(0, 4);
            return (
              <button key={i} onClick={() => setDia(k)}
                className={`rounded-lg py-1 min-h-[44px] flex flex-col items-center ${k === dia ? 'bg-red-50 ring-2 ring-red-400' : ms.length ? 'bg-gray-50' : ''}`}>
                <span className={`text-xs leading-5 w-5 h-5 rounded-full ${k === hoy ? 'bg-red-600 text-white font-bold' : 'text-gray-700'}`}>{parseF(k).getDate()}</span>
                <span className="flex gap-0.5 mt-1 h-2">
                  {tipos.map(t => <span key={t} className="w-1.5 h-1.5 rounded-full" style={t === 'esperada' ? { border: '1.5px solid ' + EV_META[t].color } : { background: EV_META[t].color }} />)}
                </span>
              </button>
            );
          })}
        </div>
        <div className="flex flex-wrap gap-x-3 gap-y-1 mt-3 text-[10px] text-gray-500">
          {['echada', 'huevo', 'empollar', 'nacimiento', 'esperada'].map(t => (
            <span key={t} className="flex items-center gap-1">
              <span className="w-2 h-2 rounded-full" style={t === 'esperada' ? { border: '1.5px solid ' + EV_META[t].color } : { background: EV_META[t].color }} />{EV_META[t].label}
            </span>
          ))}
        </div>
      </div>

      <div className="mt-3">
        <p className="text-xs font-bold text-gray-600 mb-1.5 first-letter:uppercase">{parseF(dia).toLocaleDateString('es-PR', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
        {delDia.length === 0
          ? <p className="text-sm text-gray-400 text-center py-4">Nada anotado este día.</p>
          : <div className="space-y-1.5">
              {delDia.map((x, i) => (
                <button key={i} onClick={() => onOpen(x.cruce.id)} className="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-left active:bg-gray-50">
                  <p className="text-sm font-semibold text-gray-800">{EV_META[x.tipo].icon} {EV_META[x.tipo].label}{x.ev && x.ev.cantidad ? ` · ${x.ev.cantidad}` : ''}</p>
                  <p className="text-[11px] text-gray-500 truncate">{titulo(x.cruce)}{x.ev && x.ev.nota ? ' — ' + x.ev.nota : ''}</p>
                </button>
              ))}
            </div>}
      </div>
    </div>
  );
};

const CastaderoModule = () => {
  const { gallos, loadGallos, toast, activeOwnerId, canEdit } = useContext(AppContext);
  const [vista, setVista] = useState('planificar');
  const [padre, setPadre] = useState(null);
  const [madre, setMadre] = useState(null);
  const [cruces, setCruces] = useState([]);
  const [eventos, setEventos] = useState([]);
  const [showGuardar, setShowGuardar] = useState(false);
  const [detalleId, setDetalleId] = useState(null);
  const [arbolGallo, setArbolGallo] = useState(null);
  const [showAnalisis, setShowAnalisis] = useState(false);
  const [showAsesor, setShowAsesor] = useState(false);
  const [fechaCruce, setFechaCruce] = useState(hoyStr());
  const [notas, setNotas] = useState('');

  const consang = useMemo(() => (padre && madre) ? analizarConsanguinidad(padre, madre, gallos, cruces, 6) : null, [padre, madre, gallos, cruces]);

  const loadCruces = useCallback(async () => {
    const [c, e] = await Promise.all([
      supabase.from('cruces').select('*').eq('user_id', activeOwnerId).order('fecha_cruce', { ascending: false }),
      supabase.from('cruce_eventos').select('*').eq('user_id', activeOwnerId).order('fecha', { ascending: true }),
    ]);
    setCruces(c.data || []);
    setEventos(e.data || []);
  }, [activeOwnerId]);
  useEffect(() => { loadCruces(); }, [loadCruces]);

  const prediccion = useMemo(() => (padre && madre) ? predecirCruce(padre, madre, gallos) : null, [padre, madre, gallos]);

  const guardarCruce = async () => {
    const { error } = await supabase.from('cruces').insert({
      user_id: activeOwnerId,
      padre_id: padre.id,
      madre_id: madre.id,
      fecha_cruce: fechaCruce,
      estado: 'Activo',
      notas: notas || null,
      prediccion: prediccion || null,
    });
    if (error) { toast('Error al guardar: ' + error.message, 'error'); return; }
    toast('Casta guardada ✓');
    setShowGuardar(false); setNotas('');
    setPadre(null); setMadre(null);
    setVista('castas');
    loadCruces();
  };

  const detalle = detalleId ? cruces.find(c => c.id === detalleId) : null;
  const activas = cruces.filter(c => !['Cerrado', 'Fallido'].includes(c.estado)).length;
  const VistaBtn = ({ id, children }) => (
    <button onClick={() => setVista(id)}
      className={`flex-1 px-2 py-2 rounded-md text-xs font-semibold ${vista === id ? 'bg-white shadow text-red-700' : 'text-gray-500'}`}>{children}</button>
  );

  return (
    <div className="fade-in">
      <div className="mb-3 flex items-start justify-between gap-2">
        <div>
          <h2 className="text-xl font-bold text-gray-800">Castadero</h2>
          <p className="text-sm text-gray-500">{activas > 0 ? `${activas} casta${activas === 1 ? '' : 's'} en proceso` : 'Planifica y dale seguimiento a tus castas'}</p>
        </div>
        <button onClick={() => setShowAsesor(true)}
          className="bg-gray-800 text-white px-3 py-2 rounded-lg text-xs font-semibold hover:bg-gray-900 flex-shrink-0">
          🎯 Asesor
        </button>
      </div>

      <div className="flex rounded-lg bg-gray-200 p-0.5 mb-4">
        <VistaBtn id="planificar">🧬 Planificar</VistaBtn>
        <VistaBtn id="castas">📋 Castas ({cruces.length})</VistaBtn>
        <VistaBtn id="calendario">📅 Calendario</VistaBtn>
      </div>

      {vista === 'planificar' && (
        <div>
          <div className="bg-white rounded-xl border border-gray-200 p-3 mb-4">
            <div className="grid grid-cols-1 gap-3">
              <div>
                <p className="text-xs font-semibold text-blue-600 mb-1">♂ Gallo (padre)</p>
                <GalloSearch gallos={gallos} selected={padre} onSelect={setPadre} onClear={() => setPadre(null)}
                  placeholder="Buscar gallo..." filter={g => g.sexo === 'Gallo'} />
              </div>
              <div className="text-center text-gray-300 text-xl leading-none">✕</div>
              <div>
                <p className="text-xs font-semibold text-pink-600 mb-1">♀ Gallina (madre)</p>
                <GalloSearch gallos={gallos} selected={madre} onSelect={setMadre} onClear={() => setMadre(null)}
                  placeholder="Buscar gallina..." filter={g => g.sexo === 'Gallina'} />
              </div>
            </div>
          </div>

          {padre && madre ? (
            <>
              {canEdit && (
                <button onClick={() => setShowGuardar(true)}
                  className="w-full bg-red-600 text-white py-3 rounded-xl text-sm font-bold hover:bg-red-700 mb-3">
                  ❤️ Echar a castar
                </button>
              )}

              <SangreCriaCard padre={padre} madre={madre} gallos={gallos} />

              {consang && (
                <button onClick={() => setShowAnalisis(true)}
                  className={`w-full text-left rounded-xl p-3 mb-3 border ${interpretarF(consang.F).cls} border-transparent hover:opacity-90`}>
                  <div className="flex items-center justify-between">
                    <div className="min-w-0">
                      <p className="text-xs font-bold uppercase tracking-wide">🔬 Consanguinidad ~{(consang.F * 100).toFixed(1)}% · {interpretarF(consang.F).txt}</p>
                      <p className="text-[11px] opacity-80 truncate">{interpretarF(consang.F).hint}</p>
                    </div>
                    <span className="text-xs font-semibold underline ml-2 flex-shrink-0">Ver árboles ▸</span>
                  </div>
                </button>
              )}

              <h3 className="text-sm font-bold text-gray-700 mb-2">🔮 Cómo puede salir la cría</h3>
              <PrediccionCard prediccion={prediccion} />
            </>
          ) : (
            <div className="text-center text-gray-400 py-8 text-sm">
              Escoge un gallo y una gallina para ver de quién viene la cría y cómo puede salir.
            </div>
          )}
        </div>
      )}

      {vista === 'castas' && (
        cruces.length === 0 ? (
          <div className="text-center py-10">
            <p className="text-gray-400 text-sm mb-3">Todavía no has echado ninguna casta.</p>
            <button onClick={() => setVista('planificar')} className="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Planificar una casta</button>
          </div>
        ) : (
          <div className="space-y-2">
            {cruces.map(c => {
              const p = gallos.find(g => g.id === c.padre_id);
              const m = gallos.find(g => g.id === c.madre_id);
              const pollos = gallos.filter(g => g.cruce_id === c.id);
              const r = resumenCasta(c, eventos.filter(e => e.cruce_id === c.id), pollos);
              return (
                <div key={c.id} className="bg-white rounded-xl border border-gray-200 p-3 active:bg-gray-50 cursor-pointer" onClick={() => setDetalleId(c.id)}>
                  <div className="flex items-start justify-between gap-2">
                    <p className="text-sm font-bold text-gray-800 min-w-0">
                      <span className="text-blue-600">♂ {nombreGallo(p)}</span>
                      <span className="text-gray-300"> × </span>
                      <span className="text-pink-600">♀ {nombreGallo(m)}</span>
                    </p>
                    <span className={`text-[10px] font-semibold px-2 py-1 rounded-full flex-shrink-0 ${r.cls}`}>{r.fase}</span>
                  </div>
                  <p className="text-[11px] text-gray-500 mt-1">
                    ❤️ {fmtF(c.fecha_cruce)}
                    {r.huevos > 0 ? ` · 🥚 ${r.huevos}` : ''}
                    {r.empolle ? ` · 🪺 ${fmtF(r.empolle)}` : ''}
                    {r.fNac ? ` · 🐣 ${fmtF(r.fNac)}` : ''}
                    {pollos.length > 0 ? ` · ${r.pinchados}/${pollos.length} pinchados` : ''}
                  </p>
                  {r.esperada && (
                    <p className="text-[11px] font-semibold text-green-700 mt-0.5">
                      ⏳ Nacen el {fmtF(r.esperada)} · {r.faltan > 0 ? `faltan ${r.faltan} día${r.faltan === 1 ? '' : 's'}` : r.faltan === 0 ? 'hoy' : `hace ${-r.faltan} día${r.faltan === -1 ? '' : 's'}`}
                    </p>
                  )}
                </div>
              );
            })}
          </div>
        )
      )}

      {vista === 'calendario' && <CalendarioCastas cruces={cruces} eventos={eventos} gallos={gallos} onOpen={setDetalleId} />}

      {showGuardar && (
        <Modal title="Echar a castar" onClose={() => setShowGuardar(false)}>
          <div className="space-y-4">
            <p className="text-sm text-gray-600">
              <span className="text-blue-600 font-semibold">♂ {nombreGallo(padre)}</span> × <span className="text-pink-600 font-semibold">♀ {nombreGallo(madre)}</span>
            </p>
            <Field label="Fecha en que le echaste el gallo">
              <Input type="date" value={fechaCruce} onChange={e => setFechaCruce(e.target.value)} />
            </Field>
            <Field label="Notas (opcional)">
              <Textarea value={notas} onChange={e => setNotas(e.target.value)} placeholder="Corral, jaula, observaciones..." />
            </Field>
            <button onClick={guardarCruce} className="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700">
              Guardar casta
            </button>
          </div>
        </Modal>
      )}

      {detalle && (
        <DetalleCastaModal
          cruce={detalle}
          gallos={gallos}
          eventos={eventos.filter(e => e.cruce_id === detalle.id)}
          onClose={() => setDetalleId(null)}
          onReload={() => { loadCruces(); loadGallos(); }}
          onVerArbol={g => setArbolGallo(g)}
          canEdit={canEdit}
          toast={toast}
          activeOwnerId={activeOwnerId}
        />
      )}

      {arbolGallo && <PedigriModal gallos={gallos} initialFocusId={arbolGallo.id} onClose={() => setArbolGallo(null)} />}

      {showAnalisis && padre && madre && (
        <AnalisisCastaModal padre={padre} madre={madre} gallos={gallos} cruces={cruces} onClose={() => setShowAnalisis(false)} />
      )}

      {showAsesor && (
        <AsesorCrucesModal gallos={gallos} cruces={cruces}
          onUsar={(g, h) => { setPadre(g); setMadre(h); setVista('planificar'); }}
          onClose={() => setShowAsesor(false)} />
      )}
    </div>
  );
};

// Un pollo de la casta: se le pone pinche, sexo y color cuando se sepa
const PolloRow = ({ g, canEdit, onSaved, onVerArbol, toast }) => {
  const [edit, setEdit] = useState(false);
  const [f, setF] = useState({ nombre: g.nombre || '', numero_pinches: g.numero_pinches == null ? '' : String(g.numero_pinches), sexo: g.sexo, color: g.color || '' });
  const save = async () => {
    if (!f.nombre.trim() && !f.numero_pinches) { toast('Pon nombre o # de pinche', 'error'); return; }
    const { error } = await supabase.from('gallos').update({
      nombre: f.nombre.trim() || null,
      numero_pinches: f.numero_pinches === '' ? null : parseInt(f.numero_pinches, 10),
      sexo: f.sexo,
      color: f.color.trim() || null,
    }).eq('id', g.id);
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    toast('Guardado ✓'); setEdit(false); onSaved();
  };
  if (edit) return (
    <div className="bg-gray-50 border border-gray-200 rounded-lg p-2.5 space-y-2">
      <div className="grid grid-cols-2 gap-2">
        <Field label="# Pinche"><Input type="number" inputMode="numeric" value={f.numero_pinches} onChange={e => setF({ ...f, numero_pinches: e.target.value })} /></Field>
        <Field label="Sexo"><Select value={f.sexo} onChange={e => setF({ ...f, sexo: e.target.value })} options={['Pollo', 'Gallo', 'Gallina']} /></Field>
        <Field label="Nombre"><Input value={f.nombre} onChange={e => setF({ ...f, nombre: e.target.value })} /></Field>
        <Field label="Color"><Input value={f.color} onChange={e => setF({ ...f, color: e.target.value })} placeholder="ej: Giro" /></Field>
      </div>
      <div className="flex gap-2">
        <button onClick={() => setEdit(false)} className="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-semibold">Cancelar</button>
        <button onClick={save} className="flex-1 bg-red-600 text-white py-2 rounded-lg text-sm font-semibold">Guardar</button>
      </div>
    </div>
  );
  return (
    <div className="flex items-center justify-between bg-white border border-gray-200 rounded-lg px-3 py-2">
      <div className="flex items-center gap-2 min-w-0">
        <span className={g.sexo === 'Gallina' ? 'text-pink-500' : g.sexo === 'Gallo' ? 'text-blue-500' : ''}>{sexoIcon(g)}</span>
        <div className="min-w-0">
          <p className="text-sm font-medium text-gray-800 truncate">{nombreGallo(g)}</p>
          <p className="text-[11px] text-gray-400 truncate">
            {g.numero_pinches ? '#' + g.numero_pinches : 'sin pinche'} · {g.sexo === 'Pollo' ? 'sexo por definir' : g.sexo}{g.color ? ' · ' + g.color : ''}
          </p>
        </div>
      </div>
      <div className="flex items-center gap-1 flex-shrink-0">
        {canEdit && <button onClick={() => setEdit(true)} className="text-xs font-semibold text-red-600 px-2 py-1">Editar</button>}
        <button onClick={() => onVerArbol(g)} className="text-lg" title="Ver árbol">🌳</button>
      </div>
    </div>
  );
};

// Detalle de una casta: línea de tiempo, registro rápido y pollos
const DetalleCastaModal = ({ cruce, gallos, eventos, onClose, onReload, onVerArbol, canEdit, toast, activeOwnerId }) => {
  const p = gallos.find(g => g.id === cruce.padre_id);
  const m = gallos.find(g => g.id === cruce.madre_id);
  const pollos = gallos.filter(g => g.cruce_id === cruce.id);
  const evs = eventos;
  const r = resumenCasta(cruce, evs, pollos);
  const [form, setForm] = useState(null);
  const [saving, setSaving] = useState(false);
  const abrir = (tipo) => setForm({ tipo, fecha: hoyStr(), cantidad: tipo === 'huevo' ? '1' : '', nota: '' });

  // Mantiene el resumen de la casta al día con lo anotado
  const sync = async (lista) => {
    const t = resumenCasta(cruce, lista, pollos);
    await supabase.from('cruces').update({
      estado: cruce.estado === 'Cerrado' ? 'Cerrado' : t.estado,
      numero_huevos: t.huevos || null,
      huevos_eclosionados: t.nacidos || null,
      num_pollos: t.nacidos || null,
    }).eq('id', cruce.id);
  };

  const crearPollos = async (n, fecha) => {
    const base = pollos.length;
    const filas = [];
    for (let i = 1; i <= n; i++) filas.push({
      user_id: activeOwnerId,
      nombre: ('Pollo ' + (base + i) + ' de ' + nombreGallo(m)).slice(0, 250),
      sexo: 'Pollo',
      fecha_nacimiento: fecha,
      padre_id: cruce.padre_id,
      madre_id: cruce.madre_id,
      cruce_id: cruce.id,
    });
    return supabase.from('gallos').insert(filas);
  };

  const guardarEvento = async () => {
    const cant = form.cantidad === '' ? null : parseInt(form.cantidad, 10);
    if ((form.tipo === 'huevo' || form.tipo === 'nacimiento') && !(cant > 0)) { toast(form.tipo === 'huevo' ? 'Pon cuántos huevos' : 'Pon cuántos pollos nacieron', 'error'); return; }
    if (form.tipo === 'nota' && !form.nota.trim()) { toast('Escribe la nota', 'error'); return; }
    if (!form.fecha) { toast('Pon la fecha', 'error'); return; }
    setSaving(true);
    if (form.tipo === 'nacimiento') {
      const { error: e1 } = await crearPollos(cant, form.fecha);
      if (e1) {
        toast(/sexo_check/.test(e1.message) ? 'Falta correr el script de base de datos para pollos sin sexo. No se guardó nada.' : 'Error al crear los pollos: ' + e1.message, 'error');
        setSaving(false); return;
      }
    }
    const nuevo = { cruce_id: cruce.id, user_id: activeOwnerId, fecha: form.fecha, tipo: form.tipo, cantidad: cant, nota: form.nota.trim() || null };
    const { error } = await supabase.from('cruce_eventos').insert(nuevo);
    if (error) { toast('Error: ' + error.message, 'error'); setSaving(false); return; }
    await sync(evs.concat([nuevo]));
    toast(form.tipo === 'nacimiento' ? `${cant} pollos creados ✓` : 'Anotado ✓');
    setForm(null); setSaving(false); onReload();
  };

  const borrarEvento = async (ev) => {
    if (!confirm('¿Borrar "' + EV_META[ev.tipo].label + '" del ' + fmtF(ev.fecha) + '?' + (ev.tipo === 'nacimiento' ? '\n\nLos pollos ya creados NO se borran.' : ''))) return;
    const { error } = await supabase.from('cruce_eventos').delete().eq('id', ev.id);
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    await sync(evs.filter(e => e.id !== ev.id));
    toast('Borrado'); onReload();
  };

  const agregarPollo = async () => {
    const { error } = await crearPollos(1, r.fNac || hoyStr());
    if (error) { toast(/sexo_check/.test(error.message) ? 'Falta correr el script de base de datos para pollos sin sexo.' : 'Error: ' + error.message, 'error'); return; }
    toast('Pollo añadido ✓'); onReload();
  };

  const eliminarCasta = async () => {
    const aviso = '¿Eliminar la casta ' + nombreGallo(p) + ' × ' + nombreGallo(m) + '?\n\nSe borra la casta y todo lo anotado (huevos, empolle, notas). No se puede deshacer.' +
      (pollos.length ? '\n\nLos ' + pollos.length + ' pollos NO se borran: se quedan en tu lista de gallos con su padre y su madre.' : '');
    if (!confirm(aviso)) return;
    const { data, error } = await supabase.from('cruces').delete().eq('id', cruce.id).select('id');
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    if (!data || data.length === 0) { toast('Solo el dueño de la gallera puede eliminar una casta', 'error'); return; }
    toast('Casta eliminada'); onClose(); onReload();
  };

  const cerrar = async (estado) => {
    const { error } = await supabase.from('cruces').update({ estado }).eq('id', cruce.id);
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    toast(estado === 'Cerrado' ? 'Casta cerrada' : 'Casta reabierta'); onReload();
  };

  const Paso = ({ hecho, actual, titulo, sub }) => (
    <div className="flex gap-2.5">
      <div className="flex flex-col items-center">
        <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-bold flex-shrink-0 ${hecho ? 'bg-green-500 text-white' : actual ? 'bg-blue-500 text-white' : 'border-2 border-dashed border-gray-300 text-gray-300'}`}>{hecho ? '✓' : actual ? '•' : ''}</span>
        <span className="w-px flex-1 bg-gray-200 my-0.5" />
      </div>
      <div className="pb-3 min-w-0">
        <p className={`text-sm font-semibold leading-5 ${hecho || actual ? 'text-gray-800' : 'text-gray-400'}`}>{titulo}</p>
        {sub && <p className={`text-[11px] ${actual ? 'text-blue-600 font-semibold' : 'text-gray-500'}`}>{sub}</p>}
      </div>
    </div>
  );
  const rangoHuevos = r.fHuevos.length ? (r.fHuevos[0] === r.fHuevos[r.fHuevos.length - 1] ? fmtF(r.fHuevos[0]) : fmtF(r.fHuevos[0]) + ' al ' + fmtF(r.fHuevos[r.fHuevos.length - 1])) : null;
  const listaEvs = evs.slice().sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));
  const tituloForm = form ? { huevo: '🥚 Puso huevo', empollar: '🪺 Se echó a empollar', nacimiento: '🐣 Nacieron pollos', nota: '📝 Nota', fallido: '✖️ Se perdió la casta' }[form.tipo] : '';
  const AccionBtn = ({ tipo, icon, texto }) => (
    <button onClick={() => abrir(tipo)} className={`py-2 rounded-lg text-xs font-semibold border ${form && form.tipo === tipo ? 'bg-red-50 border-red-300 text-red-700' : 'bg-white border-gray-200 text-gray-700'}`}>
      <span className="block text-lg leading-6">{icon}</span>{texto}
    </button>
  );

  return (
    <Modal title={`${nombreGallo(p)} × ${nombreGallo(m)}`} onClose={onClose} wide>
      <div className="space-y-4">
        <div className="flex items-center justify-between gap-2">
          <p className="text-sm min-w-0">
            <span className="text-blue-600 font-semibold">♂ {nombreGallo(p)}</span>
            <span className="text-gray-300"> × </span>
            <span className="text-pink-600 font-semibold">♀ {nombreGallo(m)}</span>
          </p>
          <span className={`text-[11px] font-semibold px-2 py-1 rounded-full flex-shrink-0 ${r.cls}`}>{r.fase}</span>
        </div>

        <div className="bg-gray-50 rounded-xl p-3">
          <Paso hecho titulo="Le echó el gallo" sub={fmtF(cruce.fecha_cruce)} />
          <Paso hecho={r.huevos > 0} actual={!r.huevos && !r.empolle && !r.fNac && !r.fallido}
            titulo={r.huevos > 0 ? `Puso ${r.huevos} huevo${r.huevos === 1 ? '' : 's'}` : 'Puso huevos'} sub={rangoHuevos || 'pendiente'} />
          <Paso hecho={!!r.empolle && !!r.fNac} actual={!!r.empolle && !r.fNac && !r.fallido}
            titulo="Se echó a empollar" sub={r.empolle ? fmtF(r.empolle) + (!r.fNac && !r.fallido ? ' · ' + r.fase.replace('Empollando · ', '') + ' de ' + DIAS_INCUBACION : '') : 'pendiente'} />
          <Paso hecho={!!r.fNac} titulo={r.fNac ? `Nacieron ${r.nacidos} pollo${r.nacidos === 1 ? '' : 's'}` : 'Nacen los pollos'}
            sub={r.fNac ? fmtF(r.fNac) : r.esperada ? `esperado ${fmtF(r.esperada)} · ${r.faltan > 0 ? 'faltan ' + r.faltan + ' días' : r.faltan === 0 ? 'hoy' : 'hace ' + (-r.faltan) + ' días'}` : 'pendiente'} />
          <div className="flex gap-2.5">
            <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-bold flex-shrink-0 ${pollos.length > 0 && r.pinchados === pollos.length ? 'bg-green-500 text-white' : 'border-2 border-dashed border-gray-300 text-gray-300'}`}>{pollos.length > 0 && r.pinchados === pollos.length ? '✓' : ''}</span>
            <div className="min-w-0">
              <p className={`text-sm font-semibold leading-5 ${pollos.length > 0 ? 'text-gray-800' : 'text-gray-400'}`}>Pinchados</p>
              <p className="text-[11px] text-gray-500">{pollos.length > 0 ? `${r.pinchados} de ${pollos.length} con pinche` : 'pendiente'}</p>
            </div>
          </div>
          {r.fallido && <p className="text-xs font-semibold text-red-700 mt-2">✖️ Esta casta se perdió.</p>}
        </div>

        {canEdit && cruce.estado !== 'Cerrado' && (
          <div>
            <p className="text-xs font-bold text-gray-500 uppercase mb-2">Anotar</p>
            <div className="grid grid-cols-4 gap-2">
              <AccionBtn tipo="huevo" icon="🥚" texto="Huevo" />
              <AccionBtn tipo="empollar" icon="🪺" texto="Empollar" />
              <AccionBtn tipo="nacimiento" icon="🐣" texto="Nacieron" />
              <AccionBtn tipo="nota" icon="📝" texto="Nota" />
            </div>
            {form && (
              <div className="bg-gray-50 border border-gray-200 rounded-xl p-3 mt-2 space-y-3">
                <p className="text-sm font-bold text-gray-800">{tituloForm}</p>
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Fecha"><Input type="date" value={form.fecha} onChange={e => setForm({ ...form, fecha: e.target.value })} /></Field>
                  {form.tipo !== 'nota' && form.tipo !== 'fallido' && (
                    <Field label={form.tipo === 'huevo' ? '¿Cuántos huevos?' : form.tipo === 'empollar' ? 'Huevos echados (opcional)' : '¿Cuántos pollos?'}>
                      <Input type="number" inputMode="numeric" min="0" value={form.cantidad} onChange={e => setForm({ ...form, cantidad: e.target.value })} />
                    </Field>
                  )}
                </div>
                <Field label={form.tipo === 'nota' ? 'Nota' : 'Nota (opcional)'}>
                  <Textarea rows="2" value={form.nota} onChange={e => setForm({ ...form, nota: e.target.value })} />
                </Field>
                {form.tipo === 'nacimiento' && <p className="text-[11px] text-gray-500">Se crean los pollos enlazados a esta casta. Después le pones a cada uno su pinche, sexo y color.</p>}
                {form.tipo === 'empollar' && <p className="text-[11px] text-gray-500">El nacimiento se calcula para {fmtF(sumarDias(form.fecha || hoyStr(), DIAS_INCUBACION))} ({DIAS_INCUBACION} días).</p>}
                <div className="flex gap-2">
                  <button onClick={() => setForm(null)} className="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg text-sm font-semibold">Cancelar</button>
                  <button onClick={guardarEvento} disabled={saving} className="flex-1 bg-red-600 text-white py-2.5 rounded-lg text-sm font-semibold disabled:opacity-50">{saving ? 'Guardando...' : 'Guardar'}</button>
                </div>
              </div>
            )}
          </div>
        )}

        <div className="border-t border-gray-100 pt-3">
          <div className="flex items-center justify-between mb-2">
            <p className="text-xs font-bold text-gray-500 uppercase">Pollos de esta casta ({pollos.length})</p>
            {canEdit && <button onClick={agregarPollo} className="text-xs font-semibold text-red-600">+ Añadir uno</button>}
          </div>
          {pollos.length === 0
            ? <p className="text-center text-gray-400 py-3 text-sm">Cuando nazcan, anótalos con "Nacieron" y se crean aquí.</p>
            : <div className="space-y-1.5">{pollos.map(g => <PolloRow key={g.id} g={g} canEdit={canEdit} onSaved={onReload} onVerArbol={onVerArbol} toast={toast} />)}</div>}
        </div>

        <div className="border-t border-gray-100 pt-3">
          <p className="text-xs font-bold text-gray-500 uppercase mb-2">Historial ({listaEvs.length})</p>
          {listaEvs.length === 0
            ? <p className="text-center text-gray-400 py-3 text-sm">Todavía no hay nada anotado.</p>
            : <div className="space-y-1.5">
                {listaEvs.map(ev => (
                  <div key={ev.id || ev.fecha + ev.tipo} className="flex items-start justify-between bg-white border border-gray-200 rounded-lg px-3 py-2">
                    <div className="min-w-0">
                      <p className="text-sm text-gray-800">{EV_META[ev.tipo].icon} {EV_META[ev.tipo].label}{ev.cantidad ? ` · ${ev.cantidad}` : ''}</p>
                      <p className="text-[11px] text-gray-500">{fmtF(ev.fecha)}{ev.nota ? ' — ' + ev.nota : ''}</p>
                    </div>
                    {canEdit && ev.id && <button onClick={() => borrarEvento(ev)} className="text-gray-300 hover:text-red-500 text-sm ml-2 flex-shrink-0">🗑</button>}
                  </div>
                ))}
              </div>}
          {cruce.notas && <p className="text-[11px] text-gray-500 mt-2">📝 {cruce.notas}</p>}
        </div>

        {canEdit && (
          <div>
          <div className="flex gap-2">
            {cruce.estado !== 'Cerrado' && !r.fallido && <button onClick={() => abrir('fallido')} className="flex-1 border border-gray-200 text-gray-500 py-2 rounded-lg text-xs font-semibold">✖️ Se perdió</button>}
            {cruce.estado === 'Cerrado'
              ? <button onClick={() => cerrar(r.estado)} className="flex-1 border border-gray-200 text-gray-600 py-2 rounded-lg text-xs font-semibold">Reabrir casta</button>
              : <button onClick={() => cerrar('Cerrado')} className="flex-1 border border-gray-200 text-gray-600 py-2 rounded-lg text-xs font-semibold">Cerrar casta</button>}
          </div>
            <button onClick={eliminarCasta} className="w-full mt-2 border border-red-200 text-red-600 py-2 rounded-lg text-xs font-semibold hover:bg-red-50">🗑 Eliminar casta</button>
          </div>
        )}
      </div>
    </Modal>
  );
};

// ============================================
// MÓDULO: GENÉTICA
// ============================================
const GeneticaModule = () => {
  const { gallos, loadGallos, opciones, addOpcion, toast, activeOwnerId, canEdit } = useContext(AppContext);
  const [showForm, setShowForm] = useState(false);
  const [editingGallo, setEditingGallo] = useState(null);
  const [showArbol, setShowArbol] = useState(null);
  const [searchQ, setSearchQ] = useState('');
  const [viewingPhoto, setViewingPhoto] = useState(null);

  const emptyForm = {
    numero_pinches: '', nombre: '', sexo: 'Gallo', amarrado: false, jaula: '',
    fecha_nacimiento: '', color: '', linea_genetica: '',
    padre_id: null, madre_id: null, caracteristicas: [], observaciones: '',
    foto: null
  };
  const [form, setForm] = useState(emptyForm);
  const [padreSelected, setPadreSelected] = useState(null);
  const [madreSelected, setMadreSelected] = useState(null);

  const caracteristicas = opciones['caracteristicas'] || [];
  const [nuevaCar, setNuevaCar] = useState('');

  const filteredGallos = useMemo(() => {
    if (!searchQ) return gallos;
    const q = searchQ.toLowerCase();
    return gallos.filter(g =>
      (g.nombre && g.nombre.toLowerCase().includes(q)) ||
      (g.numero_pinches && g.numero_pinches.toString().includes(q)) ||
      (g.linea_genetica && g.linea_genetica.toLowerCase().includes(q))
    );
  }, [gallos, searchQ]);

  const handleSave = async () => {
    if (!form.numero_pinches && !form.nombre) {
      toast('Debes ingresar Número de Pinches o Nombre', 'error');
      return;
    }

    const data = {
      nombre: form.nombre || null,
      numero_pinches: form.numero_pinches ? parseInt(form.numero_pinches) : null,
      sexo: form.sexo,
      amarrado: form.amarrado,
      jaula: form.amarrado ? (form.jaula || null) : null,
      fecha_nacimiento: form.fecha_nacimiento || null,
      color: form.color || null,
      linea_genetica: form.linea_genetica || null,
      padre_id: form.padre_id,
      madre_id: form.madre_id,
      caracteristicas: form.caracteristicas,
      observaciones: form.observaciones || null,
      foto: form.foto || null,
      user_id: activeOwnerId
    };

    let error;
    if (editingGallo) {
      ({ error } = await supabase.from('gallos').update(data).eq('id', editingGallo.id));
    } else {
      ({ error } = await supabase.from('gallos').insert(data));
    }

    if (error) {
      toast(error.message.includes('unique') ? 'Ya existe un gallo con ese número de pinches' : error.message, 'error');
      return;
    }

    toast(editingGallo ? 'Gallo actualizado' : 'Gallo creado', 'success');
    setShowForm(false);
    setEditingGallo(null);
    setForm(emptyForm);
    setPadreSelected(null);
    setMadreSelected(null);
    loadGallos();
  };

  const handleEdit = (gallo) => {
    setForm({
      numero_pinches: gallo.numero_pinches || '',
      nombre: gallo.nombre || '',
      sexo: gallo.sexo || 'Gallo',
      amarrado: gallo.amarrado || false,
      jaula: gallo.jaula || '',
      fecha_nacimiento: gallo.fecha_nacimiento || '',
      color: gallo.color || '',
      linea_genetica: gallo.linea_genetica || '',
      padre_id: gallo.padre_id,
      madre_id: gallo.madre_id,
      caracteristicas: gallo.caracteristicas || [],
      observaciones: gallo.observaciones || '',
      foto: gallo.foto || null
    });
    const padre = gallos.find(g => g.id === gallo.padre_id);
    const madre = gallos.find(g => g.id === gallo.madre_id);
    setPadreSelected(padre || null);
    setMadreSelected(madre || null);
    setEditingGallo(gallo);
    setShowForm(true);
  };

  const handleDelete = async (gallo) => {
    if (!confirm(`¿Eliminar a ${gallo.nombre || '#' + gallo.numero_pinches}?`)) return;
    const { error } = await supabase.from('gallos').delete().eq('id', gallo.id);
    if (error) { toast(error.message, 'error'); return; }
    toast('Gallo eliminado', 'success');
    loadGallos();
  };

  const toggleCar = (car) => {
    setForm(f => ({
      ...f,
      caracteristicas: f.caracteristicas.includes(car)
        ? f.caracteristicas.filter(c => c !== car)
        : [...f.caracteristicas, car]
    }));
  };

  const handleAddCar = async () => {
    if (!nuevaCar.trim()) return;
    await addOpcion('caracteristicas', nuevaCar.trim());
    setForm(f => ({ ...f, caracteristicas: [...f.caracteristicas, nuevaCar.trim()] }));
    setNuevaCar('');
  };

  // Árbol genealógico completo
  const ArbolModal = ({ gallo }) => {
    const padre = gallos.find(g => g.id === gallo.padre_id);
    const madre = gallos.find(g => g.id === gallo.madre_id);
    const abueloP = padre ? gallos.find(g => g.id === padre.padre_id) : null;
    const abuelaP = padre ? gallos.find(g => g.id === padre.madre_id) : null;
    const abueloM = madre ? gallos.find(g => g.id === madre.padre_id) : null;
    const abuelaM = madre ? gallos.find(g => g.id === madre.madre_id) : null;

    // Hermanos: mismos padres (al menos uno en común), excluyendo el gallo actual
    const hermanos = gallos.filter(g => {
      if (g.id === gallo.id) return false;
      const compartenPadre = gallo.padre_id && g.padre_id && gallo.padre_id === g.padre_id;
      const compartenMadre = gallo.madre_id && g.madre_id && gallo.madre_id === g.madre_id;
      return compartenPadre || compartenMadre;
    });

    // Hijos: gallos donde este gallo es padre o madre
    const hijos = gallos.filter(g => g.padre_id === gallo.id || g.madre_id === gallo.id);

    // Nietos: hijos de los hijos
    const nietos = gallos.filter(g => hijos.some(h => h.id === g.padre_id || h.id === g.madre_id));

    const Nodo = ({ gallo: g, label, highlight, small }) => (
      <div className={`border-2 rounded-lg p-2 text-center ${small ? 'min-w-[80px]' : 'min-w-[100px]'} ${
        highlight ? 'border-red-500 bg-red-50' : 'border-gray-200 bg-white'
      }`}>
        <p className="text-[10px] text-gray-400 uppercase">{label}</p>
        {g ? (
          <>
            <p className={`font-bold ${small ? 'text-xs' : 'text-sm'} ${highlight ? 'text-red-800' : 'text-gray-800'}`}>
              {g.nombre || 'Sin nombre'} {g.numero_pinches ? `(#${g.numero_pinches})` : ''}
            </p>
            <p className={`text-[10px] ${highlight ? 'text-red-600' : 'text-gray-500'}`}>
              {[g.linea_genetica, g.color].filter(Boolean).join(' • ') || ''}
            </p>
            {highlight && g.caracteristicas && g.caracteristicas.length > 0 && (
              <div className="flex flex-wrap gap-1 justify-center mt-1">
                {g.caracteristicas.map(c => <span key={c} className="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded">{c}</span>)}
              </div>
            )}
          </>
        ) : <p className="text-xs text-gray-400 italic">Desconocido</p>}
      </div>
    );

    const Flecha = () => <div className="text-gray-300 text-xl text-center">↓</div>;

    const SeccionLabel = ({ text, count }) => (
      <div className="flex items-center gap-2 justify-center mb-2">
        <div className="h-px bg-gray-200 flex-1" />
        <span className="text-xs font-bold text-gray-500 uppercase tracking-wider">{text} {count > 0 ? `(${count})` : ''}</span>
        <div className="h-px bg-gray-200 flex-1" />
      </div>
    );

    return (
      <Modal title={`Árbol: ${gallo.nombre || '#' + gallo.numero_pinches}`} onClose={() => setShowArbol(null)} wide>
        <div className="overflow-x-auto">
          <div className="min-w-[600px] flex flex-col items-center gap-3 py-4">

            {/* ABUELOS */}
            <SeccionLabel text="Abuelos" />
            <div className="flex gap-3 justify-center flex-wrap">
              <Nodo gallo={abueloP} label="Abuelo Pat." />
              <Nodo gallo={abuelaP} label="Abuela Pat." />
              <Nodo gallo={abueloM} label="Abuelo Mat." />
              <Nodo gallo={abuelaM} label="Abuela Mat." />
            </div>
            <Flecha />

            {/* PADRES */}
            <SeccionLabel text="Padres" />
            <div className="flex gap-8 justify-center">
              <Nodo gallo={padre} label="Padre" />
              <Nodo gallo={madre} label="Madre" />
            </div>
            <Flecha />

            {/* GALLO SELECCIONADO + HERMANOS */}
            <SeccionLabel text={hermanos.length > 0 ? 'Gallo + Hermanos' : 'Gallo'} />
            <div className="flex gap-3 justify-center items-start flex-wrap">
              {hermanos.filter(h => {
                const compartenPadre = gallo.padre_id && h.padre_id && gallo.padre_id === h.padre_id;
                const compartenMadre = gallo.madre_id && h.madre_id && gallo.madre_id === h.madre_id;
                return compartenPadre && compartenMadre;
              }).map(h => (
                <Nodo key={h.id} gallo={h} label="Hermano" small />
              ))}
              <Nodo gallo={gallo} label="★ Seleccionado" highlight />
              {hermanos.filter(h => {
                const compartenPadre = gallo.padre_id && h.padre_id && gallo.padre_id === h.padre_id;
                const compartenMadre = gallo.madre_id && h.madre_id && gallo.madre_id === h.madre_id;
                return !(compartenPadre && compartenMadre);
              }).map(h => (
                <Nodo key={h.id} gallo={h} label="Medio-Hno." small />
              ))}
            </div>

            {/* HIJOS Y NIETOS JERÁRQUICO */}
            {hijos.length > 0 && (
              <>
                <Flecha />
                <SeccionLabel text="Hijos y Descendientes" count={hijos.length} />
                <div className="flex gap-6 justify-center flex-wrap">
                  {hijos.map(h => {
                    const otroParent = h.padre_id === gallo.id
                      ? gallos.find(g => g.id === h.madre_id)
                      : gallos.find(g => g.id === h.padre_id);
                    const nietosDelHijo = gallos.filter(n => n.padre_id === h.id || n.madre_id === h.id);

                    return (
                      <div key={h.id} className="flex flex-col items-center">
                        <Nodo gallo={h} label="Hijo/a" small />
                        {otroParent && <p className="text-[9px] text-gray-400 mt-0.5">con {otroParent.nombre || '#' + otroParent.numero_pinches}</p>}

                        {/* Nietos cuelgan del hijo */}
                        {nietosDelHijo.length > 0 && (
                          <div className="flex flex-col items-center mt-2">
                            <div className="text-gray-300 text-sm">↓</div>
                            <div className="flex gap-2 flex-wrap justify-center">
                              {nietosDelHijo.map(n => {
                                const otroNietoParent = n.padre_id === h.id
                                  ? gallos.find(g => g.id === n.madre_id)
                                  : gallos.find(g => g.id === n.padre_id);
                                return (
                                  <div key={n.id} className="flex flex-col items-center">
                                    <Nodo gallo={n} label="Nieto/a" small />
                                    {otroNietoParent && otroNietoParent.id !== gallo.id && <p className="text-[8px] text-gray-300 mt-0.5">{otroNietoParent.nombre || '#' + otroNietoParent.numero_pinches}</p>}
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </>
            )}

          </div>
        </div>
      </Modal>
    );
  };

  return (
    <div className="fade-in">
      {/* Header */}
      <div className="flex items-center justify-between mb-4">
        <div>
          <h2 className="text-xl font-bold text-gray-800">Genética</h2>
          <p className="text-sm text-gray-500">{gallos.length} gallos registrados</p>
        </div>
        {canEdit && <button onClick={() => { setForm(emptyForm); setEditingGallo(null); setPadreSelected(null); setMadreSelected(null); setShowForm(true); }}
          className="bg-red-600 text-white px-4 py-2.5 rounded-lg font-medium text-sm hover:bg-red-700 active:bg-red-800">
          + Nuevo Gallo
        </button>}
      </div>

      {/* Búsqueda */}
      <Input type="text" placeholder="Buscar por nombre, pinches o línea..." value={searchQ}
        onChange={e => setSearchQ(e.target.value)} className="mb-4" />

      {/* Lista */}
      <div className="space-y-2">
        {filteredGallos.length === 0 ? (
          <p className="text-center text-gray-400 py-12">No hay gallos registrados</p>
        ) : filteredGallos.map(g => (
          <div key={g.id} className="bg-white rounded-lg border border-gray-200 p-3 active:bg-gray-50">
            <div className="flex items-start justify-between">
              {g.foto && <img src={g.foto} className="w-12 h-12 rounded-lg object-cover mr-3 flex-shrink-0 cursor-pointer" onClick={(e) => { e.stopPropagation(); setViewingPhoto(g.foto); }} />}
              <div className="flex-1 min-w-0" onClick={() => handleEdit(g)}>
                <div className="flex items-center gap-2">
                  <span className="font-bold text-gray-800 truncate">{g.nombre || 'Sin nombre'}</span>
                  {g.numero_pinches && <span className="text-xs bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">#{g.numero_pinches}</span>}
                  {g.amarrado && <span className="text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-medium">Amarrado{g.jaula ? ` • Jaula ${g.jaula}` : ''}</span>}
                  <span className="text-xs text-gray-400">{g.sexo === 'Gallina' ? '♀' : '♂'}</span>
                </div>
                <p className="text-xs text-gray-500 mt-0.5">
                  {[g.linea_genetica, g.color].filter(Boolean).join(' • ') || 'Sin datos adicionales'}
                </p>
                {g.caracteristicas && g.caracteristicas.length > 0 && (
                  <div className="flex flex-wrap gap-1 mt-1.5">
                    {g.caracteristicas.slice(0, 4).map(c => <span key={c} className="text-[10px] bg-orange-50 text-orange-700 px-1.5 py-0.5 rounded">{c}</span>)}
                    {g.caracteristicas.length > 4 && <span className="text-[10px] text-gray-400">+{g.caracteristicas.length - 4}</span>}
                  </div>
                )}
              </div>
              <div className="flex items-center gap-1 ml-2">
                <button onClick={() => setShowArbol(g)} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-lg" title="Árbol">🌳</button>
                {canEdit && <button onClick={() => handleDelete(g)} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-lg" title="Eliminar">🗑</button>}
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Modal Árbol */}
      {showArbol && <PedigriModal gallos={gallos} initialFocusId={showArbol.id} onClose={() => setShowArbol(null)} />}
      <PhotoViewer src={viewingPhoto} onClose={() => setViewingPhoto(null)} />

      {/* Modal Formulario */}
      {showForm && (
        <Modal title={editingGallo ? 'Editar Gallo' : 'Nuevo Gallo'} onClose={() => setShowForm(false)}>
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <Field label="# Pinches">
                <Input type="number" placeholder="ej: 22" value={form.numero_pinches}
                  onChange={e => setForm({...form, numero_pinches: e.target.value})} />
              </Field>
              <Field label="Nombre">
                <Input type="text" placeholder="ej: Negro Pava" value={form.nombre}
                  onChange={e => setForm({...form, nombre: e.target.value})} />
              </Field>
            </div>

            <div className="grid grid-cols-3 gap-3">
              <Field label="Sexo">
                <Select value={form.sexo} onChange={e => setForm({...form, sexo: e.target.value})}
                  options={['Gallo', 'Gallina', 'Pollo']} />
              </Field>
              <Field label="Amarrado">
                <Select value={form.amarrado ? 'Sí' : 'No'}
                  onChange={e => setForm({...form, amarrado: e.target.value === 'Sí', jaula: e.target.value === 'No' ? '' : form.jaula})}
                  options={[{value: 'No', label: 'No'}, {value: 'Sí', label: 'Sí'}]} />
              </Field>
              {form.amarrado && (
                <Field label="Jaula #">
                  <Input type="number" placeholder="Ej: 5" value={form.jaula}
                    onChange={e => setForm({...form, jaula: e.target.value})} />
                </Field>
              )}
              <Field label="Nacimiento">
                <Input type="date" value={form.fecha_nacimiento}
                  onChange={e => setForm({...form, fecha_nacimiento: e.target.value})} />
              </Field>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label="Color">
                <Input type="text" placeholder="ej: Rubio Negro" value={form.color}
                  onChange={e => setForm({...form, color: e.target.value})} />
              </Field>
              <Field label="Línea Genética">
                <Input type="text" placeholder="ej: Los Moscas" value={form.linea_genetica}
                  onChange={e => setForm({...form, linea_genetica: e.target.value})} />
              </Field>
            </div>

            {/* Genealogía */}
            <div className="border-t pt-3">
              <p className="text-sm font-medium text-gray-700 mb-2">Genealogía</p>
              <div className="grid grid-cols-1 gap-3">
                <Field label="Padre">
                  <GalloSearch gallos={gallos} selected={padreSelected}
                    onSelect={g => { setPadreSelected(g); setForm(f => ({...f, padre_id: g.id})); }}
                    onClear={() => { setPadreSelected(null); setForm(f => ({...f, padre_id: null})); }}
                    placeholder="Buscar padre..." />
                </Field>
                <Field label="Madre">
                  <GalloSearch gallos={gallos} selected={madreSelected}
                    onSelect={g => { setMadreSelected(g); setForm(f => ({...f, madre_id: g.id})); }}
                    onClear={() => { setMadreSelected(null); setForm(f => ({...f, madre_id: null})); }}
                    placeholder="Buscar madre..." />
                </Field>
              </div>
            </div>

            {/* Características por categoría */}
            <div className="border-t pt-3">
              <div className="flex justify-between items-center mb-2">
                <p className="text-sm font-medium text-gray-700">Características</p>
                {form.caracteristicas.length > 0 && (
                  <span className="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-semibold">
                    {form.caracteristicas.length} seleccionada{form.caracteristicas.length > 1 ? 's' : ''}
                  </span>
                )}
              </div>
              <CaracteristicasCat seleccionadas={form.caracteristicas} onToggle={toggleCar} />
              {form.caracteristicas.length > 0 && (
                <button onClick={() => setForm(f => ({ ...f, caracteristicas: [] }))}
                  className="mt-2 text-xs text-gray-400 hover:text-red-500 underline">
                  Limpiar selección
                </button>
              )}
            </div>

            {/* Foto del gallo */}
            <div className="border-t pt-3">
              <PhotoUpload value={form.foto} onChange={(v) => setForm({...form, foto: v})} label="Foto del Gallo" />
            </div>

            <Field label="Observaciones">
              <Textarea placeholder="Notas adicionales..." value={form.observaciones}
                onChange={e => setForm({...form, observaciones: e.target.value})} />
            </Field>

            {canEdit && <button onClick={handleSave}
              className="w-full bg-red-600 text-white py-3 rounded-lg font-bold text-base hover:bg-red-700 active:bg-red-800">
              {editingGallo ? 'Actualizar Gallo' : 'Crear Gallo'}
            </button>}
          </div>
        </Modal>
      )}
    </div>
  );
};

// ============================================
// COMPONENTE: Analisis de Video con IA
// ============================================
const VideoAnalysisModal = ({ gallo, onClose }) => {
  const { gallos } = useContext(AppContext);
  const [step, setStep] = useState('setup');
  const [modo, setModo] = useState('simple');
  const [momento, setMomento] = useState('inicio');
  const [notas, setNotas] = useState('');
  const [selectedGallo, setSelectedGallo] = useState(gallo || null);
  const [galloDesc, setGalloDesc] = useState(
    gallo ? ((gallo.nombre || ('#' + gallo.numero_pinches)) + (gallo.color ? ', color ' + gallo.color : '')) : ''
  );
  const [mediaRecorder, setMediaRecorder] = useState(null);
  const [videoBlob, setVideoBlob] = useState(null);
  const [videoUrl, setVideoUrl] = useState(null);
  const [recording, setRecording] = useState(false);
  const [seconds, setSeconds] = useState(0);
  const [analysis, setAnalysis] = useState(null);
  const [rawText, setRawText] = useState('');
  const [error, setError] = useState('');
  const [slots, setSlots] = useState({ inicio: null, medio: null, final: null, oponente: null });
  const [activeSlotKey, setActiveSlotKey] = useState(null);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const chunksRef = useRef([]);
  const timerRef = useRef(null);
  const fileInputRef = useRef(null);
  const MAX_SECONDS = 90;

  const SLOT_CONFIG = [
    { key: 'inicio',   label: '🟢 Inicio',   desc: 'Gallo fresco (0-10 min)' },
    { key: 'medio',    label: '🟡 Medio',    desc: 'Mitad del entreno' },
    { key: 'final',    label: '🔴 Final',    desc: 'Fatigado (20+ min)' },
    { key: 'oponente', label: '🐓 Oponente', desc: 'Sparring / rival (opcional)' },
  ];

  const stopCamera = () => {
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
  };

  useEffect(() => {
    return () => { stopCamera(); if (timerRef.current) clearInterval(timerRef.current); };
  }, []);

  const compressVideo = (blob) => new Promise((resolve, reject) => {
    const vid = document.createElement('video');
    vid.muted = true;
    vid.playsInline = true;
    vid.playbackRate = 2;
    const url = URL.createObjectURL(blob);
    vid.src = url;
    vid.onloadedmetadata = () => {
      const scale = Math.min(1, 640 / Math.max(vid.videoWidth, 1));
      const w = Math.round(vid.videoWidth * scale);
      const h = Math.round(vid.videoHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const stream = canvas.captureStream(15);
      const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 600000 });
      const chunks = [];
      rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      rec.onstop = () => { URL.revokeObjectURL(url); resolve(new Blob(chunks, { type: 'video/webm' })); };
      rec.start(500);
      vid.play();
      const draw = () => { if (!vid.ended && !vid.paused) { ctx.drawImage(vid, 0, 0, w, h); requestAnimationFrame(draw); } };
      vid.onplay = () => requestAnimationFrame(draw);
      vid.onended = () => rec.stop();
      vid.onerror = e => { URL.revokeObjectURL(url); reject(e); };
    };
    vid.onerror = e => { URL.revokeObjectURL(url); reject(e); };
  });

  const blobToBase64 = async (blob) => {
    const arrayBuffer = await blob.arrayBuffer();
    const bytes = new Uint8Array(arrayBuffer);
    let binary = '';
    for (let i = 0; i < bytes.length; i += 8192) binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
    return btoa(binary);
  };

  const saveToSlot = () => {
    if (!videoBlob || !activeSlotKey) return;
    const url = videoUrl || URL.createObjectURL(videoBlob);
    setSlots(prev => {
      if (prev[activeSlotKey] && prev[activeSlotKey].url && prev[activeSlotKey].url !== url) URL.revokeObjectURL(prev[activeSlotKey].url);
      return { ...prev, [activeSlotKey]: { blob: videoBlob, url } };
    });
    setVideoBlob(null); setVideoUrl(null);
    setStep('collecting');
  };

  const clearSlot = (key) => {
    setSlots(prev => {
      if (prev[key] && prev[key].url) URL.revokeObjectURL(prev[key].url);
      return { ...prev, [key]: null };
    });
  };

  const handleFileUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = '';
    setError('');
    let blob = file;
    if (file.size > 5 * 1024 * 1024) {
      setStep('compressing');
      try { blob = await compressVideo(file); } catch (_) { blob = file; }
    }
    if (blob.size > 18 * 1024 * 1024) {
      setError('Video demasiado grande (' + (blob.size/1024/1024).toFixed(1) + 'MB). Usa un clip más corto.');
      setStep(modo === 'completo' ? 'collecting' : 'setup'); return;
    }
    setVideoBlob(blob);
    setVideoUrl(URL.createObjectURL(blob));
    setSeconds(0);
    setStep('preview');
  };

  const openFileForSlot = (key) => {
    setActiveSlotKey(key);
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const startCamera = (key) => {
    setError('');
    if (key !== undefined) setActiveSlotKey(key);
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(stream => {
      streamRef.current = stream;
      if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); }
      setStep('recording');
    }).catch(e => {
      setError('No se pudo acceder a la cámara: ' + e.message);
    });
  };

  const startRecording = () => {
    if (!streamRef.current) return;
    chunksRef.current = [];
    const mr = new MediaRecorder(streamRef.current, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 800000 });
    mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(chunksRef.current, { type: 'video/webm' });
      setVideoBlob(blob);
      setVideoUrl(URL.createObjectURL(blob));
      stopCamera();
      setStep('preview');
    };
    mr.start(1000);
    setMediaRecorder(mr);
    setRecording(true);
    setSeconds(0);
    timerRef.current = setInterval(() => {
      setSeconds(s => {
        if (s + 1 >= MAX_SECONDS) { if (mr.state !== 'inactive') mr.stop(); clearInterval(timerRef.current); setRecording(false); return s + 1; }
        return s + 1;
      });
    }, 1000);
  };

  const stopRecording = () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (timerRef.current) clearInterval(timerRef.current);
    setRecording(false);
  };

  const retake = () => {
    setVideoBlob(null); setVideoUrl(null); setSeconds(0); setError('');
    setStep(modo === 'completo' ? 'collecting' : 'setup');
  };

  const analyzeVideo = async () => {
    setStep('analyzing');
    setError('');
    try {
      const sessionData = await supabase.auth.getSession();
      const token = sessionData.data.session && sessionData.data.session.access_token;
      let bodyPayload;

      if (modo === 'completo') {
        const nonOpSlots = SLOT_CONFIG.filter(s => s.key !== 'oponente' && slots[s.key]);
        const videos = [];
        for (let i = 0; i < nonOpSlots.length; i++) {
          const s = nonOpSlots[i];
          let blob = slots[s.key].blob;
          if (blob.size > 5 * 1024 * 1024) { try { blob = await compressVideo(blob); } catch (_) {} }
          videos.push({ base64: await blobToBase64(blob), mimeType: blob.type || 'video/webm', momento: s.key });
        }
        bodyPayload = { videos, galloDescripcion: galloDesc, notas };
        if (slots.oponente) {
          let opBlob = slots.oponente.blob;
          if (opBlob.size > 5 * 1024 * 1024) { try { opBlob = await compressVideo(opBlob); } catch (_) {} }
          bodyPayload.videoOponente = { base64: await blobToBase64(opBlob), mimeType: opBlob.type || 'video/webm' };
        }
      } else {
        let blobToSend = videoBlob;
        if (videoBlob.size > 5 * 1024 * 1024) {
          try { blobToSend = await compressVideo(videoBlob); } catch (_) {}
        }
        if (blobToSend.size > 18 * 1024 * 1024) {
          setError('Video demasiado grande. Intenta con un clip más corto (menos de 30s).');
          setStep('preview'); return;
        }
        bodyPayload = {
          videoBase64: await blobToBase64(blobToSend),
          mimeType: videoBlob.type || 'video/webm',
          galloDescripcion: galloDesc,
          momentoEntrenamiento: momento,
          notas
        };
      }

      const res = await fetch(SUPABASE_URL + '/functions/v1/analyze-video', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(bodyPayload)
      });
      const result = await res.json();
      if (!res.ok || result.error) {
        setError(result.error || 'Error al analizar');
        setStep(modo === 'completo' ? 'collecting' : 'preview');
        return;
      }
      setAnalysis(result.analysis);
      setRawText(result.raw || '');
      setStep('result');
    } catch (e) {
      setError('Error: ' + e.message);
      setStep(modo === 'completo' ? 'collecting' : 'preview');
    }
  };

  const MOMENTOS = [
    { value: 'inicio', label: '🟢 Inicio', desc: 'Gallo fresco' },
    { value: 'medio',  label: '🟡 Medio',  desc: '5-10 min' },
    { value: 'final',  label: '🔴 Final',  desc: '15+ min' },
  ];

  const filledSlots = SLOT_CONFIG.filter(s => s.key !== 'oponente' && slots[s.key]).length;
  const activeSlotLabel = (SLOT_CONFIG.find(s => s.key === activeSlotKey) || {}).label || '';

  return (
    <div className="fixed inset-0 bg-black bg-opacity-90 z-50 flex flex-col">
      <div className="bg-gray-900 text-white px-4 py-3 flex items-center justify-between flex-shrink-0">
        <div>
          <h3 className="font-bold">🎥 Análisis IA</h3>
          {selectedGallo && <p className="text-xs text-gray-400">{selectedGallo.nombre || ('#' + selectedGallo.numero_pinches)}</p>}
        </div>
        <button onClick={() => { stopCamera(); onClose(null); }} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-700 text-white">✕</button>
      </div>

      <div className="flex-1 overflow-y-auto">

        {step === 'setup' && (
          <div className="p-4 space-y-4">
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => setModo('simple')}
                className={`py-2.5 rounded-xl font-semibold text-sm transition ${modo === 'simple' ? 'bg-purple-600 text-white shadow' : 'bg-gray-100 text-gray-600'}`}>
                📹 Un Video
              </button>
              <button onClick={() => setModo('completo')}
                className={`py-2.5 rounded-xl font-semibold text-sm transition ${modo === 'completo' ? 'bg-purple-600 text-white shadow' : 'bg-gray-100 text-gray-600'}`}>
                🎬 3 Momentos
              </button>
            </div>
            <div className={`text-xs rounded-lg p-2.5 border ${modo === 'completo' ? 'bg-purple-50 text-purple-700 border-purple-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`}>
              {modo === 'completo'
                ? '🎬 Graba 3 clips de ~30s: inicio, medio y final. La IA analiza la progresión real y fatiga. Opcional: agrega video del oponente.'
                : '📹 Sube o graba un solo clip para análisis rápido.'}
            </div>

            <div>
              <label className="text-sm font-medium text-gray-700 block mb-2">Gallo a analizar</label>
              <select value={selectedGallo ? selectedGallo.id : ''} onChange={e => {
                const g = gallos.find(g => g.id === e.target.value) || null;
                setSelectedGallo(g);
                if (g) setGalloDesc((g.nombre || ('#' + g.numero_pinches)) + (g.color ? ', color ' + g.color : ''));
              }} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-3">
                <option value="">-- Seleccionar gallo --</option>
                {gallos.filter(g => g.amarrado).map(g =>
                  <option key={g.id} value={g.id}>{g.nombre || ('#' + g.numero_pinches)}{g.color ? ' · ' + g.color : ''}</option>
                )}
              </select>
            </div>

            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">¿Cómo identificarlo en el video? *</label>
              <input type="text" value={galloDesc} onChange={e => setGalloDesc(e.target.value)}
                placeholder="ej: gallo colorado, el más grande, espuelas largas"
                className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
              <p className="text-xs text-gray-400 mt-1">Color u otro detalle que lo diferencie de la chata/muñeco</p>
            </div>

            {modo === 'simple' && (
              <div>
                <label className="text-sm font-medium text-gray-700 block mb-2">Momento del entrenamiento</label>
                <div className="grid grid-cols-3 gap-2">
                  {MOMENTOS.map(m => (
                    <button type="button" key={m.value} onClick={() => setMomento(m.value)}
                      className={`p-2 rounded-lg border text-center transition ${momento === m.value ? 'border-purple-500 bg-purple-50' : 'border-gray-200 bg-white'}`}>
                      <div className="text-sm font-medium">{m.label}</div>
                      <div className="text-xs text-gray-500">{m.desc}</div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div>
              <label className="text-sm font-medium text-gray-700 block mb-1">Notas (opcional)</label>
              <textarea value={notas} onChange={e => setNotas(e.target.value)} rows={2}
                placeholder="ej: lesión en pata derecha, primer día de chata..."
                className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm resize-none" />
            </div>

            {error && <p className="text-red-600 text-sm bg-red-50 p-2 rounded">{error}</p>}

            <input ref={fileInputRef} type="file" accept="video/*" style={{display:'none'}} onChange={handleFileUpload} />
            {modo === 'simple' ? (
              <div className="grid grid-cols-2 gap-3">
                <button onClick={() => { setActiveSlotKey(null); if (fileInputRef.current) fileInputRef.current.click(); }} disabled={!galloDesc.trim()}
                  className="py-3 rounded-xl border-2 border-purple-300 text-purple-700 font-bold hover:bg-purple-50 disabled:opacity-40">
                  📂 Subir video
                </button>
                <button onClick={() => startCamera(undefined)} disabled={!galloDesc.trim()}
                  className="py-3 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-700 disabled:opacity-40">
                  📹 Grabar ahora
                </button>
              </div>
            ) : (
              <button onClick={() => { setSlots({ inicio: null, medio: null, final: null, oponente: null }); setStep('collecting'); }}
                disabled={!galloDesc.trim()}
                className="w-full py-3 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-700 disabled:opacity-40">
                🎬 Continuar → Grabar segmentos
              </button>
            )}
          </div>
        )}

        {step === 'collecting' && (
          <div className="p-4 space-y-3">
            <div className="bg-purple-50 border border-purple-200 rounded-lg p-3">
              <p className="text-xs font-bold text-purple-700 mb-0.5">🎬 Análisis 3 Momentos</p>
              <p className="text-xs text-purple-600">Graba o sube un clip de ~30s por momento. El oponente es opcional.</p>
            </div>
            {error && <p className="text-red-600 text-sm bg-red-50 p-2 rounded">{error}</p>}
            <input ref={fileInputRef} type="file" accept="video/*" style={{display:'none'}} onChange={handleFileUpload} />
            <div className="space-y-2">
              {SLOT_CONFIG.map(s => (
                <div key={s.key} className={`rounded-xl border-2 p-3 ${slots[s.key] ? 'border-green-400 bg-green-50' : s.key === 'oponente' ? 'border-dashed border-gray-300 bg-gray-50' : 'border-dashed border-purple-300 bg-white'}`}>
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="font-semibold text-sm text-gray-800">{s.label}</p>
                      <p className="text-xs text-gray-500">{s.desc}</p>
                    </div>
                    {slots[s.key] ? (
                      <div className="flex items-center gap-2">
                        <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded font-medium">✓ Listo</span>
                        <button onClick={() => clearSlot(s.key)} className="text-gray-400 hover:text-red-500 text-xs px-1">✕</button>
                      </div>
                    ) : (
                      <div className="flex gap-1.5">
                        <button onClick={() => openFileForSlot(s.key)}
                          className="text-xs px-2.5 py-1.5 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50">
                          📂
                        </button>
                        <button onClick={() => startCamera(s.key)}
                          className="text-xs px-2.5 py-1.5 rounded-lg bg-purple-600 text-white hover:bg-purple-700">
                          📹
                        </button>
                      </div>
                    )}
                  </div>
                  {slots[s.key] && slots[s.key].url && (
                    <video src={slots[s.key].url} controls playsInline className="w-full mt-2 rounded-lg bg-black" style={{maxHeight:'120px'}} />
                  )}

                        <div className="h-full rounded-full bg-orange-400" style={{width: (analysis.opponent_analysis.velocidad_score * 10) + '%'}} />
                      </div>

                  )}
                  {analysis.opponent_analysis.agresividad_score !== null && analysis.opponent_analysis.agresividad_score !== undefined && (
                    <div>
                      <div className="flex justify-between text-xs mb-0.5">

            {analysis.observed_events && (

                <div className="grid grid-cols-2 gap-2">
                  {[
                    ['🦘 Saltos',        analysis.observed_events.jumps],
                    ['↩️ Cambios dir.',  analysis.observed_events.direction_changes],
                    ['⬇️ Caídas',        analysis.observed_events.falls],
                    ['⏸ Pausas largas', analysis.observed_events.long_pauses],
                    ['⚡ Movs. rápidos', analysis.observed_events.rapid_movements],
                    ['🤝 Interacciones', analysis.observed_events.interaction_moments],
                    ['😴 Descansos',     analysis.observed_events.rest_periods],
                    ['⏱ Act. continua', analysis.observed_events.continuous_activity_seconds !== null && analysis.observed_events.continuous_activity_seconds !== undefined ? analysis.observed_events.continuous_activity_seconds + 's' : null],
                  ].map(([label, val]) => (
                    <div key={label} className="flex items-center justify-between bg-gray-50 rounded-lg px-2.5 py-1.5">
                      <span className="text-xs text-gray-500">{label}</span>

            <div className="space-y-2 pb-2">
