};



// ============================================
// MÓDULO: ENTRENAMIENTOS
// ============================================
const EntrenamientosModule = () => {
  const { gallos, opciones, addOpcion, toast, activeOwnerId, canEdit } = useContext(AppContext);
  const [entrenamientos, setEntrenamientos] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [galloFilter, setGalloFilter] = useState(null);
  const [showDetalle, setShowDetalle] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showVideoAnalysis, setShowVideoAnalysis] = useState(false);

  const nutricionOpts = opciones['nutricion'] || [];
  const [nuevaNut, setNuevaNut] = useState('');

  const emptyForm = {
    gallo_id: null, fecha: new Date().toISOString().split('T')[0],
    peso_libras: '', peso_onzas: '0', corrida: '', chata: '',
    clima: 'Soleado', temperatura: '', tomo_sol: 'No', intensidad: 'Medio',
    animo_gallo: 'Normal', condicion_plumeras_general: 'Buena',
    condicion_plumeras_alas: 'Buena', condicion_plumeras_rabos: 'Buena',
    problemas_alas: 'No', condicion_pico: 'Normal', condicion_espuelas: 'Sanas',
    nutricion_items: [], desparasitante: '', medicinas_especiales: '', alimentacion_especial: '',
    desempeno_general: 'Bueno', velocidad: 'Normal', resistencia: 'Buena', razon_malo: '', observaciones: '',
    fotos: [],
    ai_training_metrics: null, ai_rooster_traits: null, ai_summary: null, ai_raw: null, ai_indice_general: null
  };
  const [form, setForm] = useState(emptyForm);
  const [weekOffset, setWeekOffset] = useState(0);
  const [galloSelected, setGalloSelected] = useState(null);

  // Calcular rango de semana basado en offset
  const getWeekRange = (offset) => {
    const now = new Date();
    const dayOfWeek = now.getDay();
    const monday = new Date(now);
    monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1) + (offset * 7));
    monday.setHours(0,0,0,0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23,59,59,999);
    return { start: monday, end: sunday };
  };

  const weekRange = useMemo(() => getWeekRange(weekOffset), [weekOffset]);
  const weekLabel = useMemo(() => {
    const s = weekRange.start;
    const e = weekRange.end;
    const fmt = (d) => `${d.getDate()}/${d.getMonth()+1}`;
    if (weekOffset === 0) return `Esta semana (${fmt(s)} - ${fmt(e)})`;
    if (weekOffset === -1) return `Semana pasada (${fmt(s)} - ${fmt(e)})`;
    return `${fmt(s)} - ${fmt(e)}`;
  }, [weekRange, weekOffset]);

  const loadEntrenamientos = async () => {
    setLoading(true);
    const startStr = weekRange.start.toISOString().split('T')[0];
    const endStr = weekRange.end.toISOString().split('T')[0];
    let query = supabase.from('entrenamientos').select('*, gallos(nombre, numero_pinches, foto)')
      .gte('fecha', startStr).lte('fecha', endStr)
      .order('fecha', { ascending: false });
    if (galloFilter) query = query.eq('gallo_id', galloFilter.id);
    const { data, error } = await query;
    if (!error) setEntrenamientos(data || []);
    setLoading(false);
  };

  useEffect(() => { loadEntrenamientos(); }, [galloFilter, weekOffset]);

  const handleSave = async () => {
    if (!form.gallo_id) { toast('Selecciona un gallo', 'error'); return; }
    if (!form.peso_libras) { toast('El peso es requerido', 'error'); return; }

    const data = {
      ...form,
      peso_libras: parseInt(form.peso_libras),
      peso_onzas: parseInt(form.peso_onzas) || 0,
      corrida: form.corrida ? parseFloat(form.corrida) : null,
      chata: form.chata ? parseFloat(form.chata) : null,
      temperatura: form.temperatura ? parseFloat(form.temperatura) : null,
    };

    const dataConUser = { ...data, user_id: activeOwnerId };
    let error;
    if (editingId) {
      const { created_at, updated_at, gallos: _g, user_id: _u, ...cleanData } = dataConUser;
      ({ error } = await supabase.from('entrenamientos').update(cleanData).eq('id', editingId));
    } else {
      ({ error } = await supabase.from('entrenamientos').insert(dataConUser));
    }

    if (error) { toast(error.message, 'error'); return; }
    toast(editingId ? 'Entrenamiento actualizado' : 'Entrenamiento registrado', 'success');
    setShowForm(false);
    setEditingId(null);
    setForm(emptyForm);
    setGalloSelected(null);
    loadEntrenamientos();
  };

  const handleDelete = async (id) => {
    if (!confirm('¿Eliminar este entrenamiento?')) return;
    await supabase.from('entrenamientos').delete().eq('id', id);
    toast('Eliminado', 'success');
    loadEntrenamientos();
  };

  const handleEdit = (ent) => {
    const gallo = gallos.find(g => g.id === ent.gallo_id);
    setGalloSelected(gallo || null);
    setForm({ ...ent });
    setEditingId(ent.id);
    setShowForm(true);
  };

  const toggleNut = (n) => {
    setForm(f => ({
      ...f,
      nutricion_items: f.nutricion_items.includes(n)
        ? f.nutricion_items.filter(x => x !== n)
        : [...f.nutricion_items, n]
    }));
  };

  const desempenoColor = (d) => {
    if (d === 'Excelente') return 'bg-green-100 text-green-800';
    if (d === 'Bueno') return 'bg-blue-100 text-blue-800';
    if (d === 'Regular') return 'bg-yellow-100 text-yellow-800';
    return 'bg-red-100 text-red-800';
  };

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-4">
        <div>
          <h2 className="text-xl font-bold text-gray-800">Entrenamientos</h2>
          <p className="text-sm text-gray-500">{entrenamientos.length} registros</p>
        </div>
        <div className="flex gap-2">
          <button onClick={() => setShowVideoAnalysis(true)}
            className="bg-purple-600 text-white px-3 py-2.5 rounded-lg font-medium text-sm hover:bg-purple-700">
            🎥 IA
          </button>
          {canEdit && <button onClick={() => { setForm(emptyForm); setEditingId(null); setGalloSelected(null); setShowForm(true); }}
            className="bg-green-600 text-white px-4 py-2.5 rounded-lg font-medium text-sm hover:bg-green-700">
            + Nuevo
          </button>}
        </div>
      </div>

      {/* Filtro por gallo */}
      <div className="mb-4">
        <GalloSearch gallos={gallos} selected={galloFilter}
          onSelect={g => setGalloFilter(g)} onClear={() => setGalloFilter(null)}
          placeholder="Filtrar por gallo..." filter={g => g.amarrado} />
      </div>

      {/* Navegación por semanas */}
      <div className="flex items-center justify-between bg-white rounded-lg border border-gray-200 p-2 mb-4">
        <button onClick={() => setWeekOffset(w => w - 1)} className="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm font-medium">← Anterior</button>
        <div className="text-center">
          <p className="text-sm font-bold text-gray-800">{weekLabel}</p>
          <p className="text-[10px] text-gray-400">{entrenamientos.length} entrenamientos</p>
        </div>
        <button onClick={() => setWeekOffset(w => w < 0 ? w + 1 : 0)} disabled={weekOffset >= 0}
          className={`px-3 py-1.5 rounded-lg text-sm font-medium ${weekOffset >= 0 ? 'bg-gray-50 text-gray-300' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}`}>Siguiente →</button>
      </div>

      {/* Lista */}
      {loading ? <p className="text-center text-gray-400 py-8">Cargando...</p> : (
        <div className="space-y-2">
          {entrenamientos.length === 0 ? (
            <p className="text-center text-gray-400 py-12">No hay entrenamientos</p>
          ) : entrenamientos.map(e => (
            <div key={e.id} className="bg-white rounded-lg border border-gray-200 p-3" onClick={() => setShowDetalle(e)}>
              <div className="flex items-center justify-between">
                <div className="flex-1">
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <span className="font-medium text-sm text-gray-800">{e.gallos?.nombre || '#' + e.gallos?.numero_pinches}</span>
                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${desempenoColor(e.desempeno_general)}`}>{e.desempeno_general}</span>
                    {e.ai_indice_general != null && <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-purple-100 text-purple-700">🤖 {e.ai_indice_general}</span>}
                  </div>
                  <p className="text-xs text-gray-500 mt-0.5">
                    {e.fecha} • {e.peso_libras}lb {e.peso_onzas}oz
                    {e.corrida ? ` • ${e.corrida}min corrida` : ''}{e.chata ? ` • ${e.chata}min chata` : ''}
                  </p>
                </div>
                <div className="flex gap-1">
                  {canEdit && <button onClick={(ev) => { ev.stopPropagation(); handleEdit(e); }} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-gray-100 text-sm">✏️</button>}
                  {canEdit && <button onClick={(ev) => { ev.stopPropagation(); handleDelete(e.id); }} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-red-50 text-sm">🗑</button>}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Modal Detalle */}
      {showDetalle && (
        <Modal title="Detalle Entrenamiento" onClose={() => setShowDetalle(null)}>
          {(() => { const e = showDetalle; return (
            <div className="space-y-3 text-sm">
              <div className="grid grid-cols-2 gap-2">
                <div><span className="text-gray-500">Gallo:</span> <span className="font-medium">{e.gallos?.nombre || '#'+ e.gallos?.numero_pinches}</span></div>
                <div><span className="text-gray-500">Fecha:</span> <span className="font-medium">{e.fecha}</span></div>
                <div><span className="text-gray-500">Peso:</span> <span className="font-medium">{e.peso_libras}lb {e.peso_onzas}oz</span></div>
                <div><span className="text-gray-500">Corrida:</span> <span className="font-medium">{e.corrida || 0} min</span> <span className="text-gray-500 ml-2">Chata:</span> <span className="font-medium">{e.chata || 0} min</span></div>
                <div><span className="text-gray-500">Clima:</span> <span className="font-medium">{e.clima}</span></div>
                <div><span className="text-gray-500">Temp:</span> <span className="font-medium">{e.temperatura || 'N/A'}°F</span></div>
                <div><span className="text-gray-500">Sol:</span> <span className="font-medium">{e.tomo_sol}</span></div>
                <div><span className="text-gray-500">Intensidad:</span> <span className="font-medium">{e.intensidad}</span></div>
                <div><span className="text-gray-500">Ánimo:</span> <span className="font-medium">{e.animo_gallo}</span></div>
                <div><span className="text-gray-500">Desempeño:</span> <span className={`font-medium px-1.5 py-0.5 rounded ${desempenoColor(e.desempeno_general)}`}>{e.desempeno_general}</span></div>
                <div><span className="text-gray-500">Velocidad:</span> <span className="font-medium">{e.velocidad}</span></div>
                <div><span className="text-gray-500">Resistencia:</span> <span className="font-medium">{e.resistencia}</span></div>
              </div>
              <div className="border-t pt-2">
                <p className="text-gray-500 mb-1">Plumas: General: {e.condicion_plumeras_general} | Alas: {e.condicion_plumeras_alas} | Rabos: {e.condicion_plumeras_rabos}</p>
                <p className="text-gray-500">Pico: {e.condicion_pico} | Espuelas: {e.condicion_espuelas} | Alas prob: {e.problemas_alas}</p>
              </div>
              {e.nutricion_items && e.nutricion_items.length > 0 && (
                <div className="border-t pt-2">
                  <p className="text-gray-500">Nutrición:</p>
                  <div className="flex flex-wrap gap-1 mt-1">{e.nutricion_items.map(n => <span key={n} className="text-xs bg-green-50 text-green-700 px-2 py-0.5 rounded">{n}</span>)}</div>
                </div>
              )}
              {(e.desparasitante || e.medicinas_especiales || e.alimentacion_especial) && (
                <div className="border-t pt-2 space-y-1">
                  {e.desparasitante && <p className="text-gray-500">Desparasitante: <span className="text-gray-800">{e.desparasitante}</span></p>}
                  {e.medicinas_especiales && <p className="text-gray-500">Medicinas: <span className="text-gray-800">{e.medicinas_especiales}</span></p>}
                  {e.alimentacion_especial && <p className="text-gray-500">Alimentación: <span className="text-gray-800">{e.alimentacion_especial}</span></p>}
                </div>
              )}
              {e.razon_malo && <div className="border-t pt-2"><p className="text-gray-500">Razón malo: <span className="text-red-700">{e.razon_malo}</span></p></div>}
              {e.observaciones && <div className="border-t pt-2"><p className="text-gray-500">Observaciones: <span className="text-gray-800">{e.observaciones}</span></p></div>}
              {e.ai_summary && (
                <div className="border-t pt-2">
                  <div className="flex items-center gap-2 mb-2">
                    <p className="text-sm font-bold text-purple-700">🤖 Análisis IA</p>
                    {e.ai_indice_general != null && <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-bold">Índice: {e.ai_indice_general}/100</span>}
                  </div>
                  {e.ai_summary.resumen_general && <p className="text-xs text-gray-700 leading-relaxed">{e.ai_summary.resumen_general}</p>}
                  {e.ai_training_metrics?.puntos_fuertes?.length > 0 && (
                    <p className="text-xs text-green-700 mt-1.5">✅ {e.ai_training_metrics.puntos_fuertes.join(' · ')}</p>
                  )}
                  {e.ai_training_metrics?.puntos_a_observar?.length > 0 && (
                    <p className="text-xs text-yellow-700 mt-0.5">👀 {e.ai_training_metrics.puntos_a_observar.join(' · ')}</p>
                  )}
                  {e.ai_summary.alerts?.length > 0 && (
                    <p className="text-xs text-orange-700 mt-0.5">⚠️ {e.ai_summary.alerts.join(' · ')}</p>
                  )}
                </div>
              )}
              {e.fotos && e.fotos.length > 0 && (
                <div className="border-t pt-2">
                  <p className="text-gray-500 mb-2">Fotos:</p>
                  <div className="flex gap-2 flex-wrap">{e.fotos.map((src, i) => <img key={i} src={src} className="w-24 h-24 object-cover rounded-lg border-2 border-gray-200" />)}</div>
                </div>
              )}
            </div>
          ); })()}
        </Modal>
      )}

      {/* Modal Formulario */}
      {showForm && (
        <Modal title={editingId ? 'Editar Entrenamiento' : 'Nuevo Entrenamiento'} onClose={() => setShowForm(false)}>
          <div className="space-y-4">
            <Field label="Gallo" required>
              <GalloSearch gallos={gallos} selected={galloSelected}
                onSelect={g => { setGalloSelected(g); setForm(f => ({...f, gallo_id: g.id})); }}
                onClear={() => { setGalloSelected(null); setForm(f => ({...f, gallo_id: null})); }}
                placeholder="Buscar gallo amarrado..." filter={g => g.amarrado} />
            </Field>

            <Field label="Fecha" required>
              <Input type="date" value={form.fecha} onChange={e => setForm({...form, fecha: e.target.value})} />
            </Field>

            <div className="grid grid-cols-2 gap-3">
              <Field label="Peso (lb)" required><Input type="number" value={form.peso_libras} onChange={e => setForm({...form, peso_libras: e.target.value})} /></Field>
              <Field label="Peso (oz)"><Input type="number" min="0" max="15" value={form.peso_onzas} onChange={e => setForm({...form, peso_onzas: e.target.value})} /></Field>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label="Corrida (min)"><Input type="number" value={form.corrida} onChange={e => setForm({...form, corrida: e.target.value})} /></Field>
              <Field label="Chata (min)"><Input type="number" value={form.chata} onChange={e => setForm({...form, chata: e.target.value})} /></Field>
            </div>

            <div className="grid grid-cols-3 gap-3">
              <Field label="Clima"><Select value={form.clima} onChange={e => setForm({...form, clima: e.target.value})} options={['Soleado','Nublado','Lluvia']} /></Field>
              <Field label="Temp °F"><Input type="number" value={form.temperatura} onChange={e => setForm({...form, temperatura: e.target.value})} /></Field>
              <Field label="Tomó Sol"><Select value={form.tomo_sol} onChange={e => setForm({...form, tomo_sol: e.target.value})} options={['No','Sí','Parcial']} /></Field>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label="Intensidad"><Select value={form.intensidad} onChange={e => setForm({...form, intensidad: e.target.value})} options={['Bajo','Medio','Alto']} /></Field>
              <Field label="Ánimo"><Select value={form.animo_gallo} onChange={e => setForm({...form, animo_gallo: e.target.value})} options={['Activo','Normal','Lento']} /></Field>
            </div>

            {/* Condición */}
            <div className="border-t pt-3">
              <p className="text-sm font-medium text-gray-700 mb-2">Condición Física</p>
              <div className="grid grid-cols-3 gap-2">
                <Field label="Plumas Gen."><Select value={form.condicion_plumeras_general} onChange={e => setForm({...form, condicion_plumeras_general: e.target.value})} options={['Buena','Regular','Mala']} /></Field>
                <Field label="Alas"><Select value={form.condicion_plumeras_alas} onChange={e => setForm({...form, condicion_plumeras_alas: e.target.value})} options={['Buena','Regular','Mala']} /></Field>
                <Field label="Rabos"><Select value={form.condicion_plumeras_rabos} onChange={e => setForm({...form, condicion_plumeras_rabos: e.target.value})} options={['Buena','Regular','Mala']} /></Field>
              </div>
              <div className="grid grid-cols-3 gap-2 mt-2">
                <Field label="Prob. Alas"><Select value={form.problemas_alas} onChange={e => setForm({...form, problemas_alas: e.target.value})} options={['No','Sí']} /></Field>
                <Field label="Pico"><Select value={form.condicion_pico} onChange={e => setForm({...form, condicion_pico: e.target.value})} options={['Normal','Roto','Erosionado']} /></Field>
                <Field label="Espuelas"><Select value={form.condicion_espuelas} onChange={e => setForm({...form, condicion_espuelas: e.target.value})} options={['Sanas','Lesionadas','En crecimiento']} /></Field>
              </div>
            </div>

            {/* Nutrición */}
            <div className="border-t pt-3">
              <p className="text-sm font-medium text-gray-700 mb-2">Nutrición</p>
              <div className="flex flex-wrap gap-1.5">
                {nutricionOpts.map(n => (
                  <button key={n} onClick={() => toggleNut(n)}
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-medium transition ${
                      form.nutricion_items.includes(n) ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-700'
                    }`}>{n}</button>
                ))}
              </div>
              <div className="flex gap-2 mt-2">
                <Input type="text" placeholder="Nueva nutrición..." value={nuevaNut} onChange={e => setNuevaNut(e.target.value)} className="flex-1 !py-1.5 text-sm" />
                <button onClick={async () => { if (nuevaNut.trim()) { await addOpcion('nutricion', nuevaNut.trim()); setNuevaNut(''); }}} className="bg-gray-200 px-3 py-1.5 rounded-lg text-sm font-medium">+</button>
              </div>
            </div>

            <Field label="Desparasitante"><Input type="text" placeholder="ej: Levamisol, 10ml" value={form.desparasitante} onChange={e => setForm({...form, desparasitante: e.target.value})} /></Field>
            <Field label="Medicinas"><Input type="text" value={form.medicinas_especiales} onChange={e => setForm({...form, medicinas_especiales: e.target.value})} /></Field>
            <Field label="Alimentación Especial"><Input type="text" value={form.alimentacion_especial} onChange={e => setForm({...form, alimentacion_especial: e.target.value})} /></Field>

            <div className="border-t pt-3">
              <p className="text-sm font-medium text-gray-700 mb-2">Desempeño</p>
              <div className="grid grid-cols-3 gap-3">
                <Field label="General"><Select value={form.desempeno_general} onChange={e => setForm({...form, desempeno_general: e.target.value})} options={['Excelente','Bueno','Regular','Malo']} /></Field>
                <Field label="Velocidad"><Select value={form.velocidad} onChange={e => setForm({...form, velocidad: e.target.value})} options={['Rápido','Normal','Lento']} /></Field>
                <Field label="Resistencia"><Select value={form.resistencia} onChange={e => setForm({...form, resistencia: e.target.value})} options={['Excelente','Buena','Regular','Débil']} /></Field>
              </div>
              {form.desempeno_general === 'Malo' && (
                <Field label="¿Por qué mal?"><Input type="text" value={form.razon_malo} onChange={e => setForm({...form, razon_malo: e.target.value})} /></Field>
              )}
            </div>

            <Field label="Observaciones"><Textarea value={form.observaciones} onChange={e => setForm({...form, observaciones: e.target.value})} /></Field>

            {/* Fotos del entrenamiento */}
            <div className="border-t pt-3">
              <MultiPhotoUpload values={form.fotos} onChange={(v) => setForm({...form, fotos: v})} label="Fotos del Entrenamiento" />
            </div>

            {canEdit && <button onClick={handleSave} className="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">
              {editingId ? 'Actualizar' : 'Guardar'} Entrenamiento
            </button>}
          </div>
        </Modal>
      )}

      {showVideoAnalysis && (
        <VideoAnalysisModal
          gallo={galloFilter}
          onClose={(result) => {
            setShowVideoAnalysis(false);
            if (result && result.analysis) {
              const g = result.gallo;
              const ai = result.analysis;
              setGalloSelected(g || null);
              setForm({
                ...emptyForm,
                gallo_id: g?.id || null,
                fecha: new Date().toISOString().split('T')[0],
                observaciones: ai.summary?.resumen_general ? '--- Análisis IA ---\n' + ai.summary.resumen_general : '',
                ai_training_metrics: ai.training_metrics || null,
                ai_rooster_traits: ai.rooster_traits || null,
                ai_summary: ai.summary ? { ...ai.summary, alerts: ai.alerts || [], observed_events: ai.observed_events || null, progression: ai.progression || null, opponent_analysis: ai.opponent_analysis || null } : null,
                ai_raw: result.raw || null,
                ai_indice_general: ai.summary?.indice_general ?? null,
              });
              setEditingId(null);
              setShowForm(true);
            }
          }}
        />
      )}
    </div>
  );
};

// ============================================
// MÓDULO: PELEAS
// ============================================
const PeleasModule = () => {
  const { gallos, opciones, addOpcion, toast, activeOwnerId, canEdit } = useContext(AppContext);
  const [peleas, setPeleas] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [showDetalle, setShowDetalle] = useState(null);
  const [loading, setLoading] = useState(true);
  const [temporadasDisp, setTemporadasDisp] = useState([1]);
  const [viewingTemp, setViewingTemp] = useState(null);

  const comoFueOpts = opciones['como_fue'] || [];
  const estiloOpts = opciones['estilos_oponente'] || [];

  const getTemporadaActual = () => {
    const stored = localStorage.getItem('temporada_actual_' + activeOwnerId);
    return stored ? parseInt(stored) : 1;
  };

  const emptyForm = {
    gallo_id: null, fecha: new Date().toISOString().split('T')[0], lugar: '',
    duenio_oponente: '', peso_oponente_libras: '', peso_oponente_onzas: '', estilo_oponente: '',
    armador: '', resultado: 'Ganó', duracion: '', duracion_segundos: '0', dinero_jugado: '',
    como_fue: '', estilo_observado: '', puntos_positivos: '', puntos_negativos: '', lesiones: ''
  };
  const [form, setForm] = useState(emptyForm);
  const [galloSelected, setGalloSelected] = useState(null);

  const loadPeleas = async () => {
    setLoading(true);
    const { data } = await supabase.from('peleas')
      .select('*, gallos(nombre, numero_pinches)')
      .eq('user_id', activeOwnerId)
      .order('fecha', { ascending: false })
      .limit(500);
    if (data) {
      setPeleas(data);
      const temps = [...new Set(data.map(p => p.temporada || 1))].sort((a, b) => a - b);
      if (temps.length === 0) temps.push(1);
      setTemporadasDisp(temps);
      const current = getTemporadaActual();
      setViewingTemp(current);
    }
    setLoading(false);
  };

  useEffect(() => { loadPeleas(); }, [activeOwnerId]);

  // Peleas de la temporada que se está viendo
  const peleasActuales = peleas.filter(p => (p.temporada || 1) === (viewingTemp || 1));
  const lugaresUnicos = [...new Set(peleas.filter(p => p.lugar).map(p => p.lugar))];

  const handleNuevaTemporada = () => {
    const current = getTemporadaActual();
    const maxEnDB = peleas.length > 0 ? Math.max(...peleas.map(p => p.temporada || 1)) : 1;
    const next = Math.max(current, maxEnDB) + 1;
    if (!confirm(`¿Iniciar Temporada ${next}?\n\nLas peleas de la Temporada ${current} quedarán guardadas y podrás consultarlas cuando quieras.`)) return;
    localStorage.setItem('temporada_actual_' + activeOwnerId, String(next));
    setViewingTemp(next);
    setTemporadasDisp(prev => prev.includes(next) ? prev : [...prev, next].sort((a, b) => a - b));
    toast(`¡Temporada ${next} iniciada! 🎉`);
  };

  const handleSave = async () => {
    if (!form.gallo_id) { toast('Selecciona un gallo', 'error'); return; }
    if (!form.resultado) { toast('El resultado es requerido', 'error'); return; }

    const data = {
      ...form,
      peso_oponente_libras: form.peso_oponente_libras ? parseInt(form.peso_oponente_libras) : null,
      peso_oponente_onzas: form.peso_oponente_onzas ? parseInt(form.peso_oponente_onzas) : null,
      duracion: form.duracion ? parseInt(form.duracion) : null,
      duracion_segundos: form.duracion_segundos ? parseInt(form.duracion_segundos) : 0,
      dinero_jugado: form.dinero_jugado ? parseFloat(form.dinero_jugado) : null,
      moneda: 'USD',
    };

    const dataConUser = { ...data, user_id: activeOwnerId, temporada: editingId ? (form.temporada || 1) : getTemporadaActual() };
    let error;
    if (editingId) {
      const { created_at, updated_at, gallos: _g, user_id: _u, ...cleanData } = dataConUser;
      ({ error } = await supabase.from('peleas').update(cleanData).eq('id', editingId));
    } else {
      ({ error } = await supabase.from('peleas').insert(dataConUser));
    }

    if (error) { toast(error.message, 'error'); return; }
    toast(editingId ? 'Pelea actualizada' : 'Pelea registrada', 'success');
    setShowForm(false); setEditingId(null); setForm(emptyForm); setGalloSelected(null);
    loadPeleas();
  };

  const handleDelete = async (id) => {
    if (!confirm('¿Eliminar esta pelea?')) return;
    await supabase.from('peleas').delete().eq('id', id);
    toast('Eliminada', 'success');
    loadPeleas();
  };

  const handleEdit = (p) => {
    const gallo = gallos.find(g => g.id === p.gallo_id);
    setGalloSelected(gallo || null);
    setForm({ ...p });
    setEditingId(p.id);
    setShowForm(true);
  };

  // Stats de la temporada actual
  const totalGanadas = peleasActuales.filter(p => p.resultado === 'Ganó').length;
  const totalPerdidas = peleasActuales.filter(p => p.resultado === 'Perdió').length;
  const totalDinero = peleasActuales.reduce((sum, p) => {
    if (p.resultado === 'Ganó') return sum + (parseFloat(p.dinero_jugado) || 0);
    return sum - (parseFloat(p.dinero_jugado) || 0);
  }, 0);

  const temporadaActual = getTemporadaActual();
  const isViewingCurrent = viewingTemp === temporadaActual;

  return (
    <div className="fade-in">
      {/* Header */}
      <div className="flex items-center justify-between mb-3">
        <div>
          <h2 className="text-xl font-bold text-gray-800">Peleas</h2>
          <p className="text-sm text-gray-500">{peleasActuales.length} en esta temporada</p>
        </div>
        <div className="flex gap-2">
          {canEdit && isViewingCurrent && (
            <button onClick={handleNuevaTemporada}
              className="bg-amber-500 text-white px-3 py-2 rounded-lg font-medium text-xs hover:bg-amber-600">
              🔄 Nueva Temporada
            </button>
          )}
          {canEdit && isViewingCurrent && (
            <button onClick={() => { setForm(emptyForm); setEditingId(null); setGalloSelected(null); setShowForm(true); }}
              className="bg-purple-600 text-white px-4 py-2.5 rounded-lg font-medium text-sm hover:bg-purple-700">
              + Nueva Pelea
            </button>
          )}
        </div>
      </div>

      {/* Selector de temporadas */}
      {(temporadasDisp.length > 1 || !isViewingCurrent) && (
        <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1">
          {temporadasDisp.map(t => (
            <button key={t} onClick={() => setViewingTemp(t)}
              className={`flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition ${
                viewingTemp === t
                  ? 'bg-purple-600 text-white'
                  : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
              }`}>
              T{t}{t === temporadaActual ? ' ⭐' : ''}
            </button>
          ))}
        </div>
      )}

      {/* Stats */}
      {peleasActuales.length > 0 && (
        <div className="grid grid-cols-3 gap-2 mb-4">
          <div className="bg-green-50 border border-green-200 rounded-lg p-3 text-center">
            <p className="text-2xl font-bold text-green-700">{totalGanadas}</p>
            <p className="text-xs text-green-600">Ganadas</p>
          </div>
          <div className="bg-red-50 border border-red-200 rounded-lg p-3 text-center">
            <p className="text-2xl font-bold text-red-700">{totalPerdidas}</p>
            <p className="text-xs text-red-600">Perdidas</p>
          </div>
          <div className={`${totalDinero >= 0 ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} border rounded-lg p-3 text-center`}>
            <p className={`text-2xl font-bold ${totalDinero >= 0 ? 'text-green-700' : 'text-red-700'}`}>${Math.abs(totalDinero).toFixed(0)}</p>
            <p className={`text-xs ${totalDinero >= 0 ? 'text-green-600' : 'text-red-600'}`}>{totalDinero >= 0 ? 'Ganancia' : 'Pérdida'}</p>
          </div>
        </div>
      )}

      {/* Lista */}
      {loading ? <p className="text-center text-gray-400 py-8">Cargando...</p> : (
        <div className="space-y-2">
          {peleasActuales.length === 0 ? (
            <div className="text-center py-12">
              <p className="text-gray-400 mb-2">No hay peleas en esta temporada</p>
              {isViewingCurrent && canEdit && (
                <button onClick={() => { setForm(emptyForm); setEditingId(null); setGalloSelected(null); setShowForm(true); }}
                  className="text-purple-600 text-sm font-medium hover:underline">+ Registrar primera pelea</button>
              )}
            </div>
          ) : peleasActuales.map(p => (
            <div key={p.id} className={`rounded-lg border p-3 ${p.resultado === 'Ganó' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}
              onClick={() => setShowDetalle(p)}>
              <div className="flex items-center justify-between">
                <div className="flex-1">
                  <div className="flex items-center gap-2">
                    <span className="font-medium text-sm text-gray-800">{p.gallos?.nombre || '#' + p.gallos?.numero_pinches}</span>
                    <span className={`text-xs font-bold ${p.resultado === 'Ganó' ? 'text-green-700' : 'text-red-700'}`}>{p.resultado === 'Ganó' ? '✅' : '❌'} {p.resultado}</span>
                  </div>
                  <p className="text-xs text-gray-500 mt-0.5">
                    {p.fecha} {p.lugar ? `• ${p.lugar}` : ''} {(p.duracion || p.duracion_segundos) ? `• ${p.duracion ? p.duracion + ':' + String(p.duracion_segundos||0).padStart(2,'0') : p.duracion_segundos + 'seg'}` : ''} {p.dinero_jugado ? `• $${p.dinero_jugado}` : ''}
                  </p>
                  {p.como_fue && <span className="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded mt-1 inline-block">{p.como_fue}</span>}
                </div>
                <div className="flex gap-1">
                  {canEdit && <button onClick={(ev) => { ev.stopPropagation(); handleEdit(p); }} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-white/50 text-sm">✏️</button>}
                  {canEdit && <button onClick={(ev) => { ev.stopPropagation(); handleDelete(p.id); }} className="w-7 h-7 flex items-center justify-center rounded-full hover:bg-white/50 text-sm">🗑</button>}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Modal Detalle */}
      {showDetalle && (
        <Modal title="Detalle Pelea" onClose={() => setShowDetalle(null)}>
          {(() => { const p = showDetalle; return (
            <div className="space-y-3 text-sm">
              <div className={`p-3 rounded-lg text-center ${p.resultado === 'Ganó' ? 'bg-green-100' : 'bg-red-100'}`}>
                <p className="text-2xl font-bold">{p.resultado === 'Ganó' ? '✅ GANÓ' : '❌ PERDIÓ'}</p>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div><span className="text-gray-500">Gallo:</span> <span className="font-medium">{p.gallos?.nombre}</span></div>
                <div><span className="text-gray-500">Fecha:</span> <span className="font-medium">{p.fecha}</span></div>
                <div><span className="text-gray-500">Lugar:</span> <span className="font-medium">{p.lugar || 'N/A'}</span></div>
                <div><span className="text-gray-500">Duración:</span> <span className="font-medium">{p.duracion ? p.duracion + ':' + String(p.duracion_segundos||0).padStart(2,'0') : (p.duracion_segundos ? p.duracion_segundos + ' seg' : 'N/A')}</span></div>
                <div><span className="text-gray-500">Dinero:</span> <span className="font-medium">${p.dinero_jugado || 0}</span></div>
                <div><span className="text-gray-500">Cómo fue:</span> <span className="font-medium">{p.como_fue || 'N/A'}</span></div>
                <div><span className="text-gray-500">Oponente:</span> <span className="font-medium">{p.duenio_oponente || 'N/A'}</span></div>
                <div><span className="text-gray-500">Peso Op.:</span> <span className="font-medium">{p.peso_oponente_libras || '?'}lb {p.peso_oponente_onzas || 0}oz</span></div>
                <div><span className="text-gray-500">Estilo Op.:</span> <span className="font-medium">{p.estilo_oponente || 'N/A'}</span></div>
                <div><span className="text-gray-500">Armador:</span> <span className="font-medium">{p.armador || 'N/A'}</span></div>
              </div>
              {p.estilo_observado && <div className="border-t pt-2"><p className="text-gray-500">Estilo observado: <span className="text-gray-800">{p.estilo_observado}</span></p></div>}
              {p.puntos_positivos && <div className="border-t pt-2"><p className="text-gray-500">Positivo: <span className="text-green-700">{p.puntos_positivos}</span></p></div>}
              {p.puntos_negativos && <div className="border-t pt-2"><p className="text-gray-500">Negativo: <span className="text-red-700">{p.puntos_negativos}</span></p></div>}
              {p.lesiones && <div className="border-t pt-2"><p className="text-gray-500">Lesiones: <span className="text-red-700">{p.lesiones}</span></p></div>}
            </div>
          ); })()}
        </Modal>
      )}

      {/* Modal Formulario */}
      {showForm && (
        <Modal title={editingId ? 'Editar Pelea' : 'Nueva Pelea'} onClose={() => setShowForm(false)}>
          <div className="space-y-4">
            <Field label="Gallo (amarrado)" required>
              <GalloSearch gallos={gallos} selected={galloSelected}
                onSelect={g => { setGalloSelected(g); setForm(f => ({...f, gallo_id: g.id})); }}
                onClear={() => { setGalloSelected(null); setForm(f => ({...f, gallo_id: null})); }}
                filter={g => g.amarrado} placeholder="Buscar gallo amarrado..." />
            </Field>

            <div className="grid grid-cols-2 gap-3">
              <Field label="Fecha" required><Input type="date" value={form.fecha} onChange={e => setForm({...form, fecha: e.target.value})} /></Field>
              <Field label="Lugar">
                <Input type="text" placeholder="ej: Gallera..." value={form.lugar} onChange={e => setForm({...form, lugar: e.target.value})}
                  list="lugares-list" />
                <datalist id="lugares-list">{lugaresUnicos.map(l => <option key={l} value={l} />)}</datalist>
              </Field>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label="Dueño Oponente"><Input type="text" value={form.duenio_oponente} onChange={e => setForm({...form, duenio_oponente: e.target.value})} /></Field>
              <Field label="Armador"><Input type="text" value={form.armador} onChange={e => setForm({...form, armador: e.target.value})} /></Field>
            </div>

            <div className="grid grid-cols-3 gap-3">
              <Field label="Peso Op. (lb)"><Input type="number" value={form.peso_oponente_libras} onChange={e => setForm({...form, peso_oponente_libras: e.target.value})} /></Field>
              <Field label="Peso Op. (oz)"><Input type="number" min="0" max="15" value={form.peso_oponente_onzas} onChange={e => setForm({...form, peso_oponente_onzas: e.target.value})} /></Field>
              <Field label="Estilo Op.">
                <Select value={form.estilo_oponente} onChange={e => setForm({...form, estilo_oponente: e.target.value})}
                  options={[{value: '', label: 'Seleccionar...'}, ...estiloOpts]} />
              </Field>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label="Resultado" required>
                <Select value={form.resultado} onChange={e => setForm({...form, resultado: e.target.value})}
                  options={[{value:'Ganó',label:'✅ Ganó'},{value:'Perdió',label:'❌ Perdió'}]} />
              </Field>
              <Field label="Dinero (USD)">
                <Input type="number" placeholder="$" value={form.dinero_jugado} onChange={e => setForm({...form, dinero_jugado: e.target.value})} />
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Duración (min)"><Input type="number" placeholder="0" value={form.duracion} onChange={e => setForm({...form, duracion: e.target.value})} /></Field>
              <Field label="Segundos"><Input type="number" placeholder="0" min="0" max="59" value={form.duracion_segundos} onChange={e => setForm({...form, duracion_segundos: e.target.value})} /></Field>
            </div>

            <div className="border-t pt-3">
              <p className="text-sm font-medium text-gray-700 mb-2">¿Cómo fue?</p>
              <div className="flex flex-wrap gap-1.5">
                {comoFueOpts.map(c => (
                  <button key={c} onClick={() => setForm({...form, como_fue: c})}
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-medium transition ${
                      form.como_fue === c ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-700'
                    }`}>{c}</button>
                ))}
              </div>
            </div>

            <Field label="Estilo Observado"><Input type="text" placeholder="¿Cómo peleó nuestro gallo?" value={form.estilo_observado} onChange={e => setForm({...form, estilo_observado: e.target.value})} /></Field>
            <Field label="Puntos Positivos"><Textarea placeholder="¿Qué hizo bien?" value={form.puntos_positivos} onChange={e => setForm({...form, puntos_positivos: e.target.value})} /></Field>
            <Field label="Puntos Negativos"><Textarea placeholder="¿Qué faltó?" value={form.puntos_negativos} onChange={e => setForm({...form, puntos_negativos: e.target.value})} /></Field>
            <Field label="Lesiones"><Textarea placeholder="Descripción de lesiones..." value={form.lesiones} onChange={e => setForm({...form, lesiones: e.target.value})} /></Field>

            {canEdit && <button onClick={handleSave} className="w-full bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700">
              {editingId ? 'Actualizar' : 'Guardar'} Pelea
            </button>}
          </div>
        </Modal>
      )}
    </div>
  );
};

// ============================================
// MÓDULO: DASHBOARD
// ============================================
const DashboardModule = () => {
  const { gallos, toast } = useContext(AppContext);
  const [selected, setSelected] = useState(null);
  const [entrenamientos, setEntrenamientos] = useState([]);
  const [peleas, setPeleas] = useState([]);
  const [showArbol, setShowArbol] = useState(false);
  const [showFicha, setShowFicha] = useState(false);
  const [showAllEnts, setShowAllEnts] = useState(false);
  const [showAllPels, setShowAllPels] = useState(false);
  const [showDetEnt, setShowDetEnt] = useState(null);
  const [showDetPel, setShowDetPel] = useState(null);
  const [viewingPhoto, setViewingPhoto] = useState(null);
  const topRef = useRef(null);

  const loadData = async (gallo) => {
    setSelected(gallo);
    setTimeout(() => topRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    const [{ data: ents }, { data: pels }] = await Promise.all([
      supabase.from('entrenamientos').select('*').eq('gallo_id', gallo.id).order('fecha', { ascending: false }).limit(50),
      supabase.from('peleas').select('*').eq('gallo_id', gallo.id).order('fecha', { ascending: false }).limit(50),
    ]);
    setEntrenamientos(ents || []);
    setPeleas(pels || []);
  };

  const padre = selected ? gallos.find(g => g.id === selected.padre_id) : null;
  const madre = selected ? gallos.find(g => g.id === selected.madre_id) : null;
  const ganadas = peleas.filter(p => p.resultado === 'Ganó').length;
  const perdidas = peleas.filter(p => p.resultado === 'Perdió').length;

  const desempenoColor = (d) => {
    if (d === 'Excelente') return 'bg-green-100 text-green-800';
    if (d === 'Bueno') return 'bg-blue-100 text-blue-800';
    if (d === 'Regular') return 'bg-yellow-100 text-yellow-800';
    return 'bg-red-100 text-red-800';
  };

  return (
    <div className="fade-in">
      <h2 className="text-xl font-bold text-gray-800 mb-1">Dashboard</h2>
      <p className="text-sm text-gray-500 mb-4">Busca un gallo para ver toda su información</p>

      <div ref={topRef} />
      <GalloSearch gallos={gallos} selected={selected}
        onSelect={loadData} onClear={() => { setSelected(null); setEntrenamientos([]); setPeleas([]); }}
        placeholder="Buscar gallo por nombre o pinches..." />

      {selected && (
        <div className="mt-4 space-y-4">
          {/* Info general */}
          <div className="bg-white rounded-lg border border-gray-200 p-4">
            <div className="flex items-start justify-between">
              <div className="flex items-start gap-3">
                {selected.foto && <img src={selected.foto} className="w-16 h-16 rounded-lg object-cover flex-shrink-0 cursor-pointer" onClick={() => setViewingPhoto(selected.foto)} />}
                <div>
                  <h3 className="text-lg font-bold text-gray-800">{selected.nombre || 'Sin nombre'}</h3>
                  <p className="text-sm text-gray-500">
                    {selected.numero_pinches ? `#${selected.numero_pinches} • ` : ''}{selected.sexo} • {selected.linea_genetica || 'Sin línea'}
                    {selected.color ? ` • ${selected.color}` : ''}
                  </p>
                </div>
              </div>
              {selected.amarrado && <span className="bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded">AMARRADO</span>}
            </div>

            <div className="grid grid-cols-2 gap-3 mt-3">
              <div className="text-sm"><span className="text-gray-500">Padre:</span> <span className="font-medium">{padre ? (padre.nombre || '#' + padre.numero_pinches) : 'Desconocido'}</span></div>
              <div className="text-sm"><span className="text-gray-500">Madre:</span> <span className="font-medium">{madre ? (madre.nombre || '#' + madre.numero_pinches) : 'Desconocida'}</span></div>
            </div>

            {selected.caracteristicas && selected.caracteristicas.length > 0 && (
              <div className="flex flex-wrap gap-1 mt-3">
                {selected.caracteristicas.map(c => <span key={c} className="text-xs bg-orange-50 text-orange-700 px-2 py-0.5 rounded">{c}</span>)}
              </div>
            )}

            {selected.amarrado && (
              <div className="grid grid-cols-3 gap-2 mt-3">
                <div className="bg-blue-50 rounded-lg p-2 text-center">
                  <p className="text-lg font-bold text-blue-700">{entrenamientos.length}</p>
                  <p className="text-[10px] text-blue-600">Entrenamientos</p>
                </div>
                <div className="bg-green-50 rounded-lg p-2 text-center">
                  <p className="text-lg font-bold text-green-700">{ganadas}</p>
                  <p className="text-[10px] text-green-600">Ganadas</p>
                </div>
                <div className="bg-red-50 rounded-lg p-2 text-center">
                  <p className="text-lg font-bold text-red-700">{perdidas}</p>
                  <p className="text-[10px] text-red-600">Perdidas</p>
                </div>
              </div>
            )}

            <div className="mt-3 grid grid-cols-2 gap-2">
              <button onClick={() => setShowFicha(true)} className="bg-orange-50 text-orange-700 border border-orange-200 py-2 rounded-lg text-sm font-semibold hover:bg-orange-100">
                🧬 Ficha Completa
              </button>
              <button onClick={() => setShowArbol(true)} className="bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-medium hover:bg-gray-200">
                🌳 Árbol Genealógico
              </button>
            </div>
          </div>

          {/* Entrenamientos recientes */}
          {selected.amarrado && (
            <div className="bg-white rounded-lg border border-gray-200 p-4">
              <div className="flex justify-between items-center mb-3">
                <h4 className="font-bold text-gray-800">Entrenamientos</h4>
                {entrenamientos.length > 5 && (
                  <button onClick={() => setShowAllEnts(true)} className="text-xs text-blue-600 font-semibold hover:underline">
                    Ver todos ({entrenamientos.length}) →
                  </button>
                )}
              </div>
              {entrenamientos.length === 0 ? <p className="text-sm text-gray-400">Sin entrenamientos</p> : (
                <div className="space-y-1.5">
                  {entrenamientos.slice(0, 5).map(e => (
                    <div key={e.id} className="flex items-center justify-between py-1.5 border-b border-gray-100 last:border-0 cursor-pointer hover:bg-gray-50 -mx-1 px-1 rounded"
                      onClick={() => setShowDetEnt(e)}>
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-gray-500 w-20">{e.fecha}</span>
                        <span className="text-xs font-medium">{e.peso_libras}lb {e.peso_onzas}oz</span>
                        {e.corrida && <span className="text-xs text-gray-400">{e.corrida}' corr</span>}{e.chata && <span className="text-xs text-blue-400 ml-1">{e.chata}' chat</span>}
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0">
                        {e.ai_indice_general != null && <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-purple-100 text-purple-700">🤖 {e.ai_indice_general}</span>}
                        <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${desempenoColor(e.desempeno_general)}`}>{e.desempeno_general}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Peleas recientes */}
          {selected.amarrado && (
            <div className="bg-white rounded-lg border border-gray-200 p-4">
              <div className="flex justify-between items-center mb-3">
                <h4 className="font-bold text-gray-800">Historial de Peleas</h4>
                {peleas.length > 5 && (
                  <button onClick={() => setShowAllPels(true)} className="text-xs text-purple-600 font-semibold hover:underline">
                    Ver todas ({peleas.length}) →
                  </button>
                )}
              </div>
              {peleas.length === 0 ? <p className="text-sm text-gray-400">Sin peleas</p> : (
                <div className="space-y-1.5">
                  {peleas.slice(0, 5).map(p => (
                    <div key={p.id} className={`flex items-center justify-between py-1.5 px-2 rounded cursor-pointer ${p.resultado === 'Ganó' ? 'bg-green-50 hover:bg-green-100' : 'bg-red-50 hover:bg-red-100'}`}
                      onClick={() => setShowDetPel(p)}>
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-bold">{p.resultado === 'Ganó' ? '✅' : '❌'}</span>
                        <span className="text-xs text-gray-500">{p.fecha}</span>
                        <span className="text-xs">{p.duracion ? `${p.duracion}:${String(p.duracion_segundos||0).padStart(2,'0')}` : (p.duracion_segundos ? `${p.duracion_segundos}seg` : '')}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        {p.como_fue && <span className="text-[10px] text-purple-600">{p.como_fue}</span>}
                        <span className="text-xs font-medium">${p.dinero_jugado || 0}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* SECCIÓN GALLOS AMARRADOS */}
      {(() => {
        const amarrados = gallos.filter(g => g.amarrado);
        if (amarrados.length === 0) return null;
        return (
          <div className="mt-6">
            <div className="flex items-center gap-2 mb-3">
              <div className="h-px bg-gray-200 flex-1" />
              <span className="text-sm font-bold text-red-700 uppercase tracking-wider">Gallos Amarrados ({amarrados.length})</span>
              <div className="h-px bg-gray-200 flex-1" />
            </div>
            <div className="space-y-2">
              {amarrados.map(g => {
                const pa = gallos.find(x => x.id === g.padre_id);
                const ma = gallos.find(x => x.id === g.madre_id);
                return (
                  <div key={g.id} className="bg-white rounded-lg border border-gray-200 p-3 cursor-pointer hover:border-red-300 active:bg-gray-50 transition"
                    onClick={() => loadData(g)}>
                    <div className="flex items-start justify-between">
                      {g.foto && <img src={g.foto} className="w-14 h-14 rounded-lg object-cover mr-3 flex-shrink-0 cursor-pointer" onClick={(e) => { e.stopPropagation(); setViewingPhoto(g.foto); }} />}
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-gray-800">{g.nombre || 'Sin nombre'}</span>
                          {g.numero_pinches && <span className="text-xs bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">#{g.numero_pinches}</span>}
                          <span className="text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-medium">Amarrado{g.jaula ? ` • Jaula ${g.jaula}` : ''}</span>
                          <span className="text-xs text-gray-400">{g.sexo === 'Gallina' ? '♀' : '♂'}</span>
                        </div>
                        <p className="text-xs text-gray-500 mt-0.5">
                          {[g.linea_genetica, g.color].filter(Boolean).join(' • ') || 'Sin datos adicionales'}
                        </p>
                        <p className="text-xs text-gray-400 mt-0.5">
                          Padre: {pa ? (pa.nombre || '#' + pa.numero_pinches) : '?'} • Madre: {ma ? (ma.nombre || '#' + ma.numero_pinches) : '?'}
                        </p>
                        {g.caracteristicas && g.caracteristicas.length > 0 && (
                          <div className="flex flex-wrap gap-1 mt-1.5">
                            {g.caracteristicas.slice(0, 5).map(c => <span key={c} className="text-[10px] bg-orange-50 text-orange-700 px-1.5 py-0.5 rounded">{c}</span>)}
                            {g.caracteristicas.length > 5 && <span className="text-[10px] text-gray-400">+{g.caracteristicas.length - 5}</span>}
                          </div>
                        )}
                      </div>
                      <span className="text-gray-300 text-lg ml-2">›</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {/* Árbol modal */}
      {showArbol && selected && <PedigriModal gallos={gallos} initialFocusId={selected.id} onClose={() => setShowArbol(false)} />}

      {/* ── MODAL: FICHA COMPLETA ─────────────────────────────────── */}
      {showFicha && selected && (
        <Modal title={`Ficha: ${selected.nombre || '#' + selected.numero_pinches}`} onClose={() => setShowFicha(false)}>
          <div className="space-y-4 text-sm">

            {/* Foto + datos básicos */}
            <div className="flex gap-3 items-start">
              {selected.foto && <img src={selected.foto} className="w-20 h-20 rounded-xl object-cover flex-shrink-0 cursor-pointer border border-gray-200" onClick={() => setViewingPhoto(selected.foto)} />}
              <div className="flex-1 space-y-1">
                <p><span className="text-gray-500">Nombre:</span> <span className="font-semibold">{selected.nombre || '—'}</span></p>
                {selected.numero_pinches && <p><span className="text-gray-500">Pinches:</span> <span className="font-semibold">#{selected.numero_pinches}</span></p>}
                <p><span className="text-gray-500">Sexo:</span> <span className="font-semibold">{selected.sexo}</span></p>
                {selected.fecha_nacimiento && <p><span className="text-gray-500">Nacimiento:</span> <span className="font-semibold">{selected.fecha_nacimiento}</span></p>}
                {selected.color && <p><span className="text-gray-500">Color:</span> <span className="font-semibold">{selected.color}</span></p>}
                {selected.linea_genetica && <p><span className="text-gray-500">Línea:</span> <span className="font-semibold">{selected.linea_genetica}</span></p>}
                <p><span className="text-gray-500">Amarrado:</span> <span className={`font-semibold ${selected.amarrado ? 'text-red-700' : 'text-gray-700'}`}>{selected.amarrado ? `Sí${selected.jaula ? ` – Jaula ${selected.jaula}` : ''}` : 'No'}</span></p>
              </div>
            </div>

            {/* Genealogía */}
            <div className="border-t pt-3">
              <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">👨‍👩‍👧 Genealogía</p>
              <div className="grid grid-cols-2 gap-2">
                <div className="bg-blue-50 rounded-lg p-2">
                  <p className="text-[10px] text-blue-500 font-bold uppercase">Padre</p>
                  <p className="font-semibold text-gray-800">{padre ? (padre.nombre || `#${padre.numero_pinches}`) : 'Desconocido'}</p>
                  {padre?.linea_genetica && <p className="text-xs text-gray-500">{padre.linea_genetica}</p>}
                </div>
                <div className="bg-pink-50 rounded-lg p-2">
                  <p className="text-[10px] text-pink-500 font-bold uppercase">Madre</p>
                  <p className="font-semibold text-gray-800">{madre ? (madre.nombre || `#${madre.numero_pinches}`) : 'Desconocida'}</p>
                  {madre?.linea_genetica && <p className="text-xs text-gray-500">{madre.linea_genetica}</p>}
                </div>
              </div>
            </div>

            {/* Características por categoría */}
            {selected.caracteristicas && selected.caracteristicas.length > 0 && (
              <div className="border-t pt-3">
                <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">⭐ Características</p>
                <div className="space-y-3">
                  {CATS_CARACTERISTICAS.map(cat => {
                    const c = CAT_COLORS[cat.color];
                    const todasOpts = cat.subs.flatMap(s => s.opts);
                    const presentes = selected.caracteristicas.filter(x => todasOpts.includes(x));
                    if (presentes.length === 0) return null;
                    return (
                      <div key={cat.id}>
                        <p className={`text-[10px] font-bold uppercase tracking-wide mb-1.5 ${c.lbl}`}>{cat.label}</p>
                        <div className="flex flex-wrap gap-1.5">
                          {presentes.map(x => (
                            <div key={x} className="group relative">
                              <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${c.on}`}>{x}</span>
                            </div>
                          ))}
                        </div>
                        {/* Definiciones de las presentes */}
                        <div className="mt-2 space-y-1">
                          {presentes.map(x => LEYENDA[x] && (
                            <p key={x} className="text-xs text-gray-500"><span className="font-semibold text-gray-700">{x}:</span> {LEYENDA[x]}</p>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                  {/* Características no categorizadas */}
                  {(() => {
                    const todasCat = CATS_CARACTERISTICAS.flatMap(cat => cat.subs.flatMap(s => s.opts));
                    const otras = selected.caracteristicas.filter(x => !todasCat.includes(x));
                    if (otras.length === 0) return null;
                    return (
                      <div>
                        <p className="text-[10px] font-bold uppercase tracking-wide mb-1.5 text-gray-500">Otras</p>
                        <div className="flex flex-wrap gap-1.5">
                          {otras.map(x => <span key={x} className="text-xs px-2.5 py-1 rounded-full bg-orange-100 text-orange-800 font-medium">{x}</span>)}
                        </div>
                      </div>
                    );
                  })()}
                </div>
              </div>
            )}

            {/* Observaciones */}
            {selected.observaciones && (
              <div className="border-t pt-3">
                <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">📝 Observaciones</p>
                <p className="text-gray-700 leading-relaxed">{selected.observaciones}</p>
              </div>
            )}

            {/* Stats si está amarrado */}
            {selected.amarrado && (
              <div className="border-t pt-3">
                <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">📊 Resumen</p>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div className="bg-blue-50 rounded-lg p-2">
                    <p className="text-lg font-bold text-blue-700">{entrenamientos.length}</p>
                    <p className="text-[10px] text-blue-600">Entrenamientos</p>
                  </div>
                  <div className="bg-green-50 rounded-lg p-2">
                    <p className="text-lg font-bold text-green-700">{ganadas}</p>
                    <p className="text-[10px] text-green-600">Ganadas</p>
                  </div>
                  <div className="bg-red-50 rounded-lg p-2">
                    <p className="text-lg font-bold text-red-700">{perdidas}</p>
                    <p className="text-[10px] text-red-600">Perdidas</p>
                  </div>
                </div>
              </div>
            )}

            {/* Progresión IA */}
            {selected.amarrado && (() => {
              const withAI = entrenamientos.filter(e => e.ai_indice_general != null);
              if (withAI.length === 0) return null;
              const avg = Math.round(withAI.reduce((s, e) => s + e.ai_indice_general, 0) / withAI.length);
              return (
                <div className="border-t pt-3">
                  <div className="flex items-center justify-between mb-2">
                    <p className="text-xs font-bold text-gray-500 uppercase tracking-wide">🤖 Índice IA por Sesión</p>
                    <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-bold">Prom: {avg}/100</span>
                  </div>
                  <div className="space-y-1.5">
                    {withAI.slice(0, 5).map(e => (
                      <div key={e.id} className="flex items-center gap-2 bg-purple-50 rounded-lg px-2.5 py-2">
                        <span className="text-xs text-gray-500 w-20 flex-shrink-0">{e.fecha}</span>
                        <div className="flex-1 min-w-0">
                          <div className="h-2 bg-purple-100 rounded-full overflow-hidden">
                            <div className="h-full bg-purple-500 rounded-full" style={{width: e.ai_indice_general + '%'}} />
                          </div>
                          {e.ai_summary?.resumen_general && (
                            <p className="text-[10px] text-gray-500 mt-0.5 truncate">{e.ai_summary.resumen_general}</p>
                          )}
                        </div>
                        <span className="text-sm font-black text-purple-700 flex-shrink-0 w-8 text-right">{e.ai_indice_general}</span>
                      </div>
                    ))}
                  </div>
                  {withAI.length > 5 && <p className="text-[10px] text-gray-400 mt-1 text-right">+{withAI.length - 5} sesiones más</p>}
                </div>
              );
            })()}
          </div>
        </Modal>
      )}

      {/* ── MODAL: TODOS LOS ENTRENAMIENTOS ──────────────────────── */}
      {showAllEnts && selected && (
        <Modal title={`Entrenamientos — ${selected.nombre || '#' + selected.numero_pinches}`} onClose={() => setShowAllEnts(false)}>
          <div className="space-y-1.5">
            {entrenamientos.length === 0 ? <p className="text-sm text-gray-400 text-center py-6">Sin entrenamientos</p> : entrenamientos.map(e => (
              <div key={e.id} className="border border-gray-100 rounded-lg p-3 cursor-pointer hover:bg-gray-50 active:bg-gray-100"
                onClick={() => { setShowDetEnt(e); setShowAllEnts(false); }}>
                <div className="flex justify-between items-start">
                  <div>
                    <p className="text-sm font-semibold text-gray-800">{e.fecha}</p>
                    <p className="text-xs text-gray-500 mt-0.5">
                      ⚖️ {e.peso_libras}lb {e.peso_onzas}oz
                      {e.corrida ? ` · ${e.corrida}' corrida` : ''}
                      {e.chata ? ` · ${e.chata}' chata` : ''}
                      {e.clima ? ` · ${e.clima}` : ''}
                    </p>
                    {e.nutricion_items && e.nutricion_items.length > 0 && (
                      <div className="flex flex-wrap gap-1 mt-1">
                        {e.nutricion_items.map(n => <span key={n} className="text-[10px] bg-green-50 text-green-700 px-1.5 py-0.5 rounded">{n}</span>)}
                      </div>
                    )}
                  </div>
                  <div className="flex flex-col items-end gap-1 ml-2 flex-shrink-0">
                    <span className={`text-xs px-2 py-0.5 rounded font-medium ${desempenoColor(e.desempeno_general)}`}>{e.desempeno_general}</span>
                    {e.ai_indice_general != null && <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-purple-100 text-purple-700">🤖 {e.ai_indice_general}</span>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Modal>
      )}

      {/* ── MODAL: TODAS LAS PELEAS ───────────────────────────────── */}
      {showAllPels && selected && (
        <Modal title={`Peleas — ${selected.nombre || '#' + selected.numero_pinches}`} onClose={() => setShowAllPels(false)}>
          <div className="mb-3 grid grid-cols-3 gap-2 text-center text-xs">
            <div className="bg-gray-50 rounded-lg py-2">
              <p className="text-lg font-bold text-gray-800">{peleas.length}</p>
              <p className="text-gray-500">Total</p>
            </div>
            <div className="bg-green-50 rounded-lg py-2">
              <p className="text-lg font-bold text-green-700">{ganadas}</p>
              <p className="text-green-600">Ganadas</p>
            </div>
            <div className="bg-red-50 rounded-lg py-2">
              <p className="text-lg font-bold text-red-700">{perdidas}</p>
              <p className="text-red-600">Perdidas</p>
            </div>
          </div>
          <div className="space-y-1.5">
            {peleas.length === 0 ? <p className="text-sm text-gray-400 text-center py-6">Sin peleas</p> : peleas.map(p => (
              <div key={p.id} className={`rounded-lg p-3 cursor-pointer ${p.resultado === 'Ganó' ? 'bg-green-50 hover:bg-green-100' : 'bg-red-50 hover:bg-red-100'}`}
                onClick={() => { setShowDetPel(p); setShowAllPels(false); }}>
                <div className="flex justify-between items-center">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-sm">{p.resultado === 'Ganó' ? '✅' : '❌'}</span>
                      <span className="text-sm font-semibold text-gray-800">{p.fecha}</span>
                      {p.lugar && <span className="text-xs text-gray-500">{p.lugar}</span>}
                    </div>
                    <p className="text-xs text-gray-500 mt-0.5">
                      {p.duracion ? `${p.duracion}:${String(p.duracion_segundos||0).padStart(2,'0')}` : ''}
                      {p.como_fue ? ` · ${p.como_fue}` : ''}
                      {p.duenio_oponente ? ` · vs ${p.duenio_oponente}` : ''}
                    </p>
                  </div>
                  <span className="text-sm font-bold text-gray-700 ml-2">${p.dinero_jugado || 0}</span>
                </div>
              </div>
            ))}
          </div>
        </Modal>
      )}

      {/* Detalle entrenamiento */}
      {showDetEnt && (
        <Modal title="Detalle Entrenamiento" onClose={() => setShowDetEnt(null)}>
          {(() => { const e = showDetEnt; return (
            <div className="space-y-3 text-sm">
              {/* Fecha y Peso */}
              <div className="grid grid-cols-2 gap-2">
                <div><span className="text-gray-500">Fecha:</span> <span className="font-medium">{e.fecha}</span></div>
                <div><span className="text-gray-500">Peso:</span> <span className="font-medium">{e.peso_libras}lb {e.peso_onzas}oz</span></div>
              </div>

              {/* Duración */}
              <div className="border-t pt-2">
                <p className="text-xs font-bold text-gray-700 mb-1 uppercase">Duración</p>
                <div className="grid grid-cols-3 gap-2">
                  <div><span className="text-gray-500">Corrida:</span> <span className="font-medium">{e.corrida || 0} min</span></div>
                  <div><span className="text-gray-500">Chata:</span> <span className="font-medium">{e.chata || 0} min</span></div>
                  <div><span className="text-gray-500">Corrida:</span> <span className="font-medium">{e.corrida || 0} min</span> <span className="text-gray-500 ml-2">Chata:</span> <span className="font-medium">{e.chata || 0} min</span></div>
                </div>
              </div>

              {/* Condiciones del Día */}
              <div className="border-t pt-2">
                <p className="text-xs font-bold text-gray-700 mb-1 uppercase">Condiciones del Día</p>
                <div className="grid grid-cols-2 gap-2">
                  <div><span className="text-gray-500">Clima:</span> <span className="font-medium">{e.clima}</span></div>
                  <div><span className="text-gray-500">Temperatura:</span> <span className="font-medium">{e.temperatura ? `${e.temperatura}°F` : 'N/A'}</span></div>
                  <div><span className="text-gray-500">Tomó Sol:</span> <span className="font-medium">{e.tomo_sol}</span></div>
                  <div><span className="text-gray-500">Intensidad:</span> <span className="font-medium">{e.intensidad}</span></div>
                </div>
              </div>

              {/* Ánimo y Condición */}
              <div className="border-t pt-2">
                <p className="text-xs font-bold text-gray-700 mb-1 uppercase">Ánimo y Condición Física</p>
                <div className="grid grid-cols-2 gap-2">
                  <div><span className="text-gray-500">Ánimo:</span> <span className="font-medium">{e.animo_gallo}</span></div>
                  <div><span className="text-gray-500">Plumas General:</span> <span className="font-medium">{e.condicion_plumeras_general}</span></div>
                  <div><span className="text-gray-500">Plumas Alas:</span> <span className="font-medium">{e.condicion_plumeras_alas}</span></div>
                  <div><span className="text-gray-500">Plumas Rabos:</span> <span className="font-medium">{e.condicion_plumeras_rabos}</span></div>
                  <div><span className="text-gray-500">Problemas Alas:</span> <span className="font-medium">{e.problemas_alas}</span></div>
                  <div><span className="text-gray-500">Pico:</span> <span className="font-medium">{e.condicion_pico}</span></div>
                  <div><span className="text-gray-500">Espuelas:</span> <span className="font-medium">{e.condicion_espuelas}</span></div>
                </div>
              </div>

              {/* Nutrición */}
              <div className="border-t pt-2">
                <p className="text-xs font-bold text-gray-700 mb-1 uppercase">Nutrición y Medicinas</p>
                {e.nutricion_items && e.nutricion_items.length > 0 ? (
                  <div className="flex flex-wrap gap-1 mb-2">{e.nutricion_items.map(n => <span key={n} className="text-xs bg-green-50 text-green-700 px-2 py-0.5 rounded">{n}</span>)}</div>
                ) : <p className="text-gray-400 text-xs mb-2">Sin nutrición registrada</p>}
                <div className="space-y-1">
                  <div><span className="text-gray-500">Desparasitante:</span> <span className="font-medium">{e.desparasitante || 'N/A'}</span></div>
                  <div><span className="text-gray-500">Medicinas:</span> <span className="font-medium">{e.medicinas_especiales || 'N/A'}</span></div>
                  <div><span className="text-gray-500">Alimentación Especial:</span> <span className="font-medium">{e.alimentacion_especial || 'N/A'}</span></div>
                </div>
              </div>

              {/* Desempeño */}
              <div className="border-t pt-2">
                <p className="text-xs font-bold text-gray-700 mb-1 uppercase">Desempeño</p>
                <div className="grid grid-cols-3 gap-2">
                  <div><span className="text-gray-500">General:</span> <span className={`font-medium px-1.5 py-0.5 rounded ${desempenoColor(e.desempeno_general)}`}>{e.desempeno_general}</span></div>
                  <div><span className="text-gray-500">Velocidad:</span> <span className="font-medium">{e.velocidad}</span></div>
                  <div><span className="text-gray-500">Resistencia:</span> <span className="font-medium">{e.resistencia}</span></div>
                </div>
                {e.razon_malo && <p className="mt-1 text-red-600">Razón: {e.razon_malo}</p>}
              </div>

              {/* Observaciones */}
              {e.observaciones && (
                <div className="border-t pt-2">
                  <p className="text-xs font-bold text-gray-700 mb-1 uppercase">Observaciones</p>
                  <p className="text-gray-700 bg-gray-50 p-2 rounded">{e.observaciones}</p>
                </div>
              )}

              {/* Análisis IA */}
              {e.ai_summary && (
                <div className="border-t pt-3">
                  <div className="flex items-center gap-2 mb-2">
                    <p className="text-xs font-bold text-purple-700 uppercase">🤖 Análisis IA</p>
                    {e.ai_indice_general != null && <span className="bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-bold text-xs">Índice: {e.ai_indice_general}/100</span>}
                  </div>
                  {e.ai_summary.resumen_general && <p className="text-xs text-gray-700 bg-purple-50 p-2 rounded leading-relaxed">{e.ai_summary.resumen_general}</p>}
                  {(e.ai_training_metrics?.puntos_fuertes?.length > 0 || e.ai_training_metrics?.puntos_a_observar?.length > 0) && (
                    <div className="grid grid-cols-2 gap-2 mt-2">
                      {e.ai_training_metrics.puntos_fuertes?.length > 0 && (
                        <div className="bg-green-50 rounded p-2">
                          <p className="text-[10px] font-bold text-green-800 mb-0.5">✅ Fortalezas</p>
                          {e.ai_training_metrics.puntos_fuertes.map((p, i) => <p key={i} className="text-[10px] text-green-700 leading-snug">• {p}</p>)}
                        </div>
                      )}
                      {e.ai_training_metrics.puntos_a_observar?.length > 0 && (
                        <div className="bg-yellow-50 rounded p-2">
                          <p className="text-[10px] font-bold text-yellow-800 mb-0.5">👀 A Observar</p>
                          {e.ai_training_metrics.puntos_a_observar.map((p, i) => <p key={i} className="text-[10px] text-yellow-700 leading-snug">• {p}</p>)}
                        </div>
                      )}
                    </div>
                  )}
                  {e.ai_summary.alerts?.length > 0 && (
                    <p className="text-xs text-orange-700 mt-1.5">⚠️ {e.ai_summary.alerts.join(' · ')}</p>
                  )}
                </div>
              )}
            </div>
          ); })()}
        </Modal>
      )}

      {/* Detalle pelea */}
      {showDetPel && (
        <Modal title="Detalle Pelea" onClose={() => setShowDetPel(null)}>
          <div className="space-y-2 text-sm">
            <div className={`p-2 rounded text-center font-bold ${showDetPel.resultado === 'Ganó' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
              {showDetPel.resultado === 'Ganó' ? '✅ GANÓ' : '❌ PERDIÓ'}
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div><span className="text-gray-500">Fecha:</span> {showDetPel.fecha}</div>
              <div><span className="text-gray-500">Lugar:</span> {showDetPel.lugar || 'N/A'}</div>
              <div><span className="text-gray-500">Duración:</span> {showDetPel.duracion ? showDetPel.duracion + ':' + String(showDetPel.duracion_segundos||0).padStart(2,'0') : (showDetPel.duracion_segundos ? showDetPel.duracion_segundos + ' seg' : 'N/A')}</div>
              <div><span className="text-gray-500">Dinero:</span> ${showDetPel.dinero_jugado||0}</div>
              <div><span className="text-gray-500">Cómo fue:</span> {showDetPel.como_fue || 'N/A'}</div>
              <div><span className="text-gray-500">Armador:</span> {showDetPel.armador || 'N/A'}</div>
            </div>
            {showDetPel.puntos_positivos && <p className="border-t pt-2 text-green-700">+ {showDetPel.puntos_positivos}</p>}
            {showDetPel.puntos_negativos && <p className="text-red-700">- {showDetPel.puntos_negativos}</p>}
            {showDetPel.lesiones && <p className="border-t pt-2 text-red-700">Lesiones: {showDetPel.lesiones}</p>}
          </div>
        </Modal>
      )}
      <PhotoViewer src={viewingPhoto} onClose={() => setViewingPhoto(null)} />
    </div>
  );
};
