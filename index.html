const AdminModal = ({ onClose, user }) => {
  const [usuarios, setUsuarios] = useState([]);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [nombre, setNombre] = useState('');
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');
  const [msgType, setMsgType] = useState('error');

  const load = async () => {
    const { data } = await supabase.from('memberships')
      .select('*').eq('owner_id', user.id).eq('role', 'app_user')
      .order('created_at', { ascending: false });
    setUsuarios(data || []);
  };
  useEffect(() => { load(); }, []);

  const handleCreate = async () => {
    if (!email.trim() || !password.trim()) { setMsg('Email y contraseña son requeridos'); setMsgType('error'); return; }
    if (password.length < 6) { setMsg('Contraseña mínimo 6 caracteres'); setMsgType('error'); return; }
    if (usuarios.some(u => u.collaborator_email === email.trim().toLowerCase())) {
      setMsg('Ese email ya tiene cuenta.'); setMsgType('error'); return;
    }
    setSaving(true); setMsg('');
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-user`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ email: email.trim().toLowerCase(), password: password.trim(), role: 'app_user', owner_id: user.id })
      });
      const result = await res.json();
      if (!res.ok) { setMsg(result.error || 'Error al crear usuario'); setMsgType('error'); setSaving(false); return; }
      if (nombre.trim()) {
        const newMem = result.membership_id || null;
        if (newMem) await supabase.from('memberships').update({ collaborator_email: email.trim().toLowerCase() }).eq('id', newMem);
      }
      setMsg('Cuenta creada correctamente.'); setMsgType('ok');
      setEmail(''); setPassword(''); setNombre('');
      load();
    } catch(e) { setMsg('Error: ' + e.message); setMsgType('error'); }
    setSaving(false);
  };

  const handleToggle = async (u) => {
    const newStatus = u.status === 'active' ? 'inactive' : 'active';
    await supabase.from('memberships').update({ status: newStatus }).eq('id', u.id);
    load();
  };

  const handleDelete = async (u) => {
    if (!confirm('Eliminar la cuenta de ' + u.collaborator_email + '? El usuario no podrá entrar.')) return;
    await supabase.from('memberships').delete().eq('id', u.id);
    load();
  };

  const fmt = (ts) => ts ? new Date(ts).toLocaleDateString('es-PR') : '';

  return (
    <Modal title="⚙️ Gestión de Usuarios" onClose={onClose} wide>
      <div className="space-y-5">

        {/* Crear usuario */}
        <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-4 space-y-3">
          <p className="text-sm font-bold text-yellow-800">Crear nueva cuenta</p>
          <Input type="email" placeholder="Email del usuario" value={email} onChange={e => setEmail(e.target.value)} />
          <Input type="password" placeholder="Contraseña (mín. 6)" value={password} onChange={e => setPassword(e.target.value)} />
          <Input type="text" placeholder="Nombre o referencia (opcional)" value={nombre} onChange={e => setNombre(e.target.value)} />
          {msg && <p className={`text-xs p-2 rounded ${msgType === 'ok' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-600'}`}>{msg}</p>}
          <button onClick={handleCreate} disabled={saving}
            className="w-full bg-yellow-500 text-yellow-900 font-bold py-2.5 rounded-lg hover:bg-yellow-400 disabled:opacity-50">
            {saving ? 'Creando...' : '+ Crear cuenta'}
          </button>
        </div>

        {/* Lista de usuarios */}
        <div>
          <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
            Usuarios registrados ({usuarios.length})
          </p>
          {usuarios.length === 0
            ? <p className="text-sm text-gray-400 text-center py-4">No hay usuarios registrados aún</p>
            : <div className="space-y-2">
                {usuarios.map(u => (
                  <div key={u.id} className="flex items-center justify-between bg-gray-50 rounded-xl px-3 py-2.5 border border-gray-100">
                    <div className="min-w-0 flex-1">
                      <p className="text-sm font-medium text-gray-800 truncate">{u.collaborator_email}</p>
                      <p className="text-xs text-gray-400">Creado: {fmt(u.created_at)}</p>
                    </div>
                    <div className="flex items-center gap-2 ml-3 flex-shrink-0">
                      <button onClick={() => handleToggle(u)}
                        className={`text-xs px-2.5 py-1 rounded-full font-semibold ${u.status === 'active' ? 'bg-green-100 text-green-700 hover:bg-green-200' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>
                        {u.status === 'active' ? 'Activo' : 'Inactivo'}
                      </button>
                      <button onClick={() => handleDelete(u)} className="text-red-400 hover:text-red-600 text-lg">🗑</button>
                    </div>
                  </div>
                ))}
              </div>
          }
        </div>
      </div>
    </Modal>
  );
};

const GestionEquipoModal = ({ onClose, user, collaborators, setCollaborators }) => {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [role, setRole] = useState('viewer');
  const [saving, setSaving] = useState(false);
  const [successMsg, setSuccessMsg] = useState('');
  const [errorMsg, setErrorMsg] = useState('');

  const handleAdd = async () => {
    if (!email.trim() || !password.trim()) { setErrorMsg('Email y contraseña son requeridos'); return; }
    if (password.length < 6) { setErrorMsg('La contraseña debe tener al menos 6 caracteres'); return; }
    const emailLower = email.trim().toLowerCase();
    if (collaborators.some(m => m.collaborator_email === emailLower)) {
      setErrorMsg('Este email ya está en tu equipo.'); return;
    }
    setSaving(true); setErrorMsg(''); setSuccessMsg('');
    try {
      const { data: { session } } = await supabase.auth.getSession();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-user`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({
          email: email.trim().toLowerCase(),
          password: password.trim(),
          role,
          owner_id: user.id
        })
      });
      const result = await res.json();
      if (!res.ok) {
        setErrorMsg(result.error?.includes('already') ? 'Ese email ya tiene cuenta' : (result.error || 'Error al crear usuario'));
        setSaving(false); return;
      }
      setSuccessMsg(`Cuenta creada. ${email.trim()} ya puede entrar.`);
      setEmail(''); setPassword('');
      const { data: updated } = await supabase.from('memberships').select('*').eq('owner_id', user.id).order('created_at', { ascending: false });
      setCollaborators(updated || []);
    } catch(e) {
      setErrorMsg('Error de conexión: ' + e.message);
    }
    setSaving(false);
  };

  const handleRemove = async (id) => {
    if (!confirm('¿Quitar acceso a este usuario?')) return;
    await supabase.from('memberships').delete().eq('id', id);
    setCollaborators(prev => prev.filter(m => m.id !== id));
  };

  const handleRole = async (id, newRole) => {
    await supabase.from('memberships').update({ role: newRole }).eq('id', id);
    setCollaborators(prev => prev.map(m => m.id === id ? { ...m, role: newRole } : m));
  };

  return (
    <Modal title="👥 Mi Equipo" onClose={onClose}>
      <div className="space-y-4">
        <div className="bg-gray-50 rounded-xl p-4 space-y-3">
          <p className="text-sm font-bold text-gray-800">Crear acceso para alguien</p>
          <Input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} />
          <Input type="password" placeholder="Contraseña (mín. 6)" value={password} onChange={e => setPassword(e.target.value)} />
          <select value={role} onChange={e => setRole(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-red-500">
            <option value="viewer">Viewer — Solo puede ver</option>
            <option value="editor">Editor — Puede ver y editar</option>
          </select>
          {errorMsg && <p className="text-xs text-red-600 bg-red-50 p-2 rounded">{errorMsg}</p>}
          {successMsg && <p className="text-xs text-green-600 bg-green-50 p-2 rounded">{successMsg}</p>}
          <button onClick={handleAdd} disabled={saving}
            className="w-full bg-red-700 text-white py-2.5 rounded-lg font-semibold hover:bg-red-800 disabled:opacity-50">
            {saving ? 'Creando...' : '+ Añadir al equipo'}
          </button>
        </div>

        {collaborators.length > 0 && (
          <div>
            <p className="text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Colaboradores actuales</p>
            <div className="space-y-2">
              {collaborators.map(m => (
                <div key={m.id} className="flex items-center justify-between bg-gray-50 rounded-lg px-3 py-2">
                  <div>
                    <p className="text-sm font-medium text-gray-800">{m.collaborator_email}</p>
                    <div className="flex items-center gap-2 mt-0.5">
                      <select value={m.role} onChange={e => handleRole(m.id, e.target.value)}
                        className="text-xs border-0 bg-transparent text-gray-500 outline-none p-0">
                        <option value="viewer">👁 Viewer</option>
                        <option value="editor">✏️ Editor</option>
                      </select>
                      <span className="text-xs text-gray-400">• {m.status === 'active' ? 'Activo' : 'Pendiente'}</span>
                    </div>
                  </div>
                  <button onClick={() => handleRemove(m.id)} className="text-red-400 hover:text-red-600 text-xl ml-2">✕</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </Modal>
  );
};

const App = ({ user }) => {
  const [tab, setTab] = useState('dashboard');
  const [gallos, setGallos] = useState([]);
  const [opciones, setOpciones] = useState({});
  const [toastMsg, setToastMsg] = useState(null);
  const [isCollaborator, setIsCollaborator] = useState(false);
  const [myRole, setMyRole] = useState('viewer');
  const [activeOwnerId, setActiveOwnerId] = useState(user.id);
  const [collaborators, setCollaborators] = useState([]);
  const [showEquipo, setShowEquipo] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const isAdmin = (user.email || '').toLowerCase() === 'yoel2792@gmail.com';
  const [showWelcome, setShowWelcome] = React.useState(false);
  const [showTutorial, setShowTutorial] = React.useState(false);

  const handleTutorialDone = React.useCallback(() => {
    localStorage.setItem('tutorial_done_' + user.id, '1');
    setShowTutorial(false);
    setShowWelcome(false);
  }, [user.id]);
  const canEdit = !isCollaborator || myRole === 'editor';

  // Show tutorial for first-time users
  React.useEffect(() => {
    const key = 'tutorial_done_' + user.id;
    if (!localStorage.getItem(key)) {
      setShowWelcome(true);
    }
  }, [user.id]);

  useEffect(() => {
    const checkAccess = async () => {
      const { data: active } = await supabase.from('memberships')
        .select('*').eq('collaborator_id', user.id).eq('status', 'active').maybeSingle();
      if (active) {
        // app_user = usuario independiente con sus propios datos, NO colaborador
        if (active.role !== 'app_user') {
          setIsCollaborator(true); setMyRole(active.role); setActiveOwnerId(active.owner_id);
        }
        return;
      }
      const { data: pending } = await supabase.from('memberships')
        .select('*').eq('collaborator_email', user.email).eq('status', 'pending').maybeSingle();
      if (pending) {
        await supabase.from('memberships').update({ collaborator_id: user.id, status: 'active' }).eq('id', pending.id);
        if (pending.role !== 'app_user') {
          setIsCollaborator(true); setMyRole(pending.role); setActiveOwnerId(pending.owner_id);
        }
        return;
      }
      const { data: collabs } = await supabase.from('memberships')
        .select('*').eq('owner_id', user.id).order('created_at', { ascending: false });
      setCollaborators(collabs || []);
    };
    checkAccess();
  }, []);

  const toast = useCallback((msg, type = 'success') => {
    setToastMsg({ msg, type });
    setTimeout(() => setToastMsg(null), 3000);
  }, []);

  const loadGallos = useCallback(async () => {
    const { data } = await supabase.from('gallos').select('*').eq('user_id', activeOwnerId).order('nombre');
    setGallos(data || []);
  }, [activeOwnerId]);

  const addOpcion = useCallback(async (categoria, valor) => {
    const clean = valor.trim();
    if (!clean) return;
    setOpciones(prev => ({ ...prev, [categoria]: [...(prev[categoria] || []), clean] }));
    await supabase.from('opciones_dinamicas').insert({ user_id: activeOwnerId, tipo: categoria, valor: clean });
  }, [activeOwnerId]);

  useEffect(() => { loadGallos(); }, [loadGallos]);

  useEffect(() => {
    const loadOpciones = async () => {
      const { data } = await supabase.from('opciones_dinamicas').select('*').eq('user_id', activeOwnerId);
      const map = {};
      (data || []).forEach(({ tipo: categoria, valor }) => {
        if (!map[categoria]) map[categoria] = [];
        map[categoria].push(valor);
      });
      setOpciones(map);
    };
    loadOpciones();
  }, [activeOwnerId]);

  const TABS = [
    { id: 'dashboard', label: '📊', text: 'Inicio' },
    { id: 'gallos', label: '🐓', text: 'Gallos' },
    { id: 'castadero', label: '🧬', text: 'Casta' },
    { id: 'entrenamientos', label: '🏋️', text: 'Entreno' },
    { id: 'peleas', label: '⚔️', text: 'Peleas' },
  ];

  return (
    <AppContext.Provider value={{ gallos, loadGallos, opciones, addOpcion, toast, activeOwnerId, canEdit }}>
      <div className="min-h-screen bg-gray-100 pb-20">
        <div className="bg-red-700 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-md">
          <div>
            <h1 className="text-lg font-bold leading-tight">🐓 Gallero PR <span className="text-[10px] font-normal text-red-200 align-middle">v4</span></h1>
            {isCollaborator && <p className="text-xs text-red-200">Viendo gallos ajenos ({myRole})</p>}
          </div>
          <div className="flex items-center gap-2">
            {isAdmin && (
              <button onClick={() => setShowAdmin(true)} className="bg-yellow-500 hover:bg-yellow-400 text-yellow-900 px-3 py-1.5 rounded-lg text-xs font-semibold">
                ⚙️ Usuarios
              </button>
            )}
            {!isCollaborator && (
              <button onClick={() => setShowEquipo(true)} className="bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg text-xs font-semibold">
                👥 Equipo
              </button>
            )}
            <button onClick={() => { supabase.auth.signOut().then(() => { window.location.href = window.location.pathname; }); }}
              className="bg-red-800 hover:bg-red-900 px-3 py-1.5 rounded-lg text-xs font-semibold">
              Salir
            </button>
          </div>
        </div>

        <div className="px-4 py-4 max-w-2xl mx-auto">
          {tab === 'gallos' && <GeneticaModule />}
          {tab === 'castadero' && <CastaderoModule />}
          {tab === 'entrenamientos' && <EntrenamientosModule />}
          {tab === 'peleas' && <PeleasModule />}
          {tab === 'dashboard' && <DashboardModule />}
        </div>

        <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 shadow-lg">
          <div className="flex max-w-2xl mx-auto">
            {TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`flex-1 py-2 flex flex-col items-center justify-center gap-0.5 font-medium transition-colors ${tab === t.id ? 'text-red-700 border-t-2 border-red-700 -mt-px' : 'text-gray-500 hover:text-gray-700'}`}>
                <span className="text-lg leading-none">{t.label}</span>
                <span className="text-[10px] leading-none whitespace-nowrap">{t.text}</span>
              </button>
            ))}
          </div>
        </nav>

        {toastMsg && <Toast message={toastMsg.msg} type={toastMsg.type} onClose={() => setToastMsg(null)} />}

        {showEquipo && (
          <GestionEquipoModal
            onClose={() => setShowEquipo(false)}
            user={user}
            collaborators={collaborators}
            setCollaborators={setCollaborators}
          />
        )}
        {showAdmin && <AdminModal onClose={() => setShowAdmin(false)} user={user} />}
        {showWelcome && !showTutorial && (
          <WelcomePrompt
            onYes={() => { setShowWelcome(false); setShowTutorial(true); }}
            onNo={handleTutorialDone}
          />
        )}
        {showTutorial && (
          <TutorialModal onFinish={handleTutorialDone} onSkip={handleTutorialDone} />
        )}
      </div>
    </AppContext.Provider>
  );
};

        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <Input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" required />
        </div>
        {error && <p className="text-sm text-red-600 bg-red-50 p-2 rounded-lg text-center">{error}</p>}
        <button type="submit" disabled={loading}
          className="w-full bg-red-700 text-white py-3 rounded-xl font-bold text-base hover:bg-red-800 disabled:opacity-50 transition">
          {loading ? 'Entrando...' : 'Entrar'}
        </button>
      </form>
      <p className="text-red-300 text-xs mt-6">Acceso solo por invitación</p>
    </div>
  );
};

// ============================================
// RAÍZ
// ============================================
const AuthRoot = () => {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    supabase.auth.getSession().then(({ data: { session } }) => {
      setUser(session?.user ?? null);
      setChecking(false);
    });
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      setUser(session?.user ?? null);
    });
    return () => subscription.unsubscribe();
  }, []);

  if (checking) return (
    <div className="min-h-screen bg-red-700 flex items-center justify-center">
      <div className="text-white text-center">
        <div className="text-5xl mb-3">🐓</div>
        <p className="text-lg font-semibold">Cargando...</p>
      </div>
    </div>
  );

  if (!user) return <LoginScreen onLogin={setUser} />;
  return <ErrorBoundary><App user={user} /></ErrorBoundary>;
};

ReactDOM.render(<AuthRoot />, document.getElementById('root'));
    </script>
</body>
</html>
