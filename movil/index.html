<style>

button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left; }
a { color:inherit; text-decoration:none; }
#app { max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom)); }

.busca { margin-top:10px; position:relative; }

.busca .lupa { position:absolute; left:15px; top:50%; transform:translateY(-50%); font-size:19px; opacity:.55; }

.cuerpo { padding:14px 14px 0; }

.obs { font-size:15px; color:#44403c; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:11px 13px; margin-top:8px; }

.par { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

.lado { font-size:13px; color:var(--gris); margin:10px 4px 6px; font-weight:600; }

.caja { background:#fff; border:1px solid var(--linea); border-radius:16px; padding:13px 14px; }
.sangre + .sangre { margin-top:11px; }

.tag { display:inline-block; font-size:12px; font-weight:700; background:#fbbf24; color:#78350f; padding:2px 7px; border-radius:99px; margin-left:4px; white-space:nowrap; }
.nota { font-size:13px; color:var(--suave); margin-top:10px; }

.casta { display:block; width:100%; background:#fff; border:1px solid var(--linea); border-radius:16px; padding:13px 14px; margin-bottom:8px; }

.fase { display:inline-block; font-size:13px; font-weight:700; padding:4px 10px; border-radius:99px; margin-top:8px; }
.f-echada { background:#fce7f3; color:var(--rosa); } .f-poniendo { background:#fef9c3; color:#854d0e; } .f-empollando { background:#dbeafe; color:var(--azul); }

.paso { display:flex; gap:12px; }

.paso .t { padding-bottom:14px; }

.nav { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--linea); padding-bottom:env(safe-area-inset-bottom); }

.login { min-height:100vh; background:linear-gradient(#b91c1c,#7f1d1d); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; margin-bottom:-84px; }

.boton { display:block; width:100%; text-align:center; background:var(--rojo); color:#fff; font-weight:700; font-size:18px; padding:14px; border-radius:14px; }
